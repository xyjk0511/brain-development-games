<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages serves this file for unknown SPA routes. Convert
      // /brain-development-games/games/... into /brain-development-games/?/games/...
      // so index.html can restore the original route before React starts.
      ;(function () {
        var pathSegmentsToKeep = 1
        var location = window.location
        var basePath = location.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/')
        var routePath = location.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~')
        var query = location.search
          ? '&' + location.search.slice(1).replace(/&/g, '~and~')
          : ''

        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            basePath +
            '/?/' +
            routePath +
            query +
            location.hash
        )
      })()
    </script>
  </head>
  <body></body>
</html>
