<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>字字小乐园</title>
  <style>
    :root{
      --cream:#fff8e8; --sky:#dff5ff; --mint:#bff0cd; --green:#51aa45; --deep:#38515b;
      --orange:#ff8c66; --yellow:#ffd66b; --purple:#b9a8ff; --card:rgba(255,255,248,.94);
      --shadow:0 16px 40px rgba(63,94,105,.20); --soft:0 8px 22px rgba(63,94,105,.16);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#e8f8ff 0%,#fff8e8 65%,#e8f7df 100%);color:var(--deep);font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;}
    button{font:inherit;border:0;cursor:pointer}
    button:focus-visible,.choice:focus-visible{outline:4px solid #ffba4a;outline-offset:4px}
    .app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;overflow:hidden}
    .shell{width:min(1180px,100%);min-height:min(760px,calc(100vh - 44px));border-radius:34px;background:rgba(255,255,255,.74);box-shadow:var(--shadow);position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.9)}
    .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.94}
    .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.75),rgba(255,255,255,.35));z-index:1}
    .content{position:relative;z-index:2;padding:34px;height:100%;min-height:760px;display:flex;flex-direction:column}
    .center{align-items:center;justify-content:center;text-align:center}
    .row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
    .card{background:var(--card);border:3px solid rgba(255,255,255,.9);border-radius:30px;box-shadow:var(--soft);padding:24px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.88);box-shadow:var(--soft);font-weight:900;color:#47656d}
    h1{font-size:clamp(46px,7vw,84px);line-height:1;margin:0 0 14px;color:#3ca767;text-shadow:0 4px 0 rgba(255,255,255,.75)}
    h2{font-size:clamp(34px,4.2vw,54px);line-height:1.12;margin:0 0 16px;color:#ed6d54}
    h3{font-size:30px;margin:0 0 10px;color:#3d6d74}
    p{font-size:23px;line-height:1.65;margin:8px 0}
    .small{font-size:19px;color:#607780}.big{font-size:32px;font-weight:900}.muted{color:#708991}.green{color:#3d9c43}.orange{color:#e36a4d}.purple{color:#7763c8}
    .btn{min-width:170px;min-height:64px;border-radius:999px;padding:16px 28px;color:white;font-size:26px;font-weight:900;box-shadow:0 8px 0 rgba(29,112,42,.22),var(--soft);transition:transform .15s ease,filter .15s ease}
    .btn:hover{transform:translateY(-2px);filter:brightness(1.03)}
    .btn:active{transform:translateY(2px);box-shadow:var(--soft)}
    .primary{background:linear-gradient(180deg,#7fd65c,#48a83e)}.secondary{background:linear-gradient(180deg,#78c5ff,#3f91d0)}.warm{background:linear-gradient(180deg,#ffb36b,#f07a59)}.quiet{background:linear-gradient(180deg,#e7eef1,#b7cdd4);color:#36545c}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;position:relative;z-index:4}
    .hud-left,.hud-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hud-right{justify-content:flex-end}
    .round-btn{width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:var(--soft);font-size:28px;color:#4b6a70;font-weight:900;border:3px solid rgba(255,255,255,.95)}
    .target{margin:0 auto 18px;max-width:760px;border-radius:28px;background:rgba(255,255,255,.94);box-shadow:var(--soft);border:3px solid #d7f0ee;padding:16px 24px;display:flex;gap:18px;align-items:center;justify-content:center;min-height:112px;position:relative;z-index:3}
    .target img{width:82px;height:82px;border-radius:22px;object-fit:cover}.target .label{font-size:32px;font-weight:900;color:#43676e}.target .sub{display:block;font-size:20px;font-weight:700;color:#758a91;margin-top:4px}
    .option-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(150px,1fr));gap:20px;width:min(920px,100%);margin:0 auto;position:relative;z-index:3}
    .choice{background:rgba(255,255,255,.94);border:4px solid #d6edf5;border-radius:30px;min-height:190px;padding:16px;box-shadow:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .13s ease,border-color .13s ease,box-shadow .13s ease}.choice:hover{transform:translateY(-3px);border-color:#9de2c0}.choice img{width:98px;height:98px;border-radius:24px;object-fit:cover}.choice .word{font-size:30px;font-weight:900;color:#3f5961}.choice .index{font-size:17px;color:#7c9298}
    .choice.correct-glow{border-color:#6bc76b;box-shadow:0 0 0 8px rgba(119,218,113,.22),var(--soft)}.choice.soft-wrong{border-color:#ffd19b;box-shadow:0 0 0 8px rgba(255,198,128,.18),var(--soft)}
    .feedback{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;background:rgba(255,255,255,.96);border-radius:28px;padding:18px 26px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;font-size:32px;font-weight:900;color:#3e8a3f;border:3px solid #dff4d9}.feedback img{width:76px;height:76px;border-radius:20px;object-fit:cover}
    .home-layout{height:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}.hero-img{width:100%;border-radius:32px;box-shadow:var(--shadow);border:3px solid rgba(255,255,255,.95)}.home-panel{max-width:520px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.info-box{background:rgba(255,255,255,.92);border-radius:24px;padding:20px;box-shadow:var(--soft);border:2px solid rgba(255,255,255,.92);text-align:left}.info-box p{font-size:20px}.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}.steps li{font-size:22px;line-height:1.6;margin:8px 0;padding-left:44px;position:relative}.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:3px;width:32px;height:32px;border-radius:50%;background:#5dbc5b;color:white;font-weight:900;text-align:center;line-height:32px}
    .tutorial-stage{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;flex:1}.stage-img{width:100%;border-radius:30px;box-shadow:var(--shadow);border:3px solid rgba(255,255,255,.95)}.demo-area{position:relative;min-height:360px}.demo-options{display:flex;gap:18px;justify-content:center;margin-top:18px}.demo-card{width:170px;height:160px;border-radius:24px;background:#fff;box-shadow:var(--soft);border:4px solid #d9eef2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:900}.demo-card img{width:88px;height:88px;border-radius:22px;object-fit:cover}.hand{position:absolute;width:120px;height:120px;right:34%;bottom:46px;animation:tap 1.2s infinite ease-in-out;z-index:4}@keyframes tap{0%,100%{transform:translateY(0) scale(1)}55%{transform:translateY(12px) scale(.95)}}
    .modal-layer{position:absolute;inset:0;background:rgba(36,63,70,.38);z-index:30;display:flex;align-items:center;justify-content:center;padding:24px}.modal{width:min(760px,100%);background:rgba(255,255,248,.98);border-radius:34px;padding:30px;box-shadow:var(--shadow);border:4px solid #fff;text-align:center}.modal img{max-width:220px;border-radius:28px;box-shadow:var(--soft)}
    .playfield{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}.bottom-tip{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:999px;padding:12px 22px;font-size:20px;box-shadow:var(--soft);z-index:4}.countdown{font-size:120px;font-weight:900;color:#ef7255;text-shadow:0 8px 0 rgba(255,255,255,.85)}
    .result-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;align-items:center}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.stat{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--soft);font-size:22px}.stat b{display:block;font-size:30px;color:#3c9850}.badge-img{width:100%;max-width:420px;border-radius:30px;box-shadow:var(--soft)}
    .low-toggle{position:absolute;right:22px;bottom:18px;z-index:10;background:rgba(255,255,255,.92);border-radius:999px;padding:10px 16px;box-shadow:var(--soft);font-weight:900;font-size:18px;color:#4a686f}.low-toggle input{transform:scale(1.3);margin-right:8px}
    .progress{height:14px;background:#e7f3f1;border-radius:999px;overflow:hidden;margin-top:10px}.bar{height:100%;background:linear-gradient(90deg,#7fd65c,#ffd66b);width:var(--w,0%)}
    @media (max-width:840px){.content{padding:22px;min-height:720px}.home-layout,.tutorial-stage,.result-grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.option-grid{--cols:2!important}.btn{font-size:22px;min-width:140px}.choice{min-height:160px}.choice .word{font-size:25px}.stage-img{max-height:260px;object-fit:cover}h1{font-size:48px}h2{font-size:36px}.target .label{font-size:27px}.shell{min-height:calc(100vh - 26px)}.app{padding:13px}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.btn:hover,.choice:hover{transform:none}}
  </style>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>
  <script>
    (function(){
      "use strict";
      const A={
        home:"assets/home-card.png", detail:"assets/detail-cover.png", cover:"assets/cover-poster.png",
        t1:"assets/tutorial-1.png", t2:"assets/tutorial-2.png", t3:"assets/tutorial-3.png", t4:"assets/tutorial-4.png", t5:"assets/tutorial-5.png", t6:"assets/tutorial-6.png",
        practice:"assets/practice-bg.png", ready:"assets/ready-bg.png", game:"assets/game-bg.png", result:"assets/result-bg.png",
        apple:"assets/apple.png", banana:"assets/banana.png", grape:"assets/grape.png", pencil:"assets/pencil.png", book:"assets/book.png", ball:"assets/ball.png", flower:"assets/flower.png", bird:"assets/bird.png", bear:"assets/bear.png",
        main:"assets/main-character.png", hand:"assets/hand.png", success:"assets/success-sticker.png", hint:"assets/hint-sticker.png", badge:"assets/badge.png"
      };
      const items=[
        {id:"apple",word:"苹果",cat:"水果",tags:["能吃的","水果"],img:A.apple},
        {id:"banana",word:"香蕉",cat:"水果",tags:["能吃的","水果"],img:A.banana},
        {id:"grape",word:"葡萄",cat:"水果",tags:["能吃的","水果"],img:A.grape},
        {id:"pencil",word:"铅笔",cat:"文具",tags:["文具","能写字"],img:A.pencil},
        {id:"book",word:"书本",cat:"文具",tags:["文具","能阅读"],img:A.book},
        {id:"bird",word:"小鸟",cat:"动物",tags:["动物","会飞"],img:A.bird},
        {id:"bear",word:"小熊",cat:"动物",tags:["动物","会陪伴"],img:A.bear},
        {id:"ball",word:"足球",cat:"玩具",tags:["玩具","能玩"],img:A.ball},
        {id:"flower",word:"花朵",cat:"植物",tags:["植物","花园"],img:A.flower}
      ];
      const levels={
        1:{time:90,total:6,options:2,label:"第 1 级｜轻松找名字",pass:3},
        2:{time:85,total:8,options:2,label:"第 2 级｜轻松找图片",pass:4},
        3:{time:80,total:10,options:3,label:"第 3 级｜轻松分小篮",pass:5},
        4:{time:75,total:12,options:3,label:"第 4 级｜花朵分组",pass:7},
        5:{time:70,total:14,options:3,label:"第 5 级｜同类小书签",pass:8},
        6:{time:70,total:15,options:4,label:"进阶挑战｜第 6 级",pass:9},
        7:{time:65,total:16,options:4,label:"进阶挑战｜第 7 级",pass:10},
        8:{time:60,total:18,options:4,label:"进阶挑战｜第 8 级",pass:12},
        9:{time:60,total:20,options:5,label:"进阶挑战｜第 9 级",pass:14},
        10:{time:60,total:22,options:5,label:"进阶挑战｜第 10 级",pass:16}
      };
      const practiceTasks=[
        {target:items[0],choices:[items[0],items[3]],instruction:"找出：苹果"},
        {target:items[5],choices:[items[5],items[1]],instruction:"找出：小鸟"},
        {target:items[3],choices:[items[3],items[2]],instruction:"找出：铅笔"}
      ];
      const safeGet=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
      const safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
      const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
      const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
      const shuffle=arr=>arr.slice().sort(()=>Math.random()-.5);
      const byId=id=>items.find(x=>x.id===id);
      let state={view:"home", tutorial:0, level:clamp(parseInt(safeGet("字字小乐园_推荐难度","1"),10)||1,1,10), low:safeGet("字字小乐园_低刺激","0")==="1", practiceIndex:0, practiceFeedback:"", practiceHint:false, countdown:3, task:null, taskStart:0, feedback:null, round:null, result:null};
      let timer=null, feedbackTimer=null, countdownTimer=null;
      const app=document.getElementById("app");
      function clearAll(){ if(timer){clearInterval(timer);timer=null} if(feedbackTimer){clearTimeout(feedbackTimer);feedbackTimer=null} if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null} }
      function shell(inner,bg,extra=""){
        const low=state.low && state.view==="playing";
        return `<section class="shell ${extra}">${bg?`<img class="bg" src="${low?A.game:bg}" alt="小书屋和词语花园背景">`:""}<div class="scrim"></div><div class="content">${inner}</div><label class="low-toggle"><input type="checkbox" ${state.low?"checked":""} onchange="toggleLow(this.checked)">低刺激模式</label></section>`;
      }
      function render(){
        if(state.view==="home") return renderHome();
        if(state.view==="detail") return renderDetail();
        if(state.view==="cover") return renderCover();
        if(state.view==="tutorial") return renderTutorial();
        if(state.view==="practice") return renderPractice();
        if(state.view==="ready") return renderReady();
        if(state.view==="countdown") return renderCountdown();
        if(state.view==="playing") return renderPlaying();
        if(state.view==="paused") return renderPaused();
        if(state.view==="result") return renderResult();
      }
      function renderHome(){
        clearAll();
        const next=levels[state.level].label;
        app.innerHTML=shell(`<div class="home-layout"><div><img class="hero-img" src="${A.home}" alt="字字小乐园首页卡片"></div><div class="home-panel card"><span class="pill">语言理解 · 字词匹配 · 语义联想</span><h1>字字小乐园</h1><p class="big">在小书屋和词语花园里，帮词语花朵找到合适的词语朋友。</p><p>本地记录推荐难度：<b>${next}</b></p><div class="row" style="justify-content:flex-start;margin-top:18px"><button class="btn primary" onclick="goDetail()">开始游戏</button><button class="btn secondary" onclick="goDetail()">怎么玩</button></div></div></div>`, null);
      }
      function renderDetail(){
        clearAll();
        app.innerHTML=shell(`<div class="topbar"><button class="round-btn" onclick="goHome()" aria-label="返回首页">←</button><span class="pill">说明</span></div><div class="info-grid"><div><img class="hero-img" src="${A.detail}" alt="玩法说明图"></div><div class="card"><h2>怎么玩</h2><ol class="steps"><li>看上方目标卡。</li><li>在中间选择合适的图片或词语。</li><li>答对会收集星星。</li><li>时间内完成更多题目，花园会更亮。</li></ol><h2 style="margin-top:22px">目标是什么</h2><p>目标是帮词语花朵找朋友：有时找同名词，有时找同一类，有时找“能吃的”“文具”等分类。</p><p class="small">第 1 到第 3 级非常容易；第 6 级以后会标为“进阶挑战”。</p><div class="row" style="justify-content:flex-start;margin-top:18px"><button class="btn primary" onclick="goCover()">进入封面页</button><button class="btn quiet" onclick="goHome()">返回首页</button></div></div></div>`, A.detail);
      }
      function renderCover(){
        clearAll();
        app.innerHTML=shell(`<div class="center" style="height:100%;justify-content:flex-end;padding-bottom:34px"><div class="card" style="max-width:720px;margin:auto auto 0"><h1>字字小乐园</h1><p class="big">一起到词语花园里探险吧！</p><p>先看一段真实场景里的小演示，再玩 3 个轻松练习。</p><button class="btn primary" onclick="startTutorial()">进入教学</button></div></div>`, A.cover);
      }
      const tutorialText=[
        {img:A.t1,title:"第 1/6 屏：欢迎来到小书屋",text:"我是铅笔小鸟，旁边是书本小熊。我们一起帮词语花朵找朋友。",tip:"先认识场景，不急着答题。"},
        {img:A.t2,title:"第 2/6 屏：目标会出现",text:"看上方目标卡，它会告诉你现在要找什么。",tip:"目标卡会一直显示。"},
        {img:A.t3,title:"第 3/6 屏：选项会放在中间",text:"这次目标是苹果。花园里会出现几个候选朋友。",tip:"只需要看一看，哪一个和目标最合适。"},
        {img:A.t4,title:"第 4/6 屏：看到合适的就点一下",text:"手势会点击苹果。每发现一个目标，点击一次。",tip:"轻轻点一下就可以。"},
        {img:A.t5,title:"第 5/6 屏：星星会加一",text:"点到合适的朋友后，星星数量会增加。",tip:"反馈很轻，不会打断你。"},
        {img:A.t6,title:"第 6/6 屏：准备轻松练习",text:"先玩 3 个很容易的小练习，再进入正式训练。",tip:"正式训练前会再让你确认。"}
      ];
      function renderTutorial(){
        clearAll();
        const t=tutorialText[state.tutorial];
        const visual=state.tutorial===3?`<div class="demo-area"><div class="demo-options"><div class="demo-card"><img src="${A.apple}" alt="苹果"><span>苹果</span></div><div class="demo-card"><img src="${A.banana}" alt="香蕉"><span>香蕉</span></div></div><img class="hand" src="${A.hand}" alt="点击手势"></div>`: state.tutorial===4?`<div class="card center"><p class="big">星星：0 → 1</p><img src="${A.success}" alt="答对反馈" style="width:150px;border-radius:24px"><p>每发现一个目标，分数就会加一。</p></div>`:`<img class="stage-img" src="${t.img}" alt="${t.title}">`;
        app.innerHTML=shell(`<div class="topbar"><span class="pill">教学</span><span class="pill">${t.title}</span></div><div class="tutorial-stage"><div>${visual}</div><div class="card"><h2>${t.title}</h2><div class="target"><img src="${A.apple}" alt="苹果"><div class="label">目标是什么：找到苹果<span class="sub">目标卡会一直放在上面</span></div></div><p>${t.text}</p><p class="small">${t.tip}</p><div class="progress" style="--w:${(state.tutorial+1)/6*100}%"><div class="bar"></div></div><div class="row" style="margin-top:22px"><button class="btn quiet" onclick="goCover()">返回封面</button><button class="btn primary" onclick="nextTutorial()">${state.tutorial===5?"开始小练习":"下一步"}</button></div></div></div>`, t.img);
      }
      function renderPractice(){
        clearAll();
        const p=practiceTasks[state.practiceIndex];
        app.innerHTML=shell(`<div class="topbar"><span class="pill">低压练习</span><span class="pill">${state.practiceIndex+1}/3</span></div><div class="playfield"><div class="target"><img src="${p.target.img}" alt="${p.target.word}"><div class="label">目标是什么：${p.instruction}<span class="sub">不计正式分数，不限紧张时间</span></div></div><div class="option-grid" style="--cols:2">${p.choices.map((c,i)=>`<button class="choice ${state.practiceHint&&c.id===p.target.id?"correct-glow":""}" onclick="choosePractice('${c.id}')"><span class="index">按 ${i+1}</span><img src="${c.img}" alt="${c.word}"><span class="word">${c.word}</span></button>`).join("")}</div>${state.practiceFeedback?`<div class="bottom-tip">${state.practiceFeedback}</div>`:"<div class='bottom-tip'>先找一找，哪张卡和目标一样。</div>"}</div>`, A.practice);
      }
      function renderReady(){
        clearAll();
        app.innerHTML=shell(`<div class="center" style="height:100%"><div class="modal" style="position:relative"><img src="${A.flower}" alt="词语花朵"><h2>准备开始训练吧！</h2><p>目标卡会一直在上面。看到合适的图片或词语，就点一下。</p><p>答对会收集星星，遇到难题也会有小提示。</p><p class="small">当前难度：${levels[state.level].label}</p><div class="row" style="margin-top:20px"><button class="btn secondary" onclick="startTutorial()">重新演示</button><button class="btn primary" onclick="enterTraining()">进入训练</button></div></div></div>`, A.ready);
      }
      function renderCountdown(){
        app.innerHTML=shell(`<div class="center" style="height:100%"><div class="card"><div class="countdown">${state.countdown}</div><h2>${state.countdown===3?"小书屋准备好啦":state.countdown===2?"词语花朵亮起来":"开始找朋友"}</h2></div></div>`, A.game);
      }
      function hud(){
        const r=state.round, cfg=levels[state.level];
        return `<div class="topbar"><div class="hud-left"><button class="round-btn" onclick="pauseGame()" aria-label="暂停">Ⅱ</button><span class="pill">${cfg.label}</span></div><div class="hud-right"><span class="pill">剩余 ${r.remaining} 秒</span><span class="pill">星星 ${r.score}</span></div></div>`;
      }
      function targetCard(task){
        return `<div class="target"><img src="${task.targetImg}" alt="${task.targetAlt}"><div class="label">目标是什么：${task.instruction}<span class="sub">怎么玩：看目标卡，再点中间合适的一张</span></div></div>`;
      }
      function renderPlaying(){
        const task=state.task, r=state.round;
        app.innerHTML=shell(`${hud()}<div class="playfield">${targetCard(task)}<div class="option-grid" style="--cols:${Math.min(task.options.length,5)}">${task.options.map((o,i)=>`<button class="choice ${state.feedback&&o.id===task.correctId?"correct-glow":""} ${state.feedback&&state.feedback.picked===o.id&&!state.feedback.correct?"soft-wrong":""}" onclick="chooseOption('${o.id}')"><span class="index">按 ${i+1}</span><img src="${o.img}" alt="${o.word}"><span class="word">${o.word}</span></button>`).join("")}</div><div class="bottom-tip">第 ${r.answered+1}/${r.total} 朵词语花 · 目标卡一直在上面</div>${state.feedback?`<div class="feedback"><img src="${state.feedback.correct?A.success:A.hint}" alt="反馈"><span>${state.feedback.text}</span></div>`:""}</div>`, A.game);
      }
      function renderPaused(){
        app.innerHTML=shell(`${hud()}<div class="playfield">${targetCard(state.task)}</div><div class="modal-layer"><div class="modal"><h2>先休息一下</h2><p>词语花园会在这里等你。</p><div class="row"><button class="btn primary" onclick="resumeGame()">继续训练</button><button class="btn secondary" onclick="restartRound()">重新开始</button><button class="btn quiet" onclick="goHome()">返回首页</button></div></div></div>`, A.game);
      }
      function renderResult(){
        clearAll();
        const r=state.result, rec=levels[r.nextLevel].label;
        app.innerHTML=shell(`<div class="result-grid" style="height:100%"><div class="center"><img class="badge-img" src="${A.badge}" alt="结算徽章"><h2>这一轮完成啦！</h2><p>你帮词语花朵找到了很多朋友。</p></div><div class="card"><h2>本轮表现</h2><div class="stats"><div class="stat">正确数<b>${r.correct}/${r.total}</b></div><div class="stat">正确率<b>${r.accuracy}%</b></div><div class="stat">平均用时<b>${r.avgText}</b></div><div class="stat">本轮难度<b>${levels[r.level].label}</b></div></div><h2>下轮推荐难度</h2><p class="big ${r.nextLevel>=6?"orange":"green"}">${rec}</p><p>${r.reason}</p>${r.nextLevel>=6?`<p class="pill">进阶挑战：会加入更多同类词和相近分类。</p>`:"<p class='pill'>轻松关卡：继续保持容易成功的节奏。</p>"}<div class="row" style="margin-top:22px"><button class="btn primary" onclick="playRecommended()">按推荐难度再玩</button><button class="btn secondary" onclick="playEasy()">轻松复习</button><button class="btn quiet" onclick="goHome()">返回首页</button></div></div></div>`, A.result);
      }
      function makeTask(level){
        const cfg=levels[level];
        let type="match";
        if(level===3) type="category";
        if(level>=4) type=Math.random()<.45?"match":(Math.random()<.65?"category":"same");
        if(level>=6) type=Math.random()<.35?"category":"same";
        if(type==="match"){
          const target=pick(items);
          const pool=shuffle(items.filter(x=>x.id!==target.id && (level<=3?x.cat!==target.cat:true))).slice(0,cfg.options-1);
          return {type,instruction:`找到：${target.word}`,targetImg:target.img,targetAlt:target.word,correctId:target.id,options:shuffle([target,...pool])};
        }
        if(type==="category"){
          const cats=level<=3?["水果","文具","动物"]:["水果","文具","动物","玩具","植物"];
          const cat=pick(cats); const correct=pick(items.filter(x=>x.cat===cat));
          let pool=shuffle(items.filter(x=>x.cat!==cat)).slice(0,cfg.options-1);
          return {type,instruction:`找一找：${cat}`,targetImg:correct.img,targetAlt:cat,correctId:correct.id,options:shuffle([correct,...pool])};
        }
        const sameCats=["水果","文具","动物"]; const cat=pick(sameCats); const group=shuffle(items.filter(x=>x.cat===cat)); const target=group[0], correct=group[1]||group[0];
        const pool=shuffle(items.filter(x=>x.cat!==cat)).slice(0,cfg.options-1);
        return {type,instruction:`找同类：${target.word}`,targetImg:target.img,targetAlt:target.word,correctId:correct.id,options:shuffle([correct,...pool])};
      }
      function nextTask(){
        if(!state.round) return;
        if(state.round.answered>=state.round.total || state.round.remaining<=0) return finishRound();
        state.task=makeTask(state.level); state.taskStart=Date.now(); state.feedback=null; render();
      }
      function startTimer(){
        if(timer) clearInterval(timer);
        timer=setInterval(()=>{
          if(state.view!=="playing") return;
          state.round.remaining--;
          if(state.round.remaining<=0){finishRound();return;}
          render();
        },1000);
      }
      function decide(stats){
        const acc=stats.total?stats.correct/stats.total:0; const avg=stats.times.length?stats.times.reduce((a,b)=>a+b,0)/stats.times.length:9999;
        let next=stats.level, reason="这个节奏合适，继续在当前花园练习。";
        if(stats.level<=3){
          if(acc>=.85 && avg<5200 && stats.correct>=levels[stats.level].pass){next=Math.min(4,stats.level+1);reason="这一轮很顺利，下轮可以多认识一点词语朋友。"}
          else if(acc<.5 || avg>12000){next=Math.max(1,stats.level-1);reason="下轮换成更轻松的图词匹配，慢慢找朋友。"}
        }else{
          if(acc>=.82 && avg<4600){next=Math.min(10,stats.level+1);reason="表现稳定，下轮可以尝试更丰富的词语关系。"}
          else if(acc<.55 || avg>9500){next=Math.max(1,stats.level-1);reason="下轮减少干扰项，让任务更轻松。"}
        }
        if(state.low) next=Math.min(next,stats.level+1);
        return {next,reason,avg};
      }
      window.goDetail=function(){state.view="detail";render()};
      window.goCover=function(){state.view="cover";render()};
      window.goHome=function(){clearAll();state.view="home";state.feedback=null;render()};
      window.toggleLow=function(v){state.low=!!v; safeSet("字字小乐园_低刺激",state.low?"1":"0"); render()};
      window.startTutorial=function(){clearAll();state.view="tutorial";state.tutorial=0;render()};
      window.nextTutorial=function(){ if(state.tutorial<5){state.tutorial++; render()} else {state.view="practice";state.practiceIndex=0;state.practiceFeedback="";state.practiceHint=false;render()} };
      window.choosePractice=function(id){
        const p=practiceTasks[state.practiceIndex];
        if(id===p.target.id){state.practiceFeedback="找到了！词语花朵亮起来啦。";state.practiceHint=false;render();setTimeout(()=>{if(state.practiceIndex<2){state.practiceIndex++;state.practiceFeedback="";render()}else{state.view="ready";render()}},650)}
        else{state.practiceFeedback="这朵花还在找另一个朋友，我们再看看。";state.practiceHint=true;render()}
      };
      window.enterTraining=function(){clearAll();state.view="countdown";state.countdown=3;render();countdownTimer=setInterval(()=>{state.countdown--; if(state.countdown<=0){clearInterval(countdownTimer);countdownTimer=null;startRound()} else render()},900)};
      function startRound(){
        clearAll(); const cfg=levels[state.level];
        state.view="playing"; state.round={level:state.level,total:cfg.total,remaining:cfg.time,score:0,correct:0,wrong:0,hints:0,answered:0,times:[],started:Date.now()};
        nextTask(); startTimer();
      }
      window.restartRound=function(){state.view="countdown";state.countdown=3;window.enterTraining()};
      window.chooseOption=function(id){
        if(state.view!=="playing" || state.feedback) return;
        const t=state.task, r=state.round, correct=id===t.correctId, response=Date.now()-state.taskStart;
        r.times.push(response); r.answered++;
        if(correct){r.correct++; r.score+=10; state.feedback={correct:true,picked:id,text:"找到了！星星加一颗。"};}
        else{r.wrong++; r.hints++; state.feedback={correct:false,picked:id,text:"这朵花还在找另一个朋友。"};}
        render();
        feedbackTimer=setTimeout(()=>{ if(r.answered>=r.total || r.remaining<=0) finishRound(); else nextTask(); }, correct?650:900);
      };
      window.pauseGame=function(){ if(state.view!=="playing") return; if(timer){clearInterval(timer);timer=null} state.view="paused"; render() };
      window.resumeGame=function(){ if(state.view!=="paused") return; state.view="playing"; render(); startTimer() };
      function finishRound(){
        clearAll(); const r=state.round; if(!r) return;
        const total=Math.max(1,r.answered); const acc=Math.round(r.correct/total*100); const d=decide({level:state.level,total,correct:r.correct,times:r.times});
        const avgMs=d.avg; const avgText=avgMs>9000?"较慢":(avgMs/1000).toFixed(1)+" 秒";
        const result={level:state.level,total,correct:r.correct,wrong:r.wrong,score:r.score,accuracy:acc,avgMs,avgText,nextLevel:d.next,reason:d.reason,ended:Date.now()};
        state.result=result; state.view="result"; safeSet("字字小乐园_最近表现",JSON.stringify(result)); safeSet("字字小乐园_推荐难度",String(d.next)); render();
      }
      window.playRecommended=function(){state.level=state.result?state.result.nextLevel:state.level;window.enterTraining()};
      window.playEasy=function(){state.level=Math.max(1,(state.result?state.result.nextLevel:state.level)-1);window.enterTraining()};
      document.addEventListener("keydown",function(e){
        if(e.key==="Escape" && state.view==="playing") window.pauseGame();
        if(state.view==="playing" && /^[1-5]$/.test(e.key)){const idx=parseInt(e.key,10)-1; const opt=state.task && state.task.options[idx]; if(opt) window.chooseOption(opt.id)}
        if(state.view==="practice" && /^[1-2]$/.test(e.key)){const idx=parseInt(e.key,10)-1; const p=practiceTasks[state.practiceIndex]; if(p.choices[idx]) window.choosePractice(p.choices[idx].id)}
      });
      render();
    })();
  </script>
</body>
</html>
