<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小镇小故事｜Social Inference</title>
  <link rel="stylesheet" href="../shared/unified.css" />
</head>
<body>
  <div id="app"></div>
  <script src="../shared/unified.js"></script>
  <script src="../shared/domain-gap-game.js"></script>
  <script>
    CognitiveDomainGame.mount({
      gameId: 'social-scenario',
      title: '小镇小故事',
      subtitle: '读懂小场景，判断人物可能的感受或合适做法。',
      domain: 'social-cognition',
      domainLabel: '社会认知',
      taskFamily: 'social-inference',
      primaryParadigm: 'Social Inference / Theory of Mind',
      basis: '参考 Theory of Mind、社会情境理解和情绪推断任务；不复制 Reading the Mind in the Eyes、Faux Pas 等受保护测验材料。',
      instructions: '每题读一个短情境，选择最合理的感受或做法。题目用于日常练习，不等同临床社会认知评估。',
      mascot: '🏘️',
      tone1: '#ffe4b5',
      tone2: '#c9f0dd',
      accent: '#9b6a24',
      accent2: '#f3b35f',
      rounds: 10,
      trials: [
        { kind: 'story', story: '小雨把拼图拼好了，朋友说：“你做得真认真！”', prompt: '小雨最可能感到什么？', correct: '开心', options: ['开心','害怕','生气'], condition: { cue: 'praise' } },
        { kind: 'story', story: '小杰排队时不小心踩到别人，他马上说：“对不起。”', prompt: '接下来最合适的是？', correct: '等对方回应并小心站好', options: ['等对方回应并小心站好','马上跑开','大声责怪别人'], condition: { cue: 'apology' } },
        { kind: 'story', story: '同桌的铅笔掉到地上，他还没有发现。', prompt: '你可以怎么做？', correct: '提醒他或帮他捡起来', options: ['提醒他或帮他捡起来','把铅笔藏起来','假装没看见并笑'], condition: { cue: 'helping' } },
        { kind: 'story', story: '小兰的积木塔倒了，她皱着眉头不说话。', prompt: '她可能是什么感受？', correct: '失望', options: ['失望','得意','兴奋'], condition: { cue: 'disappointment' } },
        { kind: 'story', story: '老师说今天要换座位，小明不知道新座位在哪里。', prompt: '小明最需要什么？', correct: '清楚的提示或帮助', options: ['清楚的提示或帮助','更多零食','别人不理他'], condition: { cue: 'uncertainty' } },
        { kind: 'story', story: '小朋友正在安静看书，旁边有人想和他说话。', prompt: '比较合适的做法是？', correct: '轻声询问是否方便', options: ['轻声询问是否方便','直接抢走书','大声喊他'], condition: { cue: 'boundary' } },
        { kind: 'story', story: '小华忘记带水杯，看起来有点着急。', prompt: '他可能需要什么？', correct: '借水或提醒他找老师', options: ['借水或提醒他找老师','被嘲笑','继续等着'], condition: { cue: 'need' } },
        { kind: 'story', story: '朋友送给你一张画，虽然颜色有点乱，但他很期待你的反应。', prompt: '比较友好的回应是？', correct: '谢谢你，我看到你画得很用心', options: ['谢谢你，我看到你画得很用心','这张画真难看','我不要'], condition: { cue: 'kindness' } },
        { kind: 'story', story: '小美听到很响的声音后捂住耳朵。', prompt: '她可能感到什么？', correct: '不舒服或害怕', options: ['不舒服或害怕','特别骄傲','想睡觉'], condition: { cue: 'sensory' } },
        { kind: 'story', story: '两个人都想玩同一个玩具，玩具只有一个。', prompt: '比较合适的办法是？', correct: '轮流玩或一起商量', options: ['轮流玩或一起商量','直接抢走','把玩具扔掉'], condition: { cue: 'sharing' } }
      ]
    });
  </script>
</body>
</html>
