<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>记忆小侦探</title>
  <style>
    :root{--cream:#FFF7E8;--sky:#BFE6FF;--mint:#BDEDD8;--warm:#FFE39B;--coral:#FF9F8A;--lav:#D8C8FF;--ink:#3B3B4F;--muted:#68687B;--card:rgba(255,250,239,.95);--shadow:0 14px 34px rgba(54,54,84,.16);--radius:28px}
    *{box-sizing:border-box} html,body,#app{height:100%;margin:0} body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;background:var(--cream);color:var(--ink);overflow:hidden} button{font:inherit;color:inherit;border:0;cursor:pointer} button:focus-visible{outline:4px solid #7BBCE8;outline-offset:3px} img{max-width:100%;display:block;user-select:none;-webkit-user-drag:none}
    .screen{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#fff8eb,#eaf8ff);padding:24px}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.content{position:relative;z-index:1}.panel,.lobby-card,.modal-card{background:var(--card);border:3px solid rgba(255,255,255,.85);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.home-wrap{height:100%;display:grid;grid-template-columns:minmax(360px,680px) minmax(320px,560px);gap:26px;align-items:center;justify-content:center;max-width:1220px;margin:0 auto}.lobby-card{min-height:620px;display:flex;flex-direction:column;text-align:left}.lobby-card>img{height:300px;object-fit:cover;width:100%}.body{padding:28px}.eyebrow{display:inline-flex;gap:8px;align-items:center;border-radius:999px;background:#fff;padding:8px 14px;color:#5B766B;font-weight:900;margin-bottom:14px}h1{font-size:clamp(38px,5vw,72px);line-height:1.05;margin:0 0 14px;font-weight:1000}h2{font-size:clamp(28px,3vw,44px);line-height:1.12;margin:0 0 14px;font-weight:1000}p{font-size:clamp(18px,2vw,23px);line-height:1.58;margin:8px 0;color:var(--muted)}.tags{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tag{border-radius:999px;padding:8px 13px;background:#fff;border:2px solid rgba(189,237,216,.9);font-weight:900;color:#526A60;font-size:17px}.side{padding:28px;text-align:left}.info{background:#fff;border-radius:22px;padding:18px 20px;margin:14px 0;border:2px solid rgba(216,200,255,.55)}.info strong{display:block;font-size:23px;margin-bottom:5px;color:var(--ink)}.btn-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}.btn{border-radius:999px;padding:17px 26px;font-size:22px;font-weight:1000;box-shadow:0 8px 18px rgba(54,54,84,.13);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:62px}.btn.primary{background:var(--coral);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:2px solid rgba(216,200,255,.85)}.btn.mint{background:var(--mint);color:#31564A}.btn:active{transform:scale(.98)}
    .detail-grid,.cover-layout,.result-grid{height:100%;display:grid;gap:28px;align-items:center;justify-content:center;max-width:1180px;margin:0 auto}.detail-grid{grid-template-columns:minmax(300px,470px) minmax(320px,620px)}.cover-layout{grid-template-columns:minmax(340px,520px) minmax(300px,640px)}.result-grid{grid-template-columns:minmax(240px,360px) minmax(320px,690px)}.cover-img,.poster{border-radius:34px;box-shadow:var(--shadow);background:#fff}.poster{max-height:82vh;object-fit:cover}
    .hud{position:absolute;z-index:5;left:18px;right:18px;top:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;pointer-events:none}.hud>*{pointer-events:auto}.hud-left,.hud-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hud-left{justify-self:start}.hud-right{justify-self:end;justify-content:flex-end}.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,250,239,.94);border:2px solid rgba(255,255,255,.9);border-radius:999px;padding:10px 14px;box-shadow:0 8px 18px rgba(54,54,84,.10);font-weight:1000;font-size:19px}.pause{width:54px;height:54px;border-radius:50%;background:#fff;border:2px solid rgba(216,200,255,.85);box-shadow:0 8px 18px rgba(54,54,84,.10);font-weight:1000}.target-card{min-width:min(760px,62vw);min-height:86px;background-image:url("assets/target-card-frame.png");background-repeat:no-repeat;background-size:100% 100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 72px;font-size:clamp(20px,2.1vw,30px);font-weight:1000;line-height:1.25}
    .stage-wrap{position:absolute;z-index:2;left:50%;top:52%;transform:translate(-50%,-50%);width:min(720px,82vw);height:min(520px,56vh);display:flex;align-items:center;justify-content:center}.photo-stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}.character{position:absolute;z-index:2;left:3vw;bottom:3vh;width:min(250px,22vw);pointer-events:none}.album{position:absolute;z-index:1;right:5vw;bottom:5vh;width:min(210px,20vw);opacity:.98}.photo-card{width:min(330px,38vh,44vw);filter:drop-shadow(0 14px 22px rgba(59,59,79,.18));transition:transform .18s ease,opacity .18s ease}.photo-card.small{width:min(160px,18vh,22vw);opacity:.58;filter:drop-shadow(0 8px 14px rgba(59,59,79,.10))}.prev-card{position:absolute;left:6%;top:18%;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:1000;color:#5d5d72}.prev-card span{background:#fff;border-radius:999px;padding:6px 12px;font-size:17px}.slot-area{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;gap:20px;padding:8% 4%}.slot{height:70%;border-radius:34px;background:rgba(255,250,239,.66);border:3px dashed rgba(123,188,232,.7);display:flex;align-items:center;justify-content:center}.slot .photo-card{width:80%;max-width:240px}.slot.faded{opacity:.45}
    .bubble{position:absolute;z-index:4;left:50%;bottom:125px;transform:translateX(-50%);max-width:min(780px,86vw);background:rgba(255,250,239,.96);border:3px solid rgba(255,255,255,.9);border-radius:28px;padding:18px 24px;box-shadow:var(--shadow);font-size:clamp(19px,2vw,26px);font-weight:900;line-height:1.45;text-align:center}.bottom-actions{position:absolute;z-index:6;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:18px;align-items:center;justify-content:center;width:min(760px,92vw)}.answer{flex:1;border-radius:26px;padding:20px 16px;min-height:76px;font-size:clamp(24px,3.5vw,34px);font-weight:1000;box-shadow:var(--shadow)}.answer.match{background:var(--mint);color:#31564A}.answer.no{background:#fff;border:3px solid rgba(216,200,255,.9);color:var(--ink)}.answer:disabled{opacity:.58;cursor:not-allowed}.hand{position:absolute;z-index:8;width:86px;bottom:90px;left:35%;animation:float 1s ease-in-out infinite alternate}.hand.right{left:auto;right:28%}@keyframes float{from{transform:translateY(0)}to{transform:translateY(-12px)}}.chip{position:absolute;z-index:4;right:24px;bottom:130px;background:#fff;border-radius:999px;padding:12px 18px;font-size:20px;font-weight:1000;box-shadow:var(--shadow)}
    .feedback{position:absolute;z-index:8;left:50%;top:30%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;animation:pop .5s ease}.feedback img{width:110px}.feedback div{background:#fff;border-radius:999px;padding:10px 18px;font-size:22px;font-weight:1000;box-shadow:var(--shadow)}@keyframes pop{0%{transform:translate(-50%,-50%) scale(.78);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
    .modal-backdrop{position:absolute;inset:0;z-index:20;background:rgba(59,59,79,.24);display:flex;align-items:center;justify-content:center;padding:24px}.modal-card{width:min(760px,92vw);padding:30px;text-align:center}.modal-card h2{font-size:42px}.modal-card p{text-align:left}.countdown{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,247,232,.72);font-size:min(22vw,160px);font-weight:1000;color:var(--coral);text-align:center}.badge{width:min(330px,70vw);margin:0 auto}.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.stat{background:#fff;border-radius:20px;padding:16px;border:2px solid rgba(189,237,216,.8)}.stat b{display:block;font-size:30px}.stat span{font-size:16px;color:var(--muted);font-weight:900}.rail{height:14px;background:#fff;border-radius:999px;overflow:hidden;border:2px solid rgba(216,200,255,.8);margin:12px 0}.bar{height:100%;width:0;background:var(--mint);border-radius:999px}.toggle{position:absolute;z-index:30;right:18px;bottom:18px;background:#fff;border:2px solid rgba(216,200,255,.8);border-radius:999px;padding:10px 14px;font-weight:1000;box-shadow:0 8px 18px rgba(54,54,84,.10)}.low-stim *{animation:none!important;transition:none!important}.low-stim .feedback img{opacity:.8}
    @media(max-width:860px){body{overflow:auto}.screen{min-height:100%;height:auto;overflow:auto;padding:16px}.home-wrap,.detail-grid,.cover-layout,.result-grid{grid-template-columns:1fr;min-height:calc(100vh - 32px);padding:70px 0 100px}.lobby-card{min-height:auto}.lobby-card>img{height:220px}.hud{position:fixed;grid-template-columns:1fr;gap:8px}.hud-left,.hud-right{justify-self:stretch;justify-content:space-between}.target-card{min-width:100%;padding:14px 48px;font-size:20px}.stage-wrap{position:relative;left:auto;top:auto;transform:none;width:100%;height:420px;margin:150px auto 130px}.character{width:120px;left:8px;bottom:90px}.album{width:110px;right:10px;bottom:95px}.bubble{position:fixed;bottom:126px;left:16px;right:16px;transform:none}.bottom-actions{position:fixed;bottom:14px}.answer{min-height:74px}.hand{position:fixed;bottom:88px}.chip{position:fixed;right:14px;bottom:120px}.stat-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";
  const A="assets/";
  const animals={dog:{name:"小狗",img:A+"stimulus-card-dog.png"},cat:{name:"小猫",img:A+"stimulus-card-cat.png"},rabbit:{name:"小兔",img:A+"stimulus-card-rabbit.png"},fox:{name:"小狐狸",img:A+"stimulus-card-fox.png"},panda:{name:"小熊猫",img:A+"stimulus-card-panda.png"},duck:{name:"小鸭",img:A+"stimulus-card-duck.png"},turtle:{name:"小乌龟",img:A+"stimulus-card-turtle.png"},owl:{name:"猫头鹰",img:A+"stimulus-card-owl.png"}};
  const levels=[
    {level:1,name:"新手侦探：找上一张",back:1,mode:"image",count:10,timeLimit:90,responseMs:7500,interMs:500,animals:["dog","cat","rabbit"],slots:["center"],targetP:.45,easy:true},
    {level:2,name:"相册小帮手",back:1,mode:"image",count:12,timeLimit:90,responseMs:7000,interMs:500,animals:["dog","cat","rabbit","duck"],slots:["center"],targetP:.42,easy:true},
    {level:3,name:"稳稳看照片",back:1,mode:"image",count:14,timeLimit:85,responseMs:6500,interMs:520,animals:["dog","cat","rabbit","duck"],slots:["center"],targetP:.38,easy:true},
    {level:4,name:"前前张小侦探",back:2,mode:"image",count:16,timeLimit:85,responseMs:5600,interMs:560,animals:["dog","cat","rabbit","duck"],slots:["center"],targetP:.34},
    {level:5,name:"相册线索加长",back:2,mode:"image",count:18,timeLimit:80,responseMs:5200,interMs:560,animals:["dog","cat","rabbit","duck","fox"],slots:["center"],targetP:.32},
    {level:6,name:"进阶挑战：照片会换位置",back:1,mode:"image-position",count:18,timeLimit:80,responseMs:5200,interMs:580,animals:["dog","cat","rabbit","duck"],slots:["left","center","right"],targetP:.30,advanced:true},
    {level:7,name:"进阶挑战：左右观察",back:1,mode:"image-position",count:20,timeLimit:78,responseMs:4800,interMs:600,animals:["dog","cat","rabbit","duck","fox"],slots:["left","center","right"],targetP:.29,advanced:true},
    {level:8,name:"进阶挑战：前前张位置",back:2,mode:"image-position",count:22,timeLimit:78,responseMs:4700,interMs:620,animals:["dog","cat","rabbit","duck","fox"],slots:["left","center","right"],targetP:.28,advanced:true},
    {level:9,name:"进阶挑战：照片更多",back:2,mode:"image-position",count:24,timeLimit:75,responseMs:4300,interMs:640,animals:["dog","cat","rabbit","duck","fox","panda"],slots:["left","center","right"],targetP:.27,advanced:true},
    {level:10,name:"进阶挑战：王牌相册侦探",back:2,mode:"image-position",count:28,timeLimit:72,responseMs:3900,interMs:650,animals:["dog","cat","rabbit","duck","fox","panda"],slots:["left","center","right"],targetP:.26,advanced:true}
  ];
  const app=document.getElementById("app"), key="memoryDetectiveV1";
  const state={screen:"home",tutorial:1,lowStim:false,practice:null,countdown:3,training:null,feedback:null,lastResult:null,tutorialFound:0};
  const timers={trial:null,countdown:null,tick:null,feedback:null,advance:null};
  function load(){try{return JSON.parse(localStorage.getItem(key)||"{}")}catch(e){return {}}}
  function save(data){localStorage.setItem(key,JSON.stringify(Object.assign(load(),data)))}
  function nextLevel(){return Math.max(1,Math.min(10,Number(load().nextLevel||1)))}
  function clearTimers(){Object.keys(timers).forEach(k=>{clearTimeout(timers[k]);clearInterval(timers[k]);timers[k]=null})}
  function cfg(lv){return levels[Math.max(0,Math.min(9,lv-1))]}
  function setScreen(s){clearTimers();state.screen=s;state.feedback=null;render()}
  function targetText(c){c=c||cfg(nextLevel());if(c.mode==="image-position")return c.back===1?"进阶挑战：找图案和位置都和上一张一样的照片":"进阶挑战：找图案和位置都和前前张一样的照片";return c.back===1?"本轮任务：找和上一张一样的照片":"本轮任务：找和前前张一样的照片"}
  function answerLabel(c){return c.back===1?"像上一张":"像前前张"}
  function screen(inner){return `<main class="screen ${state.lowStim?"low-stim":""}">${inner}<button class="toggle" onclick="MD.toggleLowStim()" aria-label="切换低刺激模式">${state.lowStim?"低刺激：开":"低刺激：关"}</button></main>`}
  function bg(src){return `<img class="bg" src="${src}" alt="照相馆背景">`}
  function targetCard(text){return `<div class="target-card" role="status" aria-live="polite">${text}</div>`}
  function card(id,cls="photo-card"){return `<img class="${cls}" src="${animals[id].img}" alt="${animals[id].name}照片">`}
  function hud(c,t){return `<section class="hud"><div class="hud-left"><button class="pause" onclick="MD.pause()" aria-label="暂停">Ⅱ</button><div class="pill">第 ${c.level} 级</div><div class="pill">${c.advanced?"进阶挑战":"轻松训练"}</div></div>${targetCard(targetText(c))}<div class="hud-right"><div class="pill">倒计时：${t?t.timeLeft:c.timeLimit} 秒</div><div class="pill">星星：${t?t.stars:0}</div></div></section>`}
  function props(){return `<img class="character" src="assets/main-character-dog.png" alt="拍照小狗"><img class="album" src="assets/animal-album-open.png" alt="动物相册">`}
  function feedbackHtml(){if(!state.feedback)return "";const img=state.feedback.type==="success"?"assets/success-sticker.png":"assets/gentle-hint-sticker.png";return `<div class="feedback"><img src="${img}" alt="反馈贴纸"><div>${state.feedback.text}</div></div>`}
  function showFeedback(type,text){state.feedback={type,text};clearTimeout(timers.feedback);timers.feedback=setTimeout(()=>{state.feedback=null;render()},750)}
  function home(){
    const n=nextLevel();
    return screen(`<div class="home-wrap"><section class="lobby-card" aria-label="记忆小侦探首页卡片"><img src="assets/lobby-card-cover.png" alt="侦探照相馆卡片图"><div class="body"><div class="eyebrow">侦探照相馆 · 工作记忆</div><h1>记忆小侦探</h1><p>帮拍照小狗整理动物相册，找出刚刚出现过的重复照片。</p><div class="tags"><span class="tag">全中文</span><span class="tag">离线可玩</span><span class="tag">第 ${n} 级开始</span><span class="tag">1-3 级很轻松</span></div><div class="btn-row"><button class="btn primary" onclick="MD.goDetail()">查看任务</button><button class="btn secondary" onclick="MD.goCover()">直接看封面</button></div></div></section><aside class="panel side"><h2>怎么玩</h2><div class="info"><strong>看当前照片</strong><p>每次相册里会出现一张新的动物照片。</p></div><div class="info"><strong>和目标比一比</strong><p>目标卡会一直显示：这一轮要比“上一张”还是“前前张”。</p></div><div class="info"><strong>点一个大按钮</strong><p>像目标照片就点左边；不一样就点右边。第一张先观察。</p></div><h2>目标是什么</h2><p>目标是帮助拍照小狗收集重复照片线索。正式训练结束后会记录本轮表现，并自动推荐下轮难度。</p></aside></div>`)
  }
  function detail(){return screen(`<div class="detail-grid"><div class="cover-img"><img src="assets/detail-modal-cover.png" alt="拍照小狗说明图"></div><section class="panel side"><div class="eyebrow">任务说明</div><h1>记忆小侦探</h1><h2>怎么玩</h2><p>照片会一张一张出现。你需要看当前照片，再按照目标卡提示，把它和刚刚看过的照片比一比。</p><h2>目标是什么</h2><p>帮拍照小狗整理动物相册，找出重复出现的照片线索。1-3 级只比“上一张”，速度慢、照片少，很容易开始。</p><div class="info"><strong>训练顺序</strong><p>封面页 → 6 屏场景内教学 → 低压练习 → 准备开始 → 正式训练 → 结算推荐。</p></div><div class="btn-row"><button class="btn primary" onclick="MD.goCover()">进入封面页</button><button class="btn secondary" onclick="MD.goHome()">返回首页</button></div></section></div>`)}
  function cover(){const n=nextLevel();return screen(`<div class="cover-layout"><img class="poster" src="assets/game-cover-poster.png" alt="记忆小侦探封面图"><section class="panel side"><div class="eyebrow">侦探照相馆开门啦</div><h1>记忆小侦探</h1><p>今天的任务：帮拍照小狗找出相册里重复出现的动物照片。</p><div class="info"><strong>怎么玩</strong><p>先看教学，再做 6 张低压练习。正式训练时，目标卡会一直提醒你要找什么。</p></div><div class="info"><strong>目标是什么</strong><p>找到更多照片线索，整理完整的动物相册。当前推荐从第 ${n} 级开始。</p></div><div class="btn-row"><button class="btn primary" onclick="MD.startTutorial()">开始教学</button><button class="btn secondary" onclick="MD.goHome()">返回首页</button></div></section></div>`)}
  function tutorial(){
    const s=state.tutorial; let inner=bg(`assets/tutorial-scene-${s}.png`)+props()+`<section class="hud"><div></div>${targetCard(s<3?"本轮目标：先看照片":"本轮任务：找和上一张一样的照片")}<div></div></section>`;
    let stage="",bubble="",actions="",hand="",chip="";
    if(s===1){bubble="欢迎来到侦探照相馆！我会一张一张放出动物照片，请你帮我记住它们。";actions=`<button class="btn primary" onclick="MD.nextTutorial()">下一步</button>`}
    if(s===2){stage=card("dog");bubble="这是第一张照片。先把它放进记忆相册里。";actions=`<button class="btn primary" onclick="MD.nextTutorial()">我记住了</button>`}
    if(s===3){stage=`<div class="prev-card"><span>上一张</span>${card("dog","photo-card small")}</div>${card("dog")}`;bubble="这张和上一张一样。每发现一次重复照片，就点一次“像上一张”。";actions=`<button class="answer match" onclick="MD.tutorialAnswer(true)">像上一张</button><button class="answer no" onclick="MD.tutorialAnswer(false)">不一样</button>`;hand=`<img class="hand" src="assets/tutorial-hand.png" alt="点击手势">`;chip=`<div class="chip">找到线索：${state.tutorialFound}</div>`}
    if(s===4){stage=`<div class="prev-card"><span>上一张</span>${card("dog","photo-card small")}</div>${card("cat")}`;bubble="这张和上一张不一样。这次点“不一样”。";actions=`<button class="answer match" onclick="MD.tutorialAnswer(true)">像上一张</button><button class="answer no" onclick="MD.tutorialAnswer(false)">不一样</button>`;hand=`<img class="hand right" src="assets/tutorial-hand.png" alt="点击手势">`;chip=`<div class="chip">找到线索：${state.tutorialFound}</div>`}
    if(s===5){stage=`<div style="display:flex;align-items:center;gap:16px">${card("rabbit","photo-card small")}<b style="font-size:38px">→</b>${card("rabbit","photo-card small")}<b style="font-size:38px">→</b>${card("duck","photo-card small")}</div>`;bubble="正式训练时，照片会一张一张出现。你只要看当前照片，再和上一张比一比。";actions=`<button class="btn primary" onclick="MD.nextTutorial()">试一试</button><button class="btn secondary" onclick="MD.startTutorial()">重新看演示</button>`;chip=`<div class="chip">演示：小兔 → 小兔 → 小鸭</div>`}
    if(s===6){stage=`${card("dog","photo-card small")}${card("cat","photo-card small")}`;bubble="现在试 6 张练习照片。不用着急，答完再换下一张。";actions=`<button class="btn primary" onclick="MD.startPractice()">开始练习</button><button class="btn secondary" onclick="MD.startTutorial()">重新看演示</button>`}
    inner+=`<div class="stage-wrap"><div class="photo-stage">${stage}</div></div><div class="bubble">${bubble}</div>${chip}<div class="bottom-actions">${actions}</div>${hand}${feedbackHtml()}`;
    return screen(inner)
  }
  const practiceSeq=["dog","dog","cat","rabbit","rabbit","dog"];
  function startPractice(){state.practice={idx:0,correct:0,valid:0};setScreen("practice")}
  function practice(){
    const p=state.practice,idx=p.idx,animal=practiceSeq[idx],first=idx===0,prev=idx>0?practiceSeq[idx-1]:null;
    const stage=(prev?`<div class="prev-card"><span>上一张</span>${card(prev,"photo-card small")}</div>`:"")+card(animal);
    const actions=first?`<button class="btn primary" onclick="MD.nextPracticeObserve()">我记住了</button>`:`<button class="answer match" onclick="MD.practiceAnswer(true)">像上一张</button><button class="answer no" onclick="MD.practiceAnswer(false)">不一样</button>`;
    return screen(`${bg("assets/scene-background.png")}${props()}<section class="hud"><div class="hud-left"><div class="pill">低压练习</div></div>${targetCard("本轮任务：找和上一张一样的照片")}<div class="hud-right"><div class="pill">练习照片：${idx+1}/6</div><div class="pill">星星：${p.correct}</div></div></section><div class="stage-wrap"><div class="photo-stage">${stage}</div></div><div class="bubble">${first?"第一张先观察。把它放进记忆相册里。":"看当前照片，再和上一张比一比。"}</div><div class="bottom-actions">${actions}</div>${feedbackHtml()}`)
  }
  function ready(){const lv=nextLevel();return screen(`${bg("assets/scene-background.png")}${props()}<section class="hud"><div></div>${targetCard(targetText(cfg(lv)))}<div></div></section><div class="modal-backdrop"><section class="modal-card"><h2>准备开始训练吧！</h2><p>正式训练里，照片会一张一张出现。请一直看目标卡，它会告诉你这轮要找“上一张”还是“前前张”。</p><p>不用紧张，按自己的节奏观察就好。下轮推荐难度：第 ${lv} 级。</p><div class="btn-row" style="justify-content:center"><button class="btn secondary" onclick="MD.startTutorial()">重新演示</button><button class="btn primary" onclick="MD.startCountdown(${lv})">进入训练</button></div></section></div>`)}
  function countdown(){return screen(`${bg(state.lowStim?"assets/scene-background-low-stim.png":"assets/scene-background.png")}<section class="countdown">${state.countdown>0?state.countdown:"开始整理相册！"}</section>`)}
  function startCountdown(lv){clearTimers();state.screen="countdown";state.countdown=3;render();timers.countdown=setInterval(()=>{state.countdown--;render();if(state.countdown<0){clearInterval(timers.countdown);startTraining(lv)}},800)}
  function rand(a){return a[Math.floor(Math.random()*a.length)]} function diff(a,v){const c=a.filter(x=>x!==v);return rand(c.length?c:a)} function isTarget(trials,i,c){if(i<c.back)return false;const cur=trials[i],ref=trials[i-c.back];return c.mode==="image"?cur.animal===ref.animal:cur.animal===ref.animal&&cur.slot===ref.slot}
  function makeTrials(c){const trials=[];for(let i=0;i<c.count;i++){const can=i>=c.back,tar=can&&Math.random()<c.targetP;let animal,slot;if(tar){const ref=trials[i-c.back];animal=ref.animal;slot=c.mode==="image-position"?ref.slot:rand(c.slots)}else if(can){const ref=trials[i-c.back];if(c.mode==="image"){animal=diff(c.animals,ref.animal);slot=rand(c.slots)}else{if(Math.random()<.55){animal=diff(c.animals,ref.animal);slot=rand(c.slots)}else{animal=ref.animal;slot=diff(c.slots,ref.slot)}}}else{animal=rand(c.animals);slot=rand(c.slots)}trials.push({animal,slot,target:false})}trials.forEach((t,i)=>t.target=isTarget(trials,i,c));if(c.level<=3){let n=trials.filter(t=>t.target).length;for(let i=c.back;i<trials.length&&n<3;i+=3){const ref=trials[i-c.back];trials[i].animal=ref.animal;trials[i].slot=ref.slot;trials[i].target=true;n++}}return trials}
  function startTraining(lv){clearTimers();const c=cfg(lv),trials=makeTrials(c);state.training={cfg:c,trials,idx:0,stars:0,timeLeft:c.timeLimit,waiting:false,shownAt:Date.now(),stats:{level:c.level,total:0,valid:0,correct:0,targets:0,hits:0,misses:0,falseAlarms:0,correctRejects:0,timeouts:0,rtSum:0,answered:0,started:Date.now(),longestStreak:0,streak:0}};state.screen="training";render();timers.tick=setInterval(()=>{if(state.screen!=="training")return;state.training.timeLeft--;if(state.training.timeLeft<=0)finishTraining();else render()},1000);setupTrial()}
  function setupTrial(){clearTimeout(timers.trial);const t=state.training,c=t.cfg;t.shownAt=Date.now();const first=t.idx<c.back;t.waiting=!first;if(first){timers.trial=setTimeout(()=>advanceTrial(),1400)}else{timers.trial=setTimeout(()=>timeoutTrial(),state.lowStim?c.responseMs+700:c.responseMs)}}
  function slotName(s){return s==="left"?"左边":s==="right"?"右边":"中间"}
  function training(){
    const t=state.training,c=t.cfg,tr=t.trials[t.idx],prev=t.idx>=c.back?t.trials[t.idx-c.back]:null;let stage="";
    if(c.mode==="image-position"){const slots=["left","center","right"];stage=`<div class="slot-area">${slots.map(sl=>`<div class="slot ${tr.slot===sl?"":"faded"}">${tr.slot===sl?card(tr.animal):""}</div>`).join("")}</div>`;if(prev)stage+=`<div class="prev-card"><span>${c.back===1?"上一张":"前前张"}</span>${card(prev.animal,"photo-card small")}<span>${slotName(prev.slot)}</span></div>`}else{stage=(prev?`<div class="prev-card"><span>${c.back===1?"上一张":"前前张"}</span>${card(prev.animal,"photo-card small")}</div>`:"")+card(tr.animal)}
    const first=t.idx<c.back,bubble=first?(c.back===1?"第一张先观察。":"前两张先观察。"):"看当前照片，再按目标卡作答。",match=c.mode==="image-position"?"完全一样":answerLabel(c),progress=Math.round(((t.idx+1)/t.trials.length)*100);
    const actions=first?`<button class="answer no" disabled>先观察</button>`:`<button class="answer match" onclick="MD.answer(true)">${match}</button><button class="answer no" onclick="MD.answer(false)">不一样</button>`;
    return screen(`${bg(state.lowStim?"assets/scene-background-low-stim.png":"assets/scene-background.png")}${hud(c,t)}${props()}<div class="stage-wrap"><div class="photo-stage">${stage}</div></div><div class="bubble">${bubble}<div class="rail"><div class="bar" style="width:${progress}%"></div></div></div><div class="bottom-actions">${actions}</div>${feedbackHtml()}`)
  }
  function answer(userTarget){const t=state.training;if(!t||!t.waiting)return;clearTimeout(timers.trial);const tr=t.trials[t.idx],rt=Date.now()-t.shownAt,ok=userTarget===tr.target;t.stats.valid++;t.stats.total++;if(tr.target)t.stats.targets++;t.stats.rtSum+=rt;t.stats.answered++;if(ok){t.stats.correct++;t.stars+=10;t.stats.streak++;t.stats.longestStreak=Math.max(t.stats.longestStreak,t.stats.streak);if(tr.target)t.stats.hits++;else t.stats.correctRejects++;showFeedback("success","找到了！")}else{t.stats.streak=0;if(tr.target)t.stats.misses++;else t.stats.falseAlarms++;showFeedback("hint","这张线索有点像，我们继续观察。")}t.waiting=false;render();timers.advance=setTimeout(()=>advanceTrial(),t.cfg.interMs)}
  function timeoutTrial(){const t=state.training;if(!t||!t.waiting)return;const tr=t.trials[t.idx];t.stats.valid++;t.stats.total++;t.stats.timeouts++;if(tr.target){t.stats.targets++;t.stats.misses++}else{t.stats.correctRejects++}t.stats.streak=0;t.waiting=false;showFeedback("hint","这张先放进相册，我们看下一张。");render();timers.advance=setTimeout(()=>advanceTrial(),t.cfg.interMs+350)}
  function advanceTrial(){const t=state.training;if(!t)return;state.feedback=null;t.idx++;if(t.idx>=t.trials.length){finishTraining();return}render();setupTrial()}
  function finishTraining(){clearTimers();const t=state.training;if(!t)return;const st=t.stats;st.ended=Date.now();st.durationMs=st.ended-st.started;st.accuracy=st.valid?st.correct/st.valid:0;st.avgRt=st.answered?st.rtSum/st.answered:0;st.timeoutRate=st.valid?st.timeouts/st.valid:0;const decision=decideNext(st,t.cfg);state.lastResult={stats:st,decision,stars:t.stars,cfg:t.cfg};save({lastResult:state.lastResult,nextLevel:decision.nextLevel,history:[...(load().history||[]).slice(-9),{time:new Date().toISOString(),level:st.level,accuracy:st.accuracy,avgRt:st.avgRt,nextLevel:decision.nextLevel}]});state.training=null;setScreen("result")}
  function decideNext(st,c){const acc=st.accuracy,avg=st.avgRt||99999,timeout=st.timeoutRate;let next=c.level,why="这一关很适合继续巩固。";if(c.level<=2&&acc>=.50){next=c.level+1;why="前几级用于轻松熟悉，你已经可以试试下一组照片。"}else if(c.level===3&&acc>=.58&&timeout<=.35){next=4;why="上一张照片已经比较稳定，可以试试前前张。"}else if(acc>=.84&&avg<c.responseMs*.72&&timeout<=.15){next=Math.min(10,c.level+1);why="正确率和观察速度都很稳，推荐提高一点难度。"}else if((acc<.56||timeout>.34)&&c.level>1){next=Math.max(1,c.level-1);why="这轮照片节奏偏紧，推荐下轮更轻松一点。"}return {nextLevel:next,why}}
  function result(){const r=state.lastResult||load().lastResult;if(!r)return home();const st=r.stats,c=r.cfg,d=r.decision,acc=Math.round((st.accuracy||0)*100),avg=st.avgRt?Math.round(st.avgRt/100)/10:0,timeout=Math.round((st.timeoutRate||0)*100),perf=acc>=82?"本轮表现：观察很稳定":acc>=62?"本轮表现：适合继续巩固":"本轮表现：已经完成整理，建议放慢一点";return screen(`<div class="result-grid"><section><img class="badge" src="assets/result-badge-album.png" alt="相册整理徽章"></section><section class="panel side"><div class="eyebrow">结算</div><h1>相册整理完成</h1><h2>${perf}</h2><div class="stat-grid"><div class="stat"><b>${acc}%</b><span>正确率</span></div><div class="stat"><b>${avg} 秒</b><span>平均用时</span></div><div class="stat"><b>${r.stars}</b><span>星星分</span></div><div class="stat"><b>${timeout}%</b><span>未及时作答</span></div></div><div class="info"><strong>目标是什么</strong><p>帮拍照小狗收集重复照片线索。你本轮整理了第 ${c.level} 级：${c.name}。</p></div><div class="info"><strong>下轮推荐难度</strong><p>第 ${d.nextLevel} 级。${d.why}</p></div><div class="btn-row"><button class="btn primary" onclick="MD.startCountdown(${d.nextLevel})">按推荐难度再来一轮</button><button class="btn secondary" onclick="MD.startTutorial()">重新演示</button><button class="btn secondary" onclick="MD.goHome()">返回首页</button></div></section></div>`)}
  function pauseOverlay(){const t=state.training,lv=t?t.cfg.level:nextLevel();return screen(`${bg(state.lowStim?"assets/scene-background-low-stim.png":"assets/scene-background.png")}<div class="modal-backdrop"><section class="modal-card"><h2>暂停中</h2><p>目标仍然是：${targetText(cfg(lv))}</p><div class="btn-row" style="justify-content:center"><button class="btn primary" onclick="MD.resume()">继续训练</button><button class="btn secondary" onclick="MD.startTutorial()">重新演示</button><button class="btn secondary" onclick="MD.goCover()">返回封面</button></div></section></div>`)}
  function render(){if(state.screen==="home")app.innerHTML=home();else if(state.screen==="detail")app.innerHTML=detail();else if(state.screen==="cover")app.innerHTML=cover();else if(state.screen==="tutorial")app.innerHTML=tutorial();else if(state.screen==="practice")app.innerHTML=practice();else if(state.screen==="ready")app.innerHTML=ready();else if(state.screen==="countdown")app.innerHTML=countdown();else if(state.screen==="training")app.innerHTML=training();else if(state.screen==="paused")app.innerHTML=pauseOverlay();else if(state.screen==="result")app.innerHTML=result()}
  function goHome(){setScreen("home")}function goDetail(){setScreen("detail")}function goCover(){setScreen("cover")}function startTutorial(){state.tutorial=1;state.tutorialFound=0;setScreen("tutorial")}function nextTutorial(){state.tutorial=Math.min(6,state.tutorial+1);state.feedback=null;render()}
  function tutorialAnswer(same){if(state.tutorial===3&&same){state.tutorialFound=1;showFeedback("success","找到一条线索！");setTimeout(()=>{state.tutorial=4;state.feedback=null;render()},700)}else if(state.tutorial===4&&!same){showFeedback("success","观察得很仔细！");setTimeout(()=>{state.tutorial=5;state.feedback=null;render()},700)}else{showFeedback("hint","再看一眼，放大镜会帮你记住。");render()}}
  function nextPracticeObserve(){state.practice.idx++;render()}function practiceAnswer(same){const p=state.practice,expected=practiceSeq[p.idx]===practiceSeq[p.idx-1];p.valid++;if(same===expected){p.correct++;showFeedback("success","找得很稳！")}else{showFeedback("hint","没关系，下一张再慢慢看。")}p.idx++;if(p.idx>=practiceSeq.length){setTimeout(()=>setScreen("ready"),800)}else{setTimeout(()=>render(),650)}}
  function pause(){if(state.screen==="training"){clearTimers();state.screen="paused";render()}}function resume(){if(!state.training){setScreen("home");return}state.screen="training";render();timers.tick=setInterval(()=>{if(state.screen!=="training")return;state.training.timeLeft--;if(state.training.timeLeft<=0)finishTraining();else render()},1000);setupTrial()}
  function toggleLowStim(){state.lowStim=!state.lowStim;save({lowStim:state.lowStim});render()}
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(state.screen==="training")pause();return}if(e.key===" "){if(state.screen==="home")goDetail();else if(state.screen==="cover")startTutorial();else if(state.screen==="tutorial"&&[1,2,5].includes(state.tutorial))nextTutorial();e.preventDefault();return}if(["ArrowLeft","a","A"].includes(e.key)){if(state.screen==="training")answer(true);else if(state.screen==="practice"&&state.practice.idx>0)practiceAnswer(true)}if(["ArrowRight","d","D"].includes(e.key)){if(state.screen==="training")answer(false);else if(state.screen==="practice"&&state.practice.idx>0)practiceAnswer(false)}})
  window.MD={goHome,goDetail,goCover,startTutorial,nextTutorial,tutorialAnswer,startPractice,nextPracticeObserve,practiceAnswer,startCountdown,startTraining,answer,pause,resume,toggleLowStim};
  if(load().lowStim)state.lowStim=true;render();
})();
</script>
