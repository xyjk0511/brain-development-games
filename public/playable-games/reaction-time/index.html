<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>小动物过马路 v3</title>
  <style>
    :root{
      --cream:#fff8ec;--sky:#ddf2ff;--mint:#bfeed2;--mint2:#8fd9a8;--yellow:#ffd97a;--orange:#ff9b7a;--purple:#d8c7ff;--red:#f06b6b;--green:#65c97a;--ink:#31445b;--soft:#ffffffde;--shadow:0 16px 36px rgba(49,68,91,.16);--shadow2:0 8px 18px rgba(49,68,91,.12);--radius:30px;
      font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:inherit}
    button,input{font-family:inherit}button{color:inherit}
    #app{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(180deg,var(--sky),var(--cream))}
    .screen{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
    .absBg{position:absolute;inset:0;background-size:cover;background-position:center}.absBg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,248,236,.12));pointer-events:none}
    .card{position:relative;z-index:2;background:rgba(255,255,255,.91);border:3px solid rgba(255,255,255,.95);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;backdrop-filter:blur(8px)}
    .cover{width:min(1080px,95vw);display:grid;grid-template-columns:1.12fr .88fr;gap:28px;align-items:center}
    .coverArt{position:relative;min-height:455px;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,var(--sky),var(--mint));border:3px solid #fff;box-shadow:var(--shadow2)}
    .coverArt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.coverFallback{position:absolute;inset:0;display:grid;place-items:center;font-size:100px}
    .title{font-size:56px;font-weight:1000;line-height:1.06;margin:0 0 14px}.subtitle{font-size:24px;font-weight:750;line-height:1.48;color:#58697e;margin:0 0 18px}
    .pillRow{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 20px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--cream);border:2px solid #fff;padding:10px 16px;font-size:18px;font-weight:900;box-shadow:var(--shadow2)}
    .howGoalBox{border-radius:24px;background:#fff9e8;border:3px solid #ffe2a5;padding:14px 16px;margin:14px 0 14px;font-size:18px;font-weight:900;line-height:1.45}.howGoalBox b{font-size:20px}.adaptBox{border-radius:24px;background:#f0fff5;border:3px solid #d7f4df;padding:14px 16px;margin:16px 0 22px;font-size:19px;font-weight:900;line-height:1.45}.adaptBox b{font-size:21px}.adaptBox.small{font-size:18px;margin:10px 0 18px}.adaptBox.warn{background:#fff9e8;border-color:#ffe2a5}
    .btnRow{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.btn{appearance:none;border:0;border-radius:999px;background:#fff;box-shadow:var(--shadow2);min-height:64px;padding:15px 28px;font-size:22px;font-weight:1000;cursor:pointer;transition:transform .12s ease,filter .12s ease}.btn:active{transform:scale(.98)}.btn.primary{background:linear-gradient(180deg,#ffe7aa,var(--yellow))}.btn.mint{background:linear-gradient(180deg,#e3faec,var(--mint))}.btn.ghost{background:rgba(255,255,255,.84)}.btn.small{min-height:48px;padding:10px 18px;font-size:18px}.switch{display:inline-flex;align-items:center;gap:9px;font-size:18px;font-weight:900;cursor:pointer;user-select:none}.switch input{width:24px;height:24px}.tip{font-size:18px;color:#66798d;font-weight:800;line-height:1.45;margin-top:14px}
    .stage{position:relative;z-index:1;width:min(1120px,96vw);height:min(680px,74vh);border-radius:36px;overflow:hidden;border:3px solid rgba(255,255,255,.94);box-shadow:var(--shadow);background:linear-gradient(180deg,var(--sky),var(--mint));touch-action:manipulation}
    .stageBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stageFallback{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky) 0 48%,var(--mint) 48%)}.stageFallback:before{content:"";position:absolute;left:24%;right:18%;bottom:0;height:45%;background:var(--cream);transform:skewX(-8deg);border-radius:24px 24px 0 0}.stageFallback:after{content:"";position:absolute;left:30%;right:25%;bottom:16%;height:25%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.95) 0 50px,transparent 50px 86px);border-radius:22px;transform:skewX(-8deg)}
    .sceneObj{position:absolute;z-index:3}.sceneObj img{width:100%;height:100%;object-fit:contain;display:block}.fallbackEmoji{display:none;position:absolute;inset:0;place-items:center;background:rgba(255,255,255,.78);border:3px solid #fff;border-radius:26px;box-shadow:var(--shadow2);font-size:64px}
    .traffic{left:7%;top:21%;width:142px;height:142px}.bear{left:7%;bottom:11%;width:170px;height:170px}.animal{right:17%;bottom:16%;width:160px;height:160px;cursor:pointer;transition:transform .36s ease}.animal.cross{transform:translateX(-360px) translateY(-16px)}.fake{right:8%;top:30%;width:118px;height:118px}.hand{right:20%;bottom:35%;width:94px;height:94px;animation:tapPulse 1s ease-in-out infinite;z-index:6}@keyframes tapPulse{0%,100%{transform:translateY(-8px) scale(1)}50%{transform:translateY(8px) scale(.94)}}
    .hud{position:absolute;z-index:8;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}.hudGroup{display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:auto}.hudItem{display:inline-flex;align-items:center;gap:8px;min-height:46px;border-radius:999px;background:rgba(255,255,255,.89);border:2px solid #fff;box-shadow:var(--shadow2);padding:9px 14px;font-size:18px;font-weight:1000}.hudBtn{cursor:pointer}.hudStar{width:24px;height:24px;object-fit:contain}.screenTag{position:absolute;z-index:9;left:50%;top:18px;transform:translateX(-50%);background:rgba(255,255,255,.91);border:2px solid #fff;border-radius:999px;box-shadow:var(--shadow2);padding:10px 22px;font-size:20px;font-weight:1000}.targetCard{position:absolute;z-index:10;left:50%;bottom:14px;transform:translateX(-50%);width:min(910px,92%);border-radius:28px;background:rgba(255,255,255,.94);border:3px solid rgba(143,217,168,.9);box-shadow:var(--shadow2);padding:15px 20px;text-align:center;font-size:25px;line-height:1.35;font-weight:1000}.targetCard.strong{border-color:#ffd97a;background:rgba(255,252,236,.96)}.dialogue{position:absolute;z-index:9;left:50%;bottom:88px;transform:translateX(-50%);width:min(880px,90%);border-radius:28px;background:rgba(255,255,255,.94);border:3px solid #fff;box-shadow:var(--shadow2);padding:16px 22px;text-align:center;font-size:22px;line-height:1.45;font-weight:850}.bottomControls{position:absolute;z-index:12;right:28px;bottom:26px;display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.progressDots{position:absolute;z-index:9;left:28px;bottom:28px;display:flex;gap:8px}.dot{width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid rgba(49,68,91,.18);box-shadow:var(--shadow2)}.dot.on{background:var(--yellow)}
    .sticker{position:absolute;z-index:13;left:52%;top:28%;min-width:240px;min-height:88px;border-radius:28px;background:rgba(255,255,255,.95);border:3px solid #fff;box-shadow:var(--shadow);padding:12px 18px;display:flex;align-items:center;gap:12px;font-size:24px;font-weight:1000;animation:floatUp .85s ease forwards;pointer-events:none}.sticker img{width:62px;height:62px;object-fit:contain}.sticker.success{border-color:#bfeed2}.sticker.hint{border-color:#ffd97a}@keyframes floatUp{0%{opacity:0;transform:translate(-50%,18px) scale(.96)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
    .modalShade{position:absolute;z-index:30;inset:0;display:grid;place-items:center;background:rgba(49,68,91,.24);padding:20px}.modal{width:min(690px,94vw);border-radius:34px;background:rgba(255,255,255,.96);border:3px solid #fff;box-shadow:var(--shadow);padding:30px;text-align:center}.modal h2{font-size:42px;line-height:1.15;margin:0 0 12px;font-weight:1000}.modal p{font-size:23px;line-height:1.5;margin:0 0 18px;color:#58697e;font-weight:800}.countdown{position:relative;z-index:11;border-radius:42px;background:rgba(255,255,255,.92);border:3px solid #fff;box-shadow:var(--shadow);padding:42px 64px;text-align:center;font-size:92px;font-weight:1000}.countdown span{font-size:34px}
    .result{width:min(1040px,95vw);display:grid;grid-template-columns:.78fr 1.22fr;gap:28px;align-items:center}.badgeBox{position:relative;min-height:390px;display:grid;place-items:center;border-radius:34px;background:linear-gradient(180deg,#fff,var(--cream));border:3px solid #fff;box-shadow:var(--shadow2);overflow:hidden}.badgeBox img{width:78%;height:78%;object-fit:contain}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}.stat{border-radius:24px;background:var(--cream);border:2px solid #fff;padding:14px;box-shadow:var(--shadow2)}.stat b{display:block;font-size:32px;line-height:1.1}.stat span{font-size:16px;color:#66798d;font-weight:900}.recommend{border-radius:24px;background:#effff4;border:3px solid #d7f4df;padding:15px 18px;font-size:20px;line-height:1.45;font-weight:1000;margin-top:12px}.recommend.warn{background:#fff9e8;border-color:#ffe2a5}.low .sticker{animation:none;opacity:1}.low .animal.cross{transform:translateX(-285px) translateY(-10px)}.low .stage,.low .card,.low .modal{box-shadow:0 9px 20px rgba(49,68,91,.10)}
    @media(max-width:760px){.screen{padding:12px}.cover,.result{grid-template-columns:1fr}.coverArt{min-height:250px}.title{font-size:38px}.subtitle{font-size:19px}.stage{height:76vh}.traffic{left:4%;top:18%;width:110px;height:110px}.bear{left:4%;bottom:13%;width:128px;height:128px}.animal{right:12%;bottom:18%;width:130px;height:130px}.fake{right:4%;top:34%;width:90px;height:90px}.dialogue{font-size:18px;bottom:82px;padding:12px 14px}.targetCard{font-size:19px;padding:12px 14px}.hudItem{font-size:14px;padding:7px 9px;min-height:38px}.btn{font-size:19px;min-height:56px;padding:12px 20px}.screenTag{font-size:16px}.stats{grid-template-columns:1fr}.bottomControls{right:16px;bottom:20px}.progressDots{left:18px;bottom:20px}.adaptBox{font-size:17px}.modal h2{font-size:34px}.modal p{font-size:19px}}
  </style>
  <link rel="stylesheet" href="../shared/unified.css">
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";
  const ASSETS={
    cover:"assets/cover.png",tutorial01:"assets/tutorial_01.png",tutorial02:"assets/tutorial_02.png",tutorial03:"assets/tutorial_03.png",tutorial04:"assets/tutorial_04.png",tutorial05:"assets/tutorial_05.png",tutorial06:"assets/tutorial_06.png",bgGame:"assets/bg_game.png",bgLow:"assets/bg_low.png",bear:"assets/bear_guardian.png",bunny:"assets/animal_bunny.png",duck:"assets/animal_duck.png",cat:"assets/animal_cat.png",squirrel:"assets/animal_squirrel.png",hedgehog:"assets/animal_hedgehog.png",trafficIdle:"assets/traffic_idle.png",trafficGreen:"assets/traffic_green.png",trafficRed:"assets/traffic_red.png",trafficYellow:"assets/traffic_yellow.png",fake:"assets/fake_pinwheel.png",hand:"assets/hand_tap.png",success:"assets/sticker_success.png",hint:"assets/sticker_hint.png",badge:"assets/result_badge.png",star:"assets/star.png"
  };
  const STORAGE="animal_crossing_go_nogo_v3_last_performance";
  const LOW_KEY="animal_crossing_go_nogo_v3_low";
  const animals=[
    {id:"bunny",name:"小兔",img:ASSETS.bunny,emoji:"🐰"},{id:"duck",name:"小鸭",img:ASSETS.duck,emoji:"🐥"},{id:"cat",name:"小猫",img:ASSETS.cat,emoji:"🐱"},{id:"squirrel",name:"小松鼠",img:ASSETS.squirrel,emoji:"🐿️"},{id:"hedgehog",name:"小刺猬",img:ASSETS.hedgehog,emoji:"🦔"}
  ];
  const baseLevels=[
    {level:1,label:"轻松入门",duration:30,trials:10,green:.60,red:.30,yellow:.10,fake:0,goMs:3000,noGoMs:1200,yellowMs:1800},
    {level:2,label:"轻松练习",duration:35,trials:12,green:.55,red:.30,yellow:.15,fake:0,goMs:2600,noGoMs:1400,yellowMs:1700},
    {level:3,label:"轻松巩固",duration:40,trials:14,green:.50,red:.30,yellow:.20,fake:1,goMs:2300,noGoMs:1500,yellowMs:1600},
    {level:4,label:"小挑战",duration:45,trials:16,green:.50,red:.30,yellow:.20,fake:2,goMs:2000,noGoMs:1700,yellowMs:1500},
    {level:5,label:"小挑战",duration:50,trials:18,green:.45,red:.35,yellow:.20,fake:3,goMs:1800,noGoMs:1800,yellowMs:1400},
    {level:6,label:"进阶挑战",duration:55,trials:20,green:.45,red:.35,yellow:.20,fake:4,goMs:1600,noGoMs:1900,yellowMs:1300},
    {level:7,label:"进阶挑战",duration:60,trials:22,green:.40,red:.40,yellow:.20,fake:5,goMs:1450,noGoMs:2000,yellowMs:1250},
    {level:8,label:"进阶挑战",duration:60,trials:24,green:.40,red:.40,yellow:.20,fake:6,goMs:1300,noGoMs:2100,yellowMs:1200},
    {level:9,label:"进阶挑战",duration:65,trials:26,green:.38,red:.42,yellow:.20,fake:7,goMs:1150,noGoMs:2200,yellowMs:1100},
    {level:10,label:"进阶挑战",duration:70,trials:28,green:.35,red:.45,yellow:.20,fake:8,goMs:1000,noGoMs:2300,yellowMs:1000}
  ];
  const tutorial=[
    {bg:ASSETS.tutorial01,tag:"教学 1 / 6",light:"idle",animal:animals[0],target:"当前目标：先看红绿灯",text:"你好呀，我是小熊守护员。小动物过马路前，我们先一起看灯。"},
    {bg:ASSETS.tutorial02,tag:"教学 2 / 6",light:"green",animal:animals[0],target:"当前目标：绿灯亮了，轻点小动物",text:"看到绿灯，就帮小动物过马路。手势会演示轻点一次。",hand:true,cross:true},
    {bg:ASSETS.tutorial03,tag:"教学 3 / 6",light:"green",animal:animals[1],target:"当前目标：绿灯点一下",text:"现在你来试试。绿灯亮着，轻点小鸭。",hand:true},
    {bg:ASSETS.tutorial04,tag:"教学 4 / 6",light:"red",animal:animals[2],target:"当前目标：红灯停住，不点",text:"看到红灯，小手先休息。等一等，也是帮小动物。"},
    {bg:ASSETS.tutorial05,tag:"教学 5 / 6",light:"yellow",animal:animals[3],target:"当前目标：黄灯等等看",text:"黄灯不是现在点。先等等，看看接下来变成什么灯。"},
    {bg:ASSETS.tutorial06,tag:"教学 6 / 6",light:"red",animal:animals[4],target:"当前目标：只看红绿灯，不看小风车",text:"花园里有绿色小风车，但真正要看的，是红绿灯。",fake:true}
  ];
  const practice=[
    {type:"GO",light:"green",target:"当前目标：绿灯点一下",text:"绿灯亮了，轻点小动物。",animal:animals[1],goMs:3000},
    {type:"RED_WAIT",light:"red",target:"当前目标：红灯停住，不点",text:"红灯亮了，小手休息。",animal:animals[2],waitMs:2200},
    {type:"YELLOW_GREEN",light:"yellow",target:"当前目标：黄灯等等看",text:"先等等，变绿灯再点。",animal:animals[3],yellowMs:1800,goMs:3000},
    {type:"GO",light:"green",target:"当前目标：绿灯点一下",text:"再帮一只小动物过马路。",animal:animals[0],goMs:2800},
    {type:"FAKE_RED",light:"red",target:"当前目标：只看红绿灯，不看小风车",text:"红灯亮着，绿色小风车只是装饰。",animal:animals[4],waitMs:2200,fake:true},
    {type:"YELLOW_RED",light:"yellow",target:"当前目标：黄灯等等看",text:"黄灯后如果还是不能走，就继续等等。",animal:animals[1],yellowMs:1500,waitMs:1800}
  ];

  let timers=[];
  const app=document.getElementById("app");
  const initialPlan=loadPlan();
  let state={screen:"cover",low:localStorage.getItem(LOW_KEY)==="1",tutorialIndex:0,practiceIndex:0,practicePhase:"green",practiceFeedback:null,practiceCross:false,practiceHand:false,countdown:3,nextPlan:initialPlan,result:null,training:null};

  function loadLast(){try{return JSON.parse(localStorage.getItem(STORAGE)||"null")}catch(e){return null}}
  function saveLast(data){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){}}
  function loadPlan(){const last=loadLast();if(!last)return {level:1,mode:"steady",source:"初次训练",last:null};return {level:last.nextLevel||1,mode:last.nextMode||"steady",source:"来自最近一局",last:last}}
  function modeText(mode){if(mode==="faster")return "更快节奏";if(mode==="slower")return "慢速提示";return "标准节奏"}
  function modeDetail(mode){if(mode==="faster")return "红绿灯切换更快，试次更多";if(mode==="slower")return "速度更慢，提示更明显";return "保持当前节奏"}
  function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
  function adaptiveConfig(level,mode){const base=Object.assign({},baseLevels[clamp(level,1,10)-1]);base.mode=mode;base.strongHints=false;base.adaptiveNote=modeDetail(mode);if(mode==="faster"){base.trials+=2;base.goMs=Math.round(base.goMs*.85);base.noGoMs=Math.round(base.noGoMs*.9);base.yellowMs=Math.round(base.yellowMs*.85);base.duration+=5}else if(mode==="slower"){base.trials=Math.max(8,base.trials-2);base.goMs=Math.round(base.goMs*1.35);base.noGoMs=Math.round(base.noGoMs*1.25);base.yellowMs=Math.round(base.yellowMs*1.25);base.fake=Math.max(0,base.fake-1);base.duration+=5;base.strongHints=true}return base}
  function clearTimers(){timers.forEach(clearTimeout);timers=[]}
  function later(fn,ms){const id=setTimeout(fn,Math.max(0,ms));timers.push(id)}
  function set(patch){Object.assign(state,patch);paint()}
  function paint(){clearTimers();document.body.className=state.low?"low":"";if(state.screen==="cover")renderCover();if(state.screen==="tutorial")renderTutorial();if(state.screen==="practice")renderPractice();if(state.screen==="ready")renderReady();if(state.screen==="countdown")renderCountdown();if(state.screen==="training")renderTraining();if(state.screen==="paused")renderPaused();if(state.screen==="result")renderResult();schedule()}
  function bg(url){return `style="background-image:linear-gradient(180deg,rgba(221,242,255,.18),rgba(255,248,236,.14)),url('${url}')"`}
  function imageObj(src,cls,emoji,alt){return `<div class="sceneObj ${cls}" aria-label="${alt||""}"><img src="${src}" alt="${alt||""}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"/><div class="fallbackEmoji">${emoji||"✨"}</div></div>`}
  function trafficSrc(light){if(light==="green")return ASSETS.trafficGreen;if(light==="red")return ASSETS.trafficRed;if(light==="yellow")return ASSETS.trafficYellow;return ASSETS.trafficIdle}
  function sticker(data){if(!data)return "";const src=data.kind==="hint"?ASSETS.hint:ASSETS.success;return `<div class="sticker ${data.kind}"><img src="${src}" alt="" onerror="this.style.display='none'"/><span>${data.text}</span></div>`}
  function scene(bgSrc,light,animal,opt){opt=opt||{};const useBg=state.low?ASSETS.bgLow:bgSrc;return `<div class="stage" data-action="stageTap"><div class="stageFallback"></div><img class="stageBg" src="${useBg}" alt="" onerror="this.style.display='none'"/>${imageObj(trafficSrc(light),"traffic","🚦","红绿灯")}${imageObj(ASSETS.bear,"bear","🐻","小熊守护员")}${animal?imageObj(animal.img,"animal "+(opt.cross?"cross":""),animal.emoji,animal.name):""}${opt.fake?imageObj(ASSETS.fake,"fake","🟢","绿色小风车"):""}${opt.hand?imageObj(ASSETS.hand,"hand","👆","点击手势"):""}${sticker(opt.feedback)}</div>`}
  function progressDots(i){let s="<div class='progressDots'>";for(let n=0;n<6;n++)s+=`<span class="dot ${n<=i?"on":""}"></span>`;return s+"</div>"}
  function coverAdaptiveText(){const p=state.nextPlan;const last=p.last;if(!last){return `<div class="adaptBox"><b>难度会自动调节</b><br>系统会记住最近一局表现。正确率≥80% 时，下一轮红绿灯切换更快、试次更多；正确率≤50% 时，下一轮速度更慢、提示更明显。</div>`}return `<div class="adaptBox"><b>难度会自动调节</b><br>最近一局：本轮表现 ${Math.round(last.accuracy*100)}%，下轮推荐难度：第 ${p.level} 级 · ${modeText(p.mode)}（${modeDetail(p.mode)}）。</div>`}
  function renderCover(){app.innerHTML=`<main class="screen"><div class="absBg" ${bg(ASSETS.cover)}></div><section class="card cover"><div class="coverArt"><img src="${ASSETS.cover}" alt="小动物过马路封面" onerror="this.style.display='none'"/><div class="coverFallback">🐻🚦🐰</div></div><div><h1 class="title">小动物过马路</h1><p class="subtitle">和小熊守护员一起看红绿灯，帮小动物安全通过花园斑马线。</p><div class="howGoalBox">怎么玩：绿灯出现时点一下小动物，红灯出现时忍住不点，黄灯先等等。<br>目标是什么：练习看见信号后做出合适反应，安全帮助小动物过马路。</div><div class="pillRow"><span class="pill">绿灯点一下</span><span class="pill">红灯停住</span><span class="pill">黄灯等等看</span></div>${coverAdaptiveText()}<div class="btnRow"><button class="btn primary" data-action="startTutorial">开始教学</button><label class="switch"><input type="checkbox" ${state.low?"checked":""} data-action="toggleLow"/>低刺激模式</label></div><div class="tip">提示：按空格键也可以当作“点一下”。图片全部来自本地 assets 文件夹。</div></div></section></main>`}
  function renderTutorial(){const step=tutorial[state.tutorialIndex];const cross=!!step.cross;const last=state.tutorialIndex>=5;app.innerHTML=`<main class="screen">${scene(step.bg,step.light,step.animal,{hand:step.hand,fake:step.fake,cross:cross,feedback:step.cross?{text:"演示：安全通过 +1",kind:"success"}:null})}<div class="screenTag">${step.tag}</div><div class="dialogue">${step.text}${last?"<br>马上进入低压练习。":""}</div><div class="targetCard">${step.target}</div>${progressDots(state.tutorialIndex)}<div class="bottomControls"><button class="btn primary" data-action="${last?"startPractice":"nextTutorial"}">${last?"马上进入低压练习":"下一步"}</button></div></main>`}
  function renderPractice(){const r=practice[state.practiceIndex];let light=state.practicePhase;if(r.type==="GO")light="green";if(r.type==="RED_WAIT"||r.type==="FAKE_RED")light="red";let target=r.target,text=r.text;if(r.type==="YELLOW_GREEN"&&state.practicePhase==="green"){light="green";target="当前目标：变绿灯了，轻点小动物";text="现在变绿灯了，可以轻点小动物。"}if(r.type==="YELLOW_RED"&&state.practicePhase==="red"){light="red";target="当前目标：还是要等等，小手休息";text="现在变红灯了，继续等等。"}app.innerHTML=`<main class="screen">${scene(ASSETS.bgGame,light,r.animal,{fake:r.fake,feedback:state.practiceFeedback,cross:state.practiceCross,hand:state.practiceHand})}<div class="hud"><div class="hudGroup"><div class="hudItem">低压练习 ${state.practiceIndex+1} / ${practice.length}</div></div><div class="hudGroup"><div class="hudItem">不计成绩</div></div></div><div class="dialogue">${text}</div><div class="targetCard">${target}</div><div class="bottomControls"><button class="btn ghost small" data-action="restartTutorial">重新演示</button></div></main>`}
  function renderReady(){const p=state.nextPlan;app.innerHTML=`<main class="screen">${scene(ASSETS.bgGame,"idle",animals[0],{})}<div class="targetCard">当前目标：绿灯点一下｜红灯停住｜黄灯等等看</div><div class="modalShade"><section class="modal"><h2>准备开始训练吧！</h2><p>难度会自动调节。系统会根据最近一局表现安排下一轮速度和试次数。</p><div class="howGoalBox">怎么玩：绿灯出现时点一下小动物，红灯出现时忍住不点，黄灯先等等。<br>目标是什么：练习看见信号后做出合适反应，安全帮助小动物过马路。</div><div class="adaptBox small"><b>本轮将使用：</b>第 ${p.level} 级 · ${modeText(p.mode)}<br>${modeDetail(p.mode)}</div><div class="btnRow" style="justify-content:center"><button class="btn ghost" data-action="restartTutorial">重新演示</button><button class="btn primary" data-action="startCountdown">进入训练</button></div></section></div></main>`}
  function renderCountdown(){app.innerHTML=`<main class="screen">${scene(ASSETS.bgGame,"idle",animals[0],{})}<div class="targetCard">当前目标：绿灯点一下｜红灯停住｜黄灯等等看</div><div class="countdown">${state.countdown}<br><span>${state.countdown===3?"看灯":state.countdown===2?"准备":"开始"}</span></div></main>`}
  function renderTraining(){const t=state.training;if(!t)return;const tr=cur();const sec=Math.ceil(Math.max(0,t.endAt-Date.now())/1000);const hand=t.config.strongHints&&t.phase==="active"&&t.light==="green";const target=targetFor(tr,t.light)+(t.config.strongHints?"｜提示已加大":"");app.innerHTML=`<main class="screen">${scene(ASSETS.bgGame,t.light,tr?tr.animal:null,{fake:tr&&tr.fake,feedback:t.feedback,cross:t.cross,hand})}<div class="hud"><div class="hudGroup"><button class="hudItem hudBtn" data-action="pause">暂停</button><div class="hudItem">难度：第 ${t.level} 级 · ${t.config.label}</div><div class="hudItem">自适应：${modeText(t.mode)}</div></div><div class="hudGroup"><div class="hudItem">倒计时：${fmt(sec)}</div><div class="hudItem"><img class="hudStar" src="${ASSETS.star}" alt="" onerror="this.style.display='none'"/>星星：${t.score}</div><div class="hudItem">${t.index+1} / ${t.trials.length}</div></div></div><div class="targetCard ${t.config.strongHints?"strong":""}">${target}</div></main>`}
  function renderPaused(){app.innerHTML=`<main class="screen">${scene(ASSETS.bgGame,"idle",animals[0],{})}<div class="modalShade"><section class="modal"><h2>先休息一下</h2><p>训练已暂停。继续后从当前这一轮接着玩。</p><div class="btnRow" style="justify-content:center"><button class="btn primary" data-action="resume">继续训练</button><button class="btn mint" data-action="restartTraining">重新开始本轮</button><button class="btn ghost" data-action="goCover">回到封面</button></div></section></div></main>`}
  function renderResult(){const r=state.result||emptyResult();const warn=r.nextMode==="slower";app.innerHTML=`<main class="screen"><div class="absBg" ${bg(state.low?ASSETS.bgLow:ASSETS.bgGame)}></div><section class="card result"><div class="badgeBox"><img src="${ASSETS.badge}" alt="花园守护星徽章" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"/><div class="fallbackEmoji" style="font-size:120px">🏅</div></div><div><h1 class="title" style="font-size:42px">${r.title}</h1><p class="subtitle">${r.message}</p><div class="stats"><div class="stat"><b>${r.score}</b><span>星星</span></div><div class="stat"><b>${Math.round(r.accuracy*100)}%</b><span>本轮表现</span></div><div class="stat"><b>${r.waits}</b><span>稳稳等待</span></div><div class="stat"><b>${r.medianRt?r.medianRt+'ms':'—'}</b><span>绿灯中位反应</span></div></div><div class="recommend ${warn?"warn":""}"><b>本轮表现：</b>${r.performanceText}</div><div class="recommend"><b>下轮推荐难度：</b>第 ${r.nextLevel} 级 · ${modeText(r.nextMode)}。${modeDetail(r.nextMode)}。</div><div class="adaptBox small">难度会自动调节：本结果已保存到 localStorage，下一次进入训练会自动读取。</div><div class="btnRow" style="margin-top:18px"><button class="btn primary" data-action="restartTraining">按推荐再玩</button><button class="btn mint" data-action="restartTutorial">重新演示</button><button class="btn ghost" data-action="goCover">回到封面</button></div></div></section></main>`}

  function schedule(){if(state.screen==="tutorial"&&state.tutorialIndex>=5)later(()=>startPracticeRound(0),2800);if(state.screen==="practice")schedulePractice();if(state.screen==="countdown")later(()=>{if(state.countdown>1)set({countdown:state.countdown-1});else startTrainingFromPlan()},850);if(state.screen==="training")scheduleTraining()}
  function startPracticeRound(i){if(i>=practice.length){set({screen:"ready"});return}const r=practice[i];let phase=r.type==="YELLOW_GREEN"||r.type==="YELLOW_RED"?"yellow":r.light;set({screen:"practice",practiceIndex:i,practicePhase:phase,practiceFeedback:null,practiceCross:false,practiceHand:false})}
  function schedulePractice(){const r=practice[state.practiceIndex];if(!r)return;if(state.practiceFeedback){later(()=>{if(state.practiceFeedback.kind==="success")startPracticeRound(state.practiceIndex+1);else startPracticeRound(state.practiceIndex)},900);return}if(r.type==="GO")later(()=>set({practiceHand:true,practiceFeedback:{text:"绿灯时可以轻点一下哦",kind:"hint"}}),r.goMs);if(r.type==="RED_WAIT"||r.type==="FAKE_RED")later(()=>practiceSuccess(r.fake?"你看的是红绿灯，很稳":"等得很稳"),r.waitMs);if(r.type==="YELLOW_GREEN"){if(state.practicePhase==="yellow")later(()=>set({practicePhase:"green"}),r.yellowMs);else if(state.practicePhase==="green")later(()=>set({practiceHand:true,practiceFeedback:{text:"绿灯可以轻点一下哦",kind:"hint"}}),r.goMs)}if(r.type==="YELLOW_RED"){if(state.practicePhase==="yellow")later(()=>set({practicePhase:"red"}),r.yellowMs);else if(state.practicePhase==="red")later(()=>practiceSuccess("等等也很重要"),r.waitMs)}}
  function practiceSuccess(text){set({practiceFeedback:{text,kind:"success"},practiceCross:true,practiceHand:false})}
  function practiceHint(text){set({practiceFeedback:{text,kind:"hint"},practiceHand:false,practiceCross:false})}
  function practiceTap(){const r=practice[state.practiceIndex];if(!r||state.practiceFeedback)return;if(r.type==="GO")practiceSuccess("安全通过");else if(r.type==="RED_WAIT")practiceHint("红灯先停住哦");else if(r.type==="FAKE_RED")practiceHint("小风车不是红绿灯哦");else if(r.type==="YELLOW_GREEN"){state.practicePhase==="green"?practiceSuccess("看灯很仔细"):practiceHint("黄灯先等等哦")}else if(r.type==="YELLOW_RED")practiceHint(state.practicePhase==="yellow"?"黄灯先等等哦":"红灯要停住哦")}
  function buildTrials(cfg){let arr=[];let g=Math.round(cfg.trials*cfg.green),r=Math.round(cfg.trials*cfg.red),y=cfg.trials-g-r;for(let i=0;i<g;i++)arr.push({type:"GO",expected:"tap"});for(let i=0;i<r;i++)arr.push({type:"RED",expected:"wait"});for(let i=0;i<y;i++)arr.push({type:i%2?"YELLOW_RED":"YELLOW_GREEN",expected:i%2?"wait":"waitThenTap"});arr=shuffle(arr).map((x,i)=>Object.assign({},x,{id:"t"+i,animal:animals[i%animals.length],fake:false}));let f=cfg.fake;for(let i=0;i<arr.length&&f>0;i++){if(arr[i].type==="RED"){arr[i].type="FAKE_RED";arr[i].fake=true;f--}}return arr}
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));let tmp=a[i];a[i]=a[j];a[j]=tmp}return a}
  function startTrainingFromPlan(){startTraining(state.nextPlan.level,state.nextPlan.mode)}
  function startTraining(level,mode){const lv=clamp(Number(level)||1,1,10);const md=mode||"steady";const cfg=adaptiveConfig(lv,md);const now=Date.now();state.training={sessionStartedAt:now,level:lv,mode:md,config:cfg,trials:buildTrials(cfg),index:0,phase:"prepare",light:"idle",score:0,streak:0,results:[],endAt:now+cfg.duration*1000,deadline:now+550,feedback:null,cross:false,startedAt:0,pauseLeft:0};set({screen:"training"})}
  function scheduleTraining(){const t=state.training;if(!t)return;if(Date.now()>=t.endAt||t.index>=t.trials.length){finishTraining();return}later(()=>paint(),500);const remain=Math.max(0,t.deadline-Date.now());if(t.phase==="prepare")later(()=>activateTrial(),remain);else if(t.phase==="active")later(()=>deadlineTrial(),remain);else if(t.phase==="feedback")later(()=>nextTrial(),remain)}
  function cur(){const t=state.training;return t?t.trials[t.index]:null}
  function activateTrial(){const t=state.training,tr=cur();if(!t||!tr)return finishTraining();const cfg=t.config,now=Date.now();t.phase="active";t.feedback=null;t.cross=false;t.startedAt=now;if(tr.type==="GO"){t.light="green";t.deadline=now+cfg.goMs}else if(tr.type==="RED"||tr.type==="FAKE_RED"){t.light="red";t.deadline=now+cfg.noGoMs}else{t.light="yellow";t.deadline=now+cfg.yellowMs}paint()}
  function deadlineTrial(){const t=state.training,tr=cur();if(!t||!tr||t.phase!=="active")return;const cfg=t.config,now=Date.now();if(tr.type==="GO")resolve("missedTap","绿灯时可以轻点一下","hint",null,false);else if(tr.type==="RED"||tr.type==="FAKE_RED")resolve("correctWait",tr.fake?"你看的是红绿灯，很稳 +13":"等得很稳 +10","success",null,false);else if(tr.type==="YELLOW_GREEN"){if(t.light==="yellow"){t.light="green";t.startedAt=now;t.deadline=now+cfg.goMs;paint()}else resolve("missedTap","绿灯时可以轻点一下","hint",null,false)}else if(tr.type==="YELLOW_RED"){if(t.light==="yellow"){t.light="red";t.deadline=now+cfg.noGoMs;paint()}else resolve("correctWait","等等也很重要 +8","success",null,false)}}
  function trainingTap(){const t=state.training,tr=cur();if(!t||!tr||t.phase!=="active")return;if(t.light==="green"){let rt=Math.max(80,Date.now()-t.startedAt);resolve("safe",rt<t.config.goMs*.55?"反应真快 +12":"安全通过 +10","success",rt,false)}else if(t.light==="red")resolve("earlyTap","先看灯哦，红灯要停住","hint",null,true);else if(t.light==="yellow")resolve("earlyTap","黄灯先等等哦","hint",null,true)}
  function resolve(outcome,text,kind,rt,falseTap){const t=state.training,tr=cur();if(!t||!tr)return;let success=kind==="success";if(success){let pts=text.includes("+13")?13:text.includes("+12")?12:text.includes("+8")?8:10;t.score+=pts;t.streak++;if(t.streak&&t.streak%5===0)t.score+=5}else t.streak=0;const errorType=success?null:(falseTap?"commission":(outcome==="missedTap"?"omission":outcome));const difficultyParams={adaptiveMode:t.mode,goMs:t.config.goMs,noGoMs:t.config.noGoMs,yellowMs:t.config.yellowMs,goRate:t.config.green,noGoRate:t.config.red,yellowRate:t.config.yellow,fakeCount:t.config.fake};t.results.push({trialId:`reaction-time-${t.index+1}`,gameId:"reaction-time",domain:"attention",taskFamily:"go-no-go",mode:"training",level:t.level,trialIndex:t.index+1,stimulus:{trialType:tr.type,light:t.light,animal:tr.animal,fake:!!tr.fake,onsetMs:t.armedAt||null},condition:{adaptiveMode:t.mode,trialType:tr.type,expectedAction:tr.expected,goMs:t.config.goMs,noGoMs:t.config.noGoMs,yellowMs:t.config.yellowMs},correctAnswer:tr.expected,response:outcome,outcome,correct:success,rtMs:rt,errorType,falseTap:!!falseTap,reactionTime:rt,difficultyParams});t.phase="feedback";t.feedback={text:text,kind:kind};t.cross=success&&tr.expected!=="wait";t.deadline=Date.now()+(state.low?950:760);paint()}
  function nextTrial(){const t=state.training;if(!t)return;t.index++;if(t.index>=t.trials.length||Date.now()>=t.endAt){finishTraining();return}t.phase="prepare";t.light="idle";t.feedback=null;t.cross=false;t.deadline=Date.now()+(state.low?820:560);paint()}
  function finishTraining(){const t=state.training;if(!t)return;const res=analyze(t);state.result=res;state.nextPlan={level:res.nextLevel,mode:res.nextMode,source:"来自最近一局",last:res.saved};state.training=null;set({screen:"result"})}
  function analyze(t){const total=Math.max(1,t.results.length);const safe=t.results.filter(r=>r.outcome==="safe"||r.outcome==="correctWait").length;const accuracy=safe/total;const falseTaps=t.results.filter(r=>r.falseTap).length;const waits=t.results.filter(r=>r.outcome==="correctWait").length;const rts=t.results.map(r=>r.reactionTime).filter(Boolean).sort((a,b)=>a-b);const medianRt=rts.length?rts[Math.floor(rts.length/2)]:null;let title="认真看灯的小帮手",message="你已经很会看红绿灯了，可以再练一轮，让小手更稳定。",nextLevel=t.level,nextMode="steady",performanceText=`完成 ${safe}/${total} 次，正确率 ${Math.round(accuracy*100)}%，温和提示 ${total-safe} 次。`;
    if(accuracy>=.8){title="花园守护星";message="本轮观察很稳定。下一轮会自动提高一点节奏。";nextLevel=clamp(t.level+1,1,10);nextMode="faster"}
    else if(accuracy<=.5){title="慢慢来，也很好";message="刚才信号有点快。下一轮会自动放慢，并把提示变得更明显。";nextLevel=clamp(t.level-1,1,10);nextMode="slower"}
    const omissionErrors=t.results.filter(r=>r.errorType==="omission").length;const commissionErrors=t.results.filter(r=>r.errorType==="commission").length;const saved={version:3,playedAt:new Date().toISOString(),level:t.level,mode:t.mode,score:t.score,accuracy:accuracy,total:total,safe:safe,falseTaps:falseTaps,commissionErrors,omissionErrors,medianRt:medianRt,nextLevel:nextLevel,nextMode:nextMode,performanceText:performanceText};saveLast(saved);if(window.CognitiveGameRecorder){window.CognitiveGameRecorder.record("reaction-time",{domain:"attention",taskFamily:"go-no-go",mode:"training",level:t.level,startedAt:new Date(t.sessionStartedAt||Date.now()).toISOString(),completedAt:new Date().toISOString(),summary:{score:t.score,accuracy,total,safe,falseTaps,commissionErrors,omissionErrors,medianRt,nextLevel,nextMode},trials:t.results,adaptive:{currentMode:t.mode,nextMode,nextLevel,rule:"increase speed after high accuracy and low false taps; slow down after commissions or misses"}})}return{title:title,message:message,score:t.score,accuracy:accuracy,waits:waits,medianRt:medianRt,nextLevel:nextLevel,nextMode:nextMode,performanceText:performanceText,saved:saved}}
  function emptyResult(){return{title:"认真看灯的小帮手",message:"这一轮已经完成。",score:0,accuracy:0,waits:0,medianRt:null,nextLevel:1,nextMode:"steady",performanceText:"还没有本轮数据。",saved:null}}
  function targetFor(tr,light){if(!tr)return"当前目标：绿灯点一下｜红灯停住｜黄灯等等看";if(tr.fake)return"当前目标：只看红绿灯，不看小风车";if(light==="green")return"当前目标：绿灯亮了，轻点小动物";if(light==="red")return"当前目标：红灯停住，小手休息";if(light==="yellow")return"当前目标：黄灯等等看";return"当前目标：绿灯点一下｜红灯停住｜黄灯等等看"}
  function fmt(s){s=Math.max(0,Number(s)||0);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

  app.addEventListener("click",function(e){const el=e.target.closest("[data-action]");if(!el)return;const a=el.dataset.action;if(a==="startTutorial")set({screen:"tutorial",tutorialIndex:0});else if(a==="toggleLow"){state.low=el.checked;localStorage.setItem(LOW_KEY,state.low?"1":"0");paint()}else if(a==="nextTutorial"){if(state.tutorialIndex<5)set({tutorialIndex:state.tutorialIndex+1});else startPracticeRound(0)}else if(a==="restartTutorial")set({screen:"tutorial",tutorialIndex:0});else if(a==="startPractice")startPracticeRound(0);else if(a==="stageTap"){if(state.screen==="practice")practiceTap();else if(state.screen==="training")trainingTap()}else if(a==="startCountdown")set({screen:"countdown",countdown:3});else if(a==="pause"){if(state.training){state.training.pauseLeft=Math.max(0,state.training.endAt-Date.now());set({screen:"paused"})}}else if(a==="resume"){if(state.training){state.training.endAt=Date.now()+state.training.pauseLeft;set({screen:"training"})}}else if(a==="restartTraining")startTrainingFromPlan();else if(a==="goCover")set({screen:"cover",training:null,result:null})});
  document.addEventListener("keydown",function(e){if(e.code==="Space"){e.preventDefault();if(state.screen==="practice")practiceTap();else if(state.screen==="training")trainingTap()}if(e.key==="Escape"&&state.screen==="training"&&state.training){state.training.pauseLeft=Math.max(0,state.training.endAt-Date.now());set({screen:"paused"})}});
  paint();
})();
</script>
