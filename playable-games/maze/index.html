<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>萤火虫路线｜可玩认知训练小游戏</title>
  <style>
    :root{
      --cream:#fff7df;
      --cream2:#fff2c8;
      --mint:#c8f2d1;
      --blue:#bfe2ff;
      --night:#173b61;
      --night2:#0d2948;
      --purple:#8d7ad1;
      --orange:#ffb35f;
      --coral:#ff8f78;
      --green:#73c85a;
      --text:#17304c;
      --soft:#f7fbff;
      --shadow:0 18px 50px rgba(8,31,55,.22);
      --shadow2:0 8px 22px rgba(8,31,55,.18);
      --radius:30px;
      --maxw:1180px;
      font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#e8f7ff,#fff8e7);color:var(--text)}
    body{overflow-x:hidden}
    button{font:inherit;border:0;cursor:pointer;color:inherit}
    button:focus-visible{outline:4px solid #ffd86e;outline-offset:3px}
    .app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
    .screen{width:min(var(--maxw),100%);min-height:calc(100vh - 44px);border-radius:36px;position:relative;overflow:hidden;background:rgba(255,255,255,.68);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.75)}
    .bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
    .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,28,50,.55),rgba(8,28,50,.15),rgba(255,248,226,.16));z-index:1}
    .content{position:relative;z-index:2;padding:34px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:5}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.84);box-shadow:var(--shadow2);font-weight:800;color:#284464;white-space:nowrap}
    .logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:900;color:#284464}
    .logo img{width:64px;height:44px;object-fit:cover;border-radius:18px;box-shadow:var(--shadow2)}
    .btnrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
    .btn{min-height:56px;padding:14px 24px;border-radius:999px;font-size:20px;font-weight:900;box-shadow:var(--shadow2);transition:transform .12s ease, filter .12s ease;background:#fff;color:#163452}
    .btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
    .btn.primary{background:linear-gradient(180deg,#98dd69,#4fac45);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.16)}
    .btn.secondary{background:linear-gradient(180deg,#68b7ff,#3588df);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.16)}
    .btn.orange{background:linear-gradient(180deg,#ffc46b,#ff982d);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.14)}
    .btn.ghost{background:rgba(255,255,255,.78);border:2px solid rgba(255,255,255,.85)}
    .btn.small{min-height:44px;font-size:16px;padding:10px 15px}
    .card{background:rgba(255,255,255,.88);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.82)}
    .home-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:stretch;margin-top:24px}
    .home-hero{overflow:hidden;border-radius:34px;background:#123;min-height:520px;position:relative;box-shadow:var(--shadow)}
    .home-hero img{width:100%;height:100%;object-fit:cover;display:block}
    .home-hero .caption{position:absolute;left:24px;right:24px;bottom:24px;background:rgba(255,248,226,.9);border-radius:28px;padding:20px 22px;box-shadow:var(--shadow2)}
    .home-hero h1,.hero-card h1{margin:.05em 0;font-size:clamp(38px,7vw,76px);line-height:1.05;color:#fff9d7;text-shadow:0 4px 16px rgba(0,0,0,.45),0 0 20px rgba(255,219,95,.75)}
    .home-hero .caption h2{margin:0 0 10px;font-size:30px;color:#17304c}
    .home-panel{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:18px}
    .home-panel h2{font-size:36px;margin:0;color:#153a60}
    .lead{font-size:22px;line-height:1.55;margin:0;color:#274b6e}
    .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0}
    .info-tile{background:linear-gradient(180deg,#fff9e8,#f4fff6);border-radius:22px;padding:16px;text-align:center;font-weight:900;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
    .info-tile .emoji{font-size:30px;display:block;margin-bottom:6px}
    .last-box{background:#f6fbff;border:2px dashed #b9ddff;border-radius:22px;padding:14px 16px;font-size:17px;line-height:1.45}
    .detail-layout{display:grid;grid-template-columns:.95fr 1.05fr;gap:26px;align-items:center;margin-top:22px}
    .detail-img{width:100%;border-radius:30px;box-shadow:var(--shadow);display:block}
    .section-title{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:8px 14px;background:#e9e3ff;color:#493a87;font-size:20px;font-weight:900;margin:8px 0 10px}
    .how-list{display:grid;gap:11px;margin:0;padding:0;list-style:none}
    .how-list li{font-size:20px;line-height:1.45;background:#fff9e8;border-radius:18px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
    .how-list b{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#83cc68;color:#fff;flex:none}
    .hero-card{width:min(760px,92%);margin:10vh auto 0;padding:32px;border-radius:34px;background:rgba(9,44,75,.36);backdrop-filter:blur(3px);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.45);text-align:center;color:#fff}
    .hero-card .sub{font-size:25px;line-height:1.5;margin:12px auto 24px;color:#fff9e0;text-shadow:0 2px 7px rgba(0,0,0,.36)}
    .toggle{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:rgba(255,255,255,.84);padding:10px 15px;font-size:17px;font-weight:800;color:#17304c;user-select:none}
    .toggle input{width:22px;height:22px;accent-color:#64b96b}
    .stage-screen{background:#102c4a;color:#fff}
    .stage{position:absolute;inset:0;overflow:hidden;background:#102c4a}
    .stage img.stage-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.96}
    .stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,30,52,.2),rgba(8,30,52,.05) 45%,rgba(8,30,52,.36));pointer-events:none}
    .hud{position:relative;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;padding:18px 20px 0}
    .hud-left,.hud-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hud-right{justify-content:flex-end}
    .hud-card{border-radius:20px;background:rgba(255,255,255,.9);color:#183b5d;padding:10px 14px;font-weight:900;box-shadow:var(--shadow2);min-height:46px;display:flex;align-items:center;gap:8px}
    .hud-card.time{font-variant-numeric:tabular-nums}.pause-btn{width:48px;height:48px;border-radius:50%;background:#6ab6e9;color:#fff;font-size:22px;box-shadow:var(--shadow2);font-weight:900}
    .target-card{justify-self:center;min-width:min(640px,96vw);max-width:760px;border-radius:28px;background:rgba(255,248,226,.94);color:#163a5f;box-shadow:var(--shadow);padding:14px 18px;text-align:center;border:3px solid rgba(255,230,134,.88)}
    .target-card .label{font-size:18px;font-weight:900;color:#6c5bb7}.target-card .route{font-size:clamp(20px,3.2vw,32px);font-weight:900;margin-top:3px;line-height:1.2}.target-card .subline{font-size:16px;color:#496886;margin-top:4px;font-weight:800}
    .scene-caption{position:absolute;z-index:11;left:50%;bottom:24px;transform:translateX(-50%);width:min(920px,calc(100% - 36px));border-radius:28px;background:rgba(255,248,226,.94);color:#17304c;padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:16px}
    .scene-caption h2{margin:0 0 4px;font-size:26px}.scene-caption p{margin:0;font-size:19px;line-height:1.4}.scene-caption .btn{white-space:nowrap}
    .progress-chip{position:absolute;z-index:11;top:92px;left:24px;background:rgba(255,255,255,.88);color:#17304c;border-radius:999px;padding:8px 14px;font-weight:900;box-shadow:var(--shadow2)}
    .node-layer{position:absolute;inset:0;z-index:8}.route-node{position:absolute;transform:translate(-50%,-50%);width:clamp(72px,8vw,96px);height:clamp(72px,8vw,96px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffdf1,#ffe58e 48%,#d5a131);border:4px solid rgba(255,255,255,.92);box-shadow:0 0 0 5px rgba(255,216,93,.18),0 8px 20px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,4.5vw,42px);transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;user-select:none}
    .route-node span{filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}.route-node small{position:absolute;top:100%;margin-top:4px;background:rgba(255,255,255,.9);color:#183b5d;border-radius:999px;padding:2px 8px;font-size:13px;font-weight:900;white-space:nowrap;box-shadow:var(--shadow2)}
    .route-node:disabled{cursor:not-allowed}.route-node.active{transform:translate(-50%,-50%) scale(1.13);box-shadow:0 0 0 9px rgba(255,234,123,.35),0 0 42px 20px rgba(255,222,83,.66),0 8px 20px rgba(0,0,0,.25);filter:brightness(1.16)}
    .route-node.done{background:radial-gradient(circle at 35% 30%,#fffdf1,#b8ff95 50%,#5ab950);box-shadow:0 0 0 6px rgba(117,222,87,.22),0 0 34px rgba(155,255,107,.66)}
    .route-node.wrong{animation:shake .28s ease}.route-node.hint{box-shadow:0 0 0 8px rgba(159,217,255,.35),0 0 34px rgba(159,217,255,.65)}
    @keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 7px),-50%)}75%{transform:translate(calc(-50% + 7px),-50%)}}
    .firefly{position:absolute;z-index:9;width:82px;height:56px;border-radius:30px;background:rgba(255,247,181,.28);box-shadow:0 0 34px rgba(255,223,88,.8);transform:translate(-50%,-50%);transition:left .55s ease,top .55s ease;display:flex;align-items:center;justify-content:center;font-size:35px;pointer-events:none}.firefly::after{content:"✨";position:absolute;right:-18px;top:-18px;font-size:24px;animation:pulse 1.2s infinite}
    @keyframes pulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
    .hand{position:absolute;z-index:13;width:90px;height:90px;background:url('assets/tutorial-hand.png') center/contain no-repeat;filter:drop-shadow(0 8px 15px rgba(0,0,0,.35));animation:tap 1.1s ease-in-out infinite;pointer-events:none}@keyframes tap{0%,100%{transform:translate(18px,18px) scale(1)}45%{transform:translate(0,0) scale(.92)}}
    .toast{position:absolute;z-index:14;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,248,226,.96);color:#17304c;border-radius:28px;padding:18px 24px;box-shadow:var(--shadow);font-size:24px;font-weight:900;text-align:center;display:flex;align-items:center;gap:12px}.toast img{width:64px;height:64px;border-radius:18px;object-fit:cover}
    .practice-panel{position:absolute;z-index:12;right:24px;bottom:24px;width:min(390px,calc(100% - 48px));background:rgba(255,248,226,.94);color:#17304c;border-radius:28px;padding:18px;box-shadow:var(--shadow)}.practice-panel h2{margin:0 0 6px;font-size:25px}.practice-panel p{font-size:18px;line-height:1.45;margin:0 0 12px}
    .distractor{position:absolute;z-index:7;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff7b2,#a7ffb2 55%,rgba(167,255,178,0));box-shadow:0 0 22px rgba(255,235,113,.65);animation:floaty 2.5s ease-in-out infinite;pointer-events:none}@keyframes floaty{0%,100%{opacity:.2;transform:translateY(0) scale(.8)}50%{opacity:.75;transform:translateY(-12px) scale(1)}}
    .modal-backdrop{position:absolute;inset:0;z-index:30;background:rgba(11,34,58,.55);display:flex;align-items:center;justify-content:center;padding:22px}.modal{width:min(640px,100%);border-radius:34px;background:rgba(255,248,226,.97);box-shadow:var(--shadow);color:#17304c;padding:26px;text-align:center}.modal img{max-width:260px;width:52%;border-radius:26px;margin:-4px auto 8px;display:block;box-shadow:var(--shadow2)}.modal h2{font-size:34px;margin:6px 0 8px}.modal p{font-size:20px;line-height:1.55;margin:8px 0 20px}.modal .btnrow{justify-content:center}
    .result-layout{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;align-items:center;margin-top:22px}.result-img{width:100%;border-radius:30px;box-shadow:var(--shadow)}.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{background:#fff9e8;border-radius:22px;padding:15px;text-align:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}.metric strong{font-size:30px;display:block;color:#236a50}.metric span{font-weight:900;color:#375b7b}.recommend{margin-top:16px;border-radius:26px;padding:18px;background:linear-gradient(180deg,#eaffed,#fff8d6);border:2px solid #c8ecb5}.recommend h3{font-size:26px;margin:0 0 8px;color:#236a50}.recommend p{font-size:20px;margin:0;line-height:1.45}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media (max-width:860px){.app{padding:0}.screen{min-height:100vh;border-radius:0}.content{padding:20px}.home-layout,.detail-layout,.result-layout{grid-template-columns:1fr}.home-hero{min-height:360px}.home-panel h2{font-size:30px}.lead{font-size:19px}.info-grid{grid-template-columns:1fr}.hud{grid-template-columns:1fr;gap:8px;padding:12px}.target-card{min-width:unset;width:100%;order:2}.hud-left,.hud-right{justify-content:space-between}.scene-caption{display:block;text-align:left}.scene-caption .btn{margin-top:12px;width:100%}.btnrow .btn{flex:1 1 auto}.metric-grid{grid-template-columns:1fr}.hero-card{margin-top:20vh}.route-node{width:76px;height:76px}.practice-panel{left:16px;right:16px;bottom:16px;width:auto}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
  <link rel="stylesheet" href="../shared/unified.css">
</head>
<body>
  <div id="app" class="app" aria-live="polite"></div>
<script>
(() => {
  const ASSETS = {
    home:'assets/home-card.png', detail:'assets/detail-cover.png', cover:'assets/cover-poster.png', poster:'assets/poster-main.png',
    scene:'assets/scene-bg.png', low:'assets/low-stim-bg.png',
    t1:'assets/tutorial-1.png', t2:'assets/tutorial-2.png', t3:'assets/tutorial-3.png', t4:'assets/tutorial-4.png', t5:'assets/tutorial-5.png', t6:'assets/tutorial-6.png',
    practice:'assets/practice-bg.png', ready:'assets/ready-panel.png', result:'assets/result-panel.png', performance:'assets/performance-panel.png', challenge:'assets/challenge-panel.png',
    firefly:'assets/firefly-avatar.png', hedgehog:'assets/hedgehog-card.png', success:'assets/success-sticker.png', hint:'assets/hint-sticker.png', icons:'assets/ui-icons.png'
  };
  const $app = document.getElementById('app');
  const NODES = [
    {id:'flower', name:'花朵', icon:'🌸', x:28, y:58},
    {id:'mushroom', name:'蘑菇灯', icon:'🍄', x:45, y:47},
    {id:'star', name:'星星石', icon:'⭐', x:62, y:55},
    {id:'leaf', name:'月亮叶', icon:'🍃', x:36, y:72},
    {id:'dew', name:'露珠石', icon:'💧', x:57, y:73},
    {id:'bridge', name:'小桥叶', icon:'🌙', x:72, y:42},
    {id:'clover', name:'薄荷草', icon:'☘️', x:20, y:43},
    {id:'bell', name:'晚安铃', icon:'🔔', x:78, y:65},
    {id:'seed', name:'星种子', icon:'✨', x:50, y:34}
  ];
  const DIFF = {
    1:{len:2,nodes:4,demo:950,replay:99,dist:0,showFull:true,label:'轻松开始'},
    2:{len:2,nodes:5,demo:900,replay:99,dist:0,showFull:true,label:'轻松开始'},
    3:{len:3,nodes:5,demo:850,replay:3,dist:0,showFull:true,label:'轻松开始'},
    4:{len:3,nodes:6,demo:780,replay:2,dist:0,showFull:true,label:'稳定练习'},
    5:{len:4,nodes:6,demo:720,replay:2,dist:1,showFull:false,label:'稳定练习'},
    6:{len:4,nodes:7,demo:680,replay:1,dist:2,showFull:false,label:'稳定练习'},
    7:{len:5,nodes:8,demo:630,replay:1,dist:2,showFull:false,label:'进阶挑战'},
    8:{len:5,nodes:8,demo:590,replay:1,dist:2,showFull:false,label:'进阶挑战'},
    9:{len:6,nodes:9,demo:550,replay:1,dist:3,showFull:false,label:'进阶挑战'},
    10:{len:7,nodes:9,demo:500,replay:0,dist:3,showFull:false,label:'进阶挑战'}
  };
  let state = 'home';
  let lowStim = localStorage.getItem('fireflyRouteLowStim') === '1';
  let tutorialIndex = 0;
  let toast = '';
  let toastAsset = null;
  let handNode = null;
  let highlight = null;
  let wrongNode = null;
  let hintNode = null;
  let doneNodes = new Set();
  let practiceRoute = ['flower','mushroom'];
  let practiceStep = 0;
  let practiceComplete = false;
  let phase = 'idle';
  let timer = null;
  let demoTimers = [];
  let training = null;
  let paused = false;
  let savedPhase = null;
  const fmt = n => String(n).padStart(2,'0');
  function clearDemoTimers(){ demoTimers.forEach(clearTimeout); demoTimers = []; }
  function setToast(text, asset=null, ms=900){ toast=text; toastAsset=asset; render(); if(ms){ setTimeout(()=>{ if(toast===text){toast='';toastAsset=null;render();}}, ms); } }
  function lastRun(){ try { return JSON.parse(localStorage.getItem('fireflyRouteLastRun') || 'null'); } catch { return null; } }
  function nextLevelFromStorage(){ return Number(localStorage.getItem('fireflyRouteRecommendedLevel') || '1') || 1; }
  function clampLevel(x){ return Math.max(1, Math.min(10, Math.round(x))); }
  function levelText(lv){ const c=DIFF[lv]; return `${c.label}${lv>=7?' · 第 '+lv+' 级':' · 第 '+lv+' 级'}`; }
  function routeText(route){ return route.map(id => { const n=NODES.find(x=>x.id===id); return `${n.icon}${n.name}`; }).join(' → '); }
  function assetAudit(){ Promise.all(Object.entries(ASSETS).map(([k,u])=>fetch(u).then(r=>({asset:k,path:u,ok:r.ok,status:r.status})).catch(e=>({asset:k,path:u,ok:false,status:'读取异常'})))).then(x=>console.table(x)); }
  window.__ASSET_AUDIT__ = assetAudit;
  function img(src, cls='', alt=''){ return `<img class="${cls}" src="${src}" alt="${alt}">`; }
  function topbar(extra=''){
    return `<div class="topbar"><div class="logo">${img(ASSETS.firefly,'','萤火虫')}<span>萤火虫路线</span></div><div class="btnrow">${extra}</div></div>`;
  }
  function render(){
    if(state==='home') return renderHome();
    if(state==='detail') return renderDetail();
    if(state==='cover') return renderCover();
    if(state==='tutorial') return renderTutorial();
    if(state==='practice') return renderPractice();
    if(state==='ready') return renderReady();
    if(state==='training') return renderTraining();
    if(state==='result') return renderResult();
  }
  function renderHome(){
    const last = lastRun();
    const rec = nextLevelFromStorage();
    $app.innerHTML = `<main class="screen"><div class="content">
      ${topbar(`<button class="btn small ghost" data-action="asset-audit">检查图片</button>`)}
      <div class="home-layout">
        <section class="home-hero">${img(ASSETS.poster,'','夜晚花园封面')}<div class="caption"><h2>首页卡片</h2><p class="lead">帮助萤火虫照着路线点亮小路，让睡觉小刺猬安心入睡。</p></div></section>
        <section class="home-panel card">
          <h2>路线序列小游戏</h2>
          <p class="lead">不是测验。你只要先看萤火虫飞一遍，再按同样顺序点击花园里的亮点。</p>
          <div class="info-grid"><div class="info-tile"><span class="emoji">🌙</span>夜晚花园</div><div class="info-tile"><span class="emoji">✨</span>照着路线</div><div class="info-tile"><span class="emoji">🦔</span>轻松开始</div></div>
          <div class="last-box"><b>下轮推荐难度：</b>${levelText(rec)}<br>${last?`上次正确率 ${last.accuracyText}，点亮 ${last.rounds} 条小路。`:'第一次进入将从第 1 级开始。1-3 级非常容易。'}</div>
          <div class="btnrow"><button class="btn primary" data-action="detail">查看说明</button><button class="btn secondary" data-action="cover">进入封面页</button></div>
        </section>
      </div>
    </div></main>`;
    bindCommon();
  }
  function renderDetail(){
    $app.innerHTML = `<main class="screen"><div class="content">
      ${topbar(`<button class="btn small ghost" data-action="home">返回首页</button>`)}
      <div class="detail-layout">
        ${img(ASSETS.detail,'detail-img','游戏说明图')}
        <section class="card home-panel">
          <h2>游戏说明</h2>
          <div class="section-title">怎么玩</div>

  function newStats(level){ return {level,timeLeft:60,score:0,taps:0,correct:0,wrong:0,rounds:0,replays:0,roundStart:Date.now(),started:Date.now(),roundTimes:[],streak:0,route:[],step:0,replayUsedThisRound:0,trials:[],events:[],currentTrial:null}; }

  function makeRoute(len,nodeCount){
    const pool=NODES.slice(0,nodeCount).map(n=>n.id); const r=[];
    for(let i=0;i<len;i++){ let choices=pool.filter(x=>x!==r[r.length-1]); r.push(choices[Math.floor(Math.random()*choices.length)]); }
    if(training && training.level<=2){ return ['flower','mushroom'].slice(0,len); }

  function finishTraining(){

    if(action==='training-replay'){ replayTrainingRoute(); }
    if(action==='pause'){ if(state==='training'){ paused=true; savedPhase=phase; clearDemoTimers(); render(); } }
    if(action==='resume'){ if(state==='training'){ paused=false; if(savedPhase==='demo'){ demoRoute(training.route, currentConfig().demo, ()=>{phase='recall';render();}, false); } render(); } }
    if(action==='restart-round'){ if(state==='training'){ paused=false; demoRoute(training.route, currentConfig().demo, ()=>{phase='recall';render();}, false); } }
    if(action==='finish'){ finishTraining(); }
    if(action==='play-recommended'){ startTraining(nextLevelFromStorage()); }
  }
  // keyboard-friendly: Enter/Space already works for buttons. Start at home.
  render();
})();
</script>
