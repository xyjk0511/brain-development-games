<html lang="zh-CN">
<head>

<style>
:root{
  --cream:#fff7e8;--cream2:#fffdf6;--sky:#bfe8ff;--sky2:#dff5ff;--mint:#bdefd6;--yellow:#ffe28a;--yellow2:#ffd85c;--orange:#ff9b7a;--purple:#c9b8ff;--text:#33445a;--muted:#64758a;--line:rgba(51,68,90,.13);--shadow:0 18px 48px rgba(64,93,128,.18);--soft:0 10px 24px rgba(64,93,128,.14);--focus:#3f8fd2;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--sky2),var(--cream));overflow-x:hidden}button{font-family:inherit;color:inherit}.app{min-height:100vh}.screen{min-height:100vh;position:relative;padding:22px;overflow:hidden}.scene{background-image:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,247,232,.32)),var(--scene);background-size:cover;background-position:center;background-repeat:no-repeat}.panel{border-radius:34px;background:rgba(255,253,246,.88);border:2px solid rgba(255,255,255,.78);box-shadow:var(--shadow);backdrop-filter:blur(8px)}.btn{min-height:58px;border:0;border-radius:999px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:var(--soft);border:2px solid rgba(255,255,255,.8);background:#fff;transition:transform .16s ease,filter .16s ease}.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.99)}.btn.primary{background:linear-gradient(180deg,var(--yellow),var(--yellow2));color:#3e3b24}.btn.secondary{background:linear-gradient(180deg,#ecf9ff,var(--sky))}.btn.mint{background:linear-gradient(180deg,#f1fff8,var(--mint))}.btn.ghost{background:rgba(255,255,255,.72)}.btn.small{min-height:48px;padding:0 16px;font-size:17px}.btn:focus-visible,.tile:focus-visible{outline:4px solid rgba(63,143,210,.45);outline-offset:4px}.icon{width:28px;height:28px;object-fit:contain}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.center{justify-content:center}.cover{display:grid;place-items:center;background-image:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,247,232,.68)),url("assets/cover.png");background-size:cover;background-position:center}.cover-card{width:min(1040px,94vw);display:grid;grid-template-columns:1.05fr .95fr;gap:28px;padding:clamp(24px,4vw,48px);align-items:center}.cover-art{min-height:430px;border-radius:30px;background-image:url("assets/cover.png");background-size:cover;background-position:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.65),var(--soft)}.kicker{display:inline-flex;border-radius:999px;background:rgba(191,232,255,.76);padding:10px 16px;font-weight:900;font-size:18px;margin-bottom:16px}h1{font-size:clamp(44px,8vw,78px);line-height:1.02;margin:0 0 14px;letter-spacing:-2px}h2{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:0 0 12px}h3{font-size:25px;margin:0 0 8px}p{font-size:20px;line-height:1.65;color:var(--muted);margin:0}.lead{font-size:clamp(21px,2.4vw,27px);color:var(--text);margin-bottom:22px}.pills{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}.pill{border-radius:999px;background:rgba(255,255,255,.78);border:1px solid var(--line);padding:10px 14px;font-weight:900;font-size:17px}.switch{border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.76);padding:10px 14px;font-size:16px;font-weight:900;cursor:pointer}.switch.on{background:#eafff5;box-shadow:inset 0 0 0 2px rgba(96,180,130,.22)}.top{width:min(1180px,96vw);margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;position:relative;z-index:3}.chip{border-radius:999px;background:rgba(255,253,246,.9);border:1px solid rgba(255,255,255,.72);box-shadow:var(--soft);padding:12px 16px;font-weight:950;font-size:18px;white-space:nowrap}.target-card{width:min(440px,88vw);min-height:84px;margin:0 auto;border-radius:28px;background:rgba(255,253,246,.9);border:2px solid rgba(255,255,255,.8);box-shadow:var(--soft);position:relative;display:grid;place-items:center;overflow:hidden}.target-card:before{content:"";position:absolute;inset:0;background:url("assets/target_card.png") center/contain no-repeat;opacity:.82}.target-content{position:relative;z-index:1;font-size:22px;font-weight:950;text-align:center}.target-num{font-size:52px;line-height:1;color:#25384e;margin-left:4px}.tutorial-stage{width:min(1180px,96vw);min-height:620px;margin:18px auto 0;display:grid;grid-template-columns:310px 1fr;gap:18px;padding:22px}.guide{display:flex;flex-direction:column;justify-content:flex-end;gap:14px;min-height:530px}.character{width:250px;height:250px;margin:0 auto;display:grid;place-items:center}.character img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 18px rgba(64,93,128,.16))}.speech{border-radius:26px;background:rgba(255,253,246,.94);box-shadow:var(--soft);border:2px solid rgba(255,255,255,.82);padding:20px}.speech strong{display:block;font-size:25px;margin-bottom:6px}.playground{min-height:530px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.54),rgba(255,247,232,.42));box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);position:relative;display:grid;place-items:center;overflow:hidden;padding:22px}.tutorial-demo{position:relative;width:min(560px,92vw);min-height:420px;display:grid;place-items:center}.tutorial-actions{position:absolute;left:22px;right:22px;bottom:22px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;z-index:10}.demo-grid{display:grid;grid-template-columns:repeat(3,minmax(82px,118px));gap:14px;padding-bottom:64px}.hand{position:absolute;width:112px;height:112px;right:26%;bottom:22%;z-index:7;animation:tap 1.15s ease-in-out infinite}.path-note{position:absolute;top:22px;left:22px;right:22px;text-align:center;font-weight:950;font-size:21px;color:#49627d}.stars-demo{position:absolute;top:20px;right:24px;border-radius:999px;background:rgba(255,253,246,.9);padding:10px 16px;font-weight:950;box-shadow:var(--soft)}@keyframes tap{0%,100%{transform:translate(16px,14px) scale(1)}55%{transform:translate(-8px,-10px) scale(.94)}}.game{min-height:100vh;padding:18px;display:grid;grid-template-rows:auto 1fr;gap:16px;background-image:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,247,232,.30)),var(--scene);background-size:cover;background-position:center}.game-area{width:min(1180px,96vw);margin:0 auto;display:grid;place-items:center;min-height:calc(100vh - 150px)}.board-wrap{width:min(760px,94vw);border-radius:36px;background:rgba(255,253,246,.80);box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.8);padding:clamp(16px,3vw,28px)}.message{text-align:center;min-height:36px;font-size:20px;font-weight:950;color:#49627d;margin-bottom:12px}.board{display:grid;grid-template-columns:repeat(var(--grid),minmax(0,1fr));gap:clamp(8px,1.8vw,16px);width:100%;aspect-ratio:1}.tile{appearance:none;border:0;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,247,232,.75));box-shadow:var(--soft);border:2px solid rgba(255,255,255,.72);position:relative;display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:0;transition:transform .12s ease,opacity .15s ease}.tile:hover{transform:translateY(-2px)}.tile.empty{background:rgba(255,255,255,.32);box-shadow:inset 0 0 0 2px rgba(255,255,255,.32);cursor:default}.tile.distractor{opacity:.62}.tile.done{opacity:.46;transform:scale(.96)}.tile.hint{box-shadow:0 0 0 5px rgba(255,216,92,.42),0 0 0 12px rgba(255,216,92,.16),var(--soft);animation:pulse 1.2s ease-in-out infinite}.tile-art{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;pointer-events:none}.num{position:relative;z-index:2;font-size:clamp(38px,8vw,74px);font-weight:950;line-height:1;color:#273c54;text-shadow:0 2px 0 rgba(255,255,255,.82)}body.big .num{font-size:clamp(48px,9.5vw,88px)}body.big .target-num{font-size:62px}.decor{position:relative;z-index:2;font-size:38px;color:rgba(255,155,122,.55)}.sticker{position:absolute;inset:8%;z-index:9;display:grid;place-items:center;pointer-events:none;animation:pop .52s ease-out forwards}.sticker img{width:100%;height:100%;object-fit:contain}.sticker span{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:999px;padding:6px 10px;font-size:15px;font-weight:950;white-space:nowrap}.hintmark{position:absolute;z-index:8;width:48%;height:48%;right:-6%;top:-7%;pointer-events:none}.hintmark img{width:100%;height:100%;object-fit:contain}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}@keyframes pop{0%{opacity:0;transform:scale(.7)}45%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1.18) translateY(-10px)}}.modal-back{position:fixed;inset:0;z-index:40;background:rgba(51,68,90,.24);display:grid;place-items:center;padding:18px}.modal{width:min(690px,94vw);text-align:center;padding:clamp(24px,4vw,38px);position:relative;overflow:hidden}.badge{width:150px;height:150px;margin:0 auto 12px;display:grid;place-items:center}.badge img{width:100%;height:100%;object-fit:contain}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{border-radius:22px;background:rgba(255,255,255,.72);border:1px solid var(--line);padding:14px 10px}.stat strong{display:block;font-size:30px}.stat span{font-size:15px;color:var(--muted);font-weight:900}.recommend{text-align:left;border-radius:24px;background:linear-gradient(180deg,rgba(231,247,255,.92),rgba(255,255,255,.75));border:1px solid rgba(63,143,210,.18);padding:16px;margin:16px 0 22px}.recommend strong{display:block;font-size:21px;margin-bottom:6px}.note{font-size:16px;color:var(--muted);margin-top:12px}body.low .scene,body.low .game{background-image:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,247,232,.42)),url("assets/low_stim_bg.png")!important}body.low .tile.hint,body.low .hand{animation:none!important}body.low .decor,body.low .distractor{display:none}@media(max-width:860px){.screen{padding:14px}.cover-card{grid-template-columns:1fr}.cover-art{min-height:260px;order:-1}.top{grid-template-columns:1fr}.top>.row{justify-content:center}.tutorial-stage{grid-template-columns:1fr;padding:16px}.guide{min-height:auto;display:grid;grid-template-columns:94px 1fr;align-items:center}.character{width:94px;height:94px}.playground{min-height:470px}.demo-grid{grid-template-columns:repeat(3,minmax(74px,96px));gap:10px}.stats{grid-template-columns:1fr}.row.center{justify-content:center}.chip{font-size:16px}.target-card{min-height:76px}.board-wrap{padding:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.adapt-box{margin:16px 0 22px;border-radius:24px;background:rgba(255,255,255,.74);border:1px solid var(--line);padding:16px;box-shadow:var(--soft)}
.adapt-box strong{display:block;font-size:21px;margin-bottom:6px;color:var(--text)}
.adapt-box p{font-size:18px;line-height:1.55}.adapt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 22px}.adapt-cell{border-radius:22px;background:rgba(255,255,255,.74);border:1px solid var(--line);padding:14px;text-align:left}.adapt-cell strong{display:block;font-size:20px;margin-bottom:6px}.adapt-cell span{font-size:18px;color:var(--muted);line-height:1.5}.mini-label{display:inline-flex;border-radius:999px;background:rgba(255,226,138,.56);padding:7px 12px;font-weight:950;margin:8px 0;font-size:16px}@media(max-width:860px){.adapt-grid{grid-template-columns:1fr}}
</style>

</head>
<body>
<div id="app" class="app"></div>
<script>
const A={cover:'assets/cover.png',t1:'assets/tutorial_01.png',t2:'assets/tutorial_02.png',t3:'assets/tutorial_03.png',t4:'assets/tutorial_04.png',t5:'assets/tutorial_05.png',t6:'assets/tutorial_06.png',scene:'assets/scene_bg.png',low:'assets/low_stim_bg.png',character:'assets/character.png',hand:'assets/hand.png',cloud:'assets/cloud_tile.png',star:'assets/star_tile.png',foot:'assets/footprint_tile.png',distractor:'assets/distractor.png',card:'assets/target_card.png',success:'assets/success_sticker.png',hint:'assets/hint_sticker.png',badge:'assets/result_badge.png',pause:'assets/icon_pause.png',play:'assets/icon_play.png',hintIcon:'assets/icon_hint.png'};
const app=document.getElementById('app');
const saved=readSaved();
const S={screen:'cover',tutorial:1,low:!!saved.low,big:!!saved.big,quiet:!!saved.quiet,mode:'',level:parseInt(localStorage.getItem('ss_level')||'1',10)||1,smooth:parseInt(localStorage.getItem('ss_smooth')||'0',10)||0,cfg:null,board:[],seq:[],idx:0,score:0,miss:0,hints:0,hint:false,msg:'',feedback:null,start:0,last:0,intervals:[],timeLeft:null,timer:null,paused:false,pauseAt:0,totalPause:0,result:null,rec:null,lastPerf:readLastPerf()};
const levels=[
{id:1,name:'轻松找星星',grid:3,seq:nums(1,4),time:null,distr:0,hintMs:4000,tile:'star',adv:false},
{id:2,name:'云朵小练习',grid:3,seq:nums(1,6),time:null,distr:0,hintMs:5000,tile:'cloud',adv:false},
{id:3,name:'点亮九宫格',grid:3,seq:nums(1,9),time:null,distr:0,hintMs:6000,tile:'cloud',adv:false},
{id:4,name:'星星广场巡游',grid:4,seq:nums(1,10),time:90,distr:2,hintMs:7000,tile:'cloud',adv:false},
{id:5,name:'云朵牌全开',grid:4,seq:nums(1,16),time:90,distr:0,hintMs:7000,tile:'cloud',adv:false},
{id:6,name:'倒着点亮',grid:4,seq:nums(1,10).reverse(),time:100,distr:2,hintMs:8000,tile:'cloud',adv:true},
{id:7,name:'大广场',grid:5,seq:nums(1,20),time:120,distr:3,hintMs:8000,tile:'cloud',adv:true},
{id:8,name:'脚印路线',grid:5,seq:nums(1,16),time:110,distr:4,hintMs:8000,tile:'foot',adv:true},
{id:9,name:'倒序云朵',grid:5,seq:nums(1,20).reverse(),time:130,distr:4,hintMs:9000,tile:'cloud',adv:true},
{id:10,name:'星空大巡逻',grid:6,seq:nums(1,30),time:150,distr:6,hintMs:10000,tile:'cloud',adv:true}
];
const practice={id:0,name:'低压练习：星星 1 到 4',grid:3,seq:nums(1,4),time:null,distr:0,hintMs:4000,tile:'star',adv:false};
function nums(a,b){return Array.from({length:b-a+1},(_,i)=>a+i)}
function readSaved(){try{return JSON.parse(localStorage.getItem('ss_settings')||'{}')}catch{return {}}}
function save(){localStorage.setItem('ss_settings',JSON.stringify({low:S.low,big:S.big,quiet:S.quiet}))}
function readLastPerf(){try{return JSON.parse(localStorage.getItem('ss_last_performance')||'null')}catch{return null}}
function saveLastPerf(data){localStorage.setItem('ss_last_performance',JSON.stringify(data));S.lastPerf=data}
function levelById(id){return levels.find(x=>x.id===id)||levels[0]}
function levelSummary(id){const l=levelById(id);return `第 ${l.id} 级｜${l.grid}×${l.grid}｜${l.seq.length} 个数字${l.time==null?'｜不限时':'｜'+l.time+' 秒'}`}
function lastPerfText(){const p=S.lastPerf;if(!p)return '还没有最近一局记录，首次正式训练从第 1 级开始。';return `最近一局：第 ${p.level} 级，${p.completed?'完成':'到这里'}，点亮 ${p.score}/${p.total}，点错 ${p.miss} 次，用时 ${p.elapsed} 秒。保存推荐：${levelSummary(p.nextLevel)}。`}
function img(src,cls,alt){return `<img src="${src}" class="${cls||''}" alt="${alt||''}" onerror="this.style.display='none'">`}
function render(){document.body.classList.toggle('low',S.low);document.body.classList.toggle('big',S.big);if(S.screen==='cover')app.innerHTML=cover();if(S.screen==='tutorial')app.innerHTML=tutorial();if(S.screen==='play')app.innerHTML=play();if(S.screen==='ready')app.innerHTML=ready();if(S.screen==='result')app.innerHTML=result();}
function cover(){stopTimer();const recommended=levelSummary(S.level);return `<main class="screen cover"><section class="panel cover-card"><div><div class="kicker">⭐ 星星广场今日开放</div><h1>星星数字广场</h1><p class="lead">跟着星星向导，从 1 开始按顺序点亮云朵数字牌。难度会自动调节，越顺就增加数字或升到 4×4，太吃力就回到更少数字和更大的牌面。</p><div class="pills"><span class="pill">目标一直可见</span><span class="pill">新手不限时</span><span class="pill">小猫脚印提示</span><span class="pill">难度会自动调节</span></div><div class="adapt-box"><strong>自适应难度已开启</strong><p>完成快且点错少：下轮增加数字或从 3×3 升到 4×4。点错多或超时：下轮回到更少数字、牌面更大的轻松路线。</p><p class="note">当前推荐：${recommended}<br>${lastPerfText()}</p></div><div class="row"><button class="btn primary" onclick="startTutorial()">开始教学</button><button class="btn secondary" onclick="startPractice()">直接低压练习</button><button class="btn mint" onclick="startTraining(S.level)">按推荐训练</button></div><div class="row" style="margin-top:22px"><button class="switch ${S.low?'on':''}" onclick="toggle('low')">低刺激：${S.low?'开':'关'}</button><button class="switch ${S.big?'on':''}" onclick="toggle('big')">大数字：${S.big?'开':'关'}</button><button class="switch ${S.quiet?'on':''}" onclick="toggle('quiet')">安静模式：${S.quiet?'开':'关'}</button></div></div><div class="cover-art" aria-hidden="true"></div></section></main>`}
function startTutorial(){stopTimer();S.screen='tutorial';S.tutorial=1;render()}
function tutorialAsset(){return [A.t1,A.t2,A.t3,A.t4,A.t5,A.t6][S.tutorial-1]}
function tutorialText(){return [
['欢迎来到星星广场','今天先看一遍真实场景里的玩法。我们会从 1 开始，按顺序点亮目标。','先看演示'],
['第一个目标出现啦','云朵数字牌会出现在广场中央。上方目标卡会一直显示当前要找的目标。','请找：1'],
['手势点击目标','小手会落到数字 1 上。每发现一个目标，就点击一次。','请找：1'],
['星星数量加一','点亮数字 1 后，右上角星星数量会加一，然后目标变成下一张。','下一张：2'],
['小猫脚印来提示','找不到时，小猫脚印会轻轻靠近当前目标。提示只帮你看方向，不会打断训练。','请找：3'],
['准备低压练习','你已经看完演示。接下来先做一轮 3×3 的低压练习，没有时间压力。','准备练习']
][S.tutorial-1]}
function tutorial(){const t=tutorialText();return `<main class="screen scene" style="--scene:url('${tutorialAsset()}')"><header class="top"><div class="row"><span class="chip">教学 ${S.tutorial} / 6</span></div>${targetCard(t[2])}<div class="row"><span class="chip">⭐ 演示星星 ${S.tutorial>=4?1:0}</span></div></header><section class="panel tutorial-stage"><aside class="guide"><div class="character">${img(A.character,'','星星向导')}</div><div class="speech"><strong>${t[0]}</strong><p>${t[1]}</p></div></aside><div class="playground"><div class="path-note">开始教学 → 下一步 × 5 → 低压练习 → 准备开始 → 进入训练</div><div class="tutorial-demo">${tutorialDemo()}</div><div class="tutorial-actions">${S.tutorial<6?`<button class="btn primary" onclick="nextTutorial()">下一步</button>`:`<button class="btn primary" onclick="startPractice()">低压练习</button>`}</div></div></section></main>`}
function nextTutorial(){if(S.tutorial<6){S.tutorial++;render()}}
function tutorialDemo(){if(S.tutorial===1)return `<div class="character" style="width:300px;height:300px">${img(A.character,'','星星向导')}</div>`;if(S.tutorial===2)return `<div style="width:250px;height:250px;position:relative">${demoTile(1,'cloud',false,false)}</div>`;if(S.tutorial===3)return `<div style="width:250px;height:250px;position:relative">${demoTile(1,'cloud',false,false)}${img(A.hand,'hand','点击手势')}</div>`;if(S.tutorial===4)return `<div style="width:250px;height:250px;position:relative">${demoTile(1,'cloud',true,false)}${success()}<div class="stars-demo">⭐ 1 / 4</div></div>`;if(S.tutorial===5)return `<div class="demo-grid">${demoTile(1,'cloud',true,false)}${emptyTile()}${demoTile(3,'cloud',false,true)}${emptyTile()}${demoTile(2,'cloud',true,false)}${emptyTile()}${emptyTile()}${emptyTile()}${emptyTile()}</div>`;return `<div class="demo-grid">${demoTile(1,'star',false,false)}${demoTile(2,'star',false,false)}${demoTile(3,'star',false,false)}${emptyTile()}${demoTile(4,'star',false,false)}${emptyTile()}${emptyTile()}${emptyTile()}${emptyTile()}</div>`}
function demoTile(n,tile,done,hint){const art=tile==='star'?A.star:A.cloud;return `<button class="tile ${done?'done':''} ${hint?'hint':''}" tabindex="-1">${img(art,'tile-art','')}<span class="num">${n}</span>${hint?hintMark():''}</button>`}
function emptyTile(){return `<button class="tile empty" tabindex="-1" aria-hidden="true"></button>`}
function success(){return `<div class="sticker">${img(A.success,'','')}<span>找到啦</span></div>`}
function hintMark(){return `<div class="hintmark">${img(A.hint,'','')}</div>`}
function startPractice(){startRound(practice,'practice')}
function startTraining(id){const cfg=levels.find(x=>x.id===id)||levels[0];startRound(cfg,'training')}
function startRound(cfg,mode){stopTimer();S.screen='play';S.mode=mode;S.cfg=JSON.parse(JSON.stringify(cfg));S.seq=[...cfg.seq];S.board=makeBoard(cfg);S.idx=0;S.score=0;S.miss=0;S.hints=0;S.hint=false;S.msg=mode==='practice'?'低压练习：从 1 开始点亮 4 张星星牌。没有时间压力。':'从目标卡开始，按顺序点亮。';S.feedback=null;S.start=Date.now();S.last=Date.now();S.intervals=[];S.timeLeft=cfg.time;S.paused=false;S.pauseAt=0;S.totalPause=0;S.result=null;S.rec=null;tickStart();render()}
function makeBoard(cfg){const total=cfg.grid*cfg.grid;const cells=Array.from({length:total},(_,i)=>({id:'c'+i,kind:'empty',v:null,done:false}));const idx=shuffle(Array.from({length:total},(_,i)=>i));cfg.seq.forEach((v,i)=>{cells[idx[i]]={id:'c'+idx[i],kind:'target',v:v,done:false}});for(let i=0;i<cfg.distr;i++){const p=idx[cfg.seq.length+i];if(p!==undefined)cells[p]={id:'c'+p,kind:'distractor',v:null,done:false}}return cells}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function current(){return S.seq[S.idx]??null}
function play(){const cfg=S.cfg;const bg=S.low?A.low:A.scene;const label=S.mode==='practice'?'低压练习':`第 ${cfg.id} 级 ${cfg.adv?'进阶挑战：':''}${cfg.name}`;return `<main class="game" style="--scene:url('${bg}')"><header class="top"><div class="row"><button class="btn small ghost" onclick="pauseGame()">${img(A.pause,'icon','')}暂停</button><span class="chip">${label}</span></div>${targetCard(current()==null?'本轮完成':'请找：'+current())}<div class="row"><span class="chip">${cfg.time==null?'不限时':'剩余 '+S.timeLeft+' 秒'}</span><span class="chip">⭐ ${S.score} / ${S.seq.length}</span></div></header><section class="game-area"><div class="board-wrap"><div class="message">${S.msg||' '}</div>${boardHtml()}</div></section>${S.paused?pauseModal():''}</main>`}
function boardHtml(){return `<div class="board" role="grid" aria-label="星星数字广场方格" style="--grid:${S.cfg.grid}">${S.board.map((c,i)=>cellHtml(c,i)).join('')}</div>`}
function cellHtml(c,i){const isHint=S.hint&&c.kind==='target'&&c.v===current()&&!c.done;const fb=S.feedback===c.id;let content='';if(c.kind==='target'){const art=S.cfg.tile==='star'?A.star:S.cfg.tile==='foot'?A.foot:A.cloud;content=`${img(art,'tile-art','')}<span class="num">${c.v}</span>`}else if(c.kind==='distractor'){content=`${img(A.distractor,'tile-art','')}<span class="decor">✦</span>`}return `<button class="tile ${c.kind} ${c.done?'done':''} ${isHint?'hint':''}" role="gridcell" data-i="${i}" onclick="clickCell('${c.id}')" aria-label="${c.kind==='target'?'数字 '+c.v:'装饰格'}">${content}${isHint?hintMark():''}${fb?success():''}</button>`}
function clickCell(id){if(S.paused)return;const c=S.board.find(x=>x.id===id);if(!c||c.done)return;const t=current();if(c.kind==='target'&&c.v===t){c.done=true;S.score++;S.idx++;const now=Date.now();S.intervals.push(now-S.last);S.last=now;S.hint=false;S.feedback=id;S.msg=S.idx>=S.seq.length?'本轮路线已经点亮。':'很好，下一张：'+current();render();setTimeout(()=>{S.feedback=null;if(S.idx>=S.seq.length)finish(false);else render()},520)}else{S.miss++;S.hint=true;S.hints++;S.msg='现在先找：'+t;render()}}
function tickStart(){stopTimer();S.timer=setInterval(()=>{if(S.screen!=='play'||S.paused||!S.cfg)return;const now=Date.now();let changed=false;if(S.cfg.time!=null){const left=Math.max(0,Math.ceil((S.cfg.time*1000-(now-S.start-S.totalPause))/1000));if(left!==S.timeLeft){S.timeLeft=left;changed=true}if(left<=0){finish(true);return}}if(!S.hint&&current()!=null&&now-S.last>=S.cfg.hintMs){S.hint=true;S.hints++;S.msg='小猫脚印来帮你啦，请找：'+current();changed=true}if(changed)render()},250)}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function pauseGame(){S.paused=true;S.pauseAt=Date.now();render()}
function resumeGame(){S.paused=false;const p=Date.now()-S.pauseAt;S.totalPause+=p;S.last+=p;render()}
function pauseModal(){return `<div class="modal-back"><section class="panel modal"><h2>休息一下</h2><p>星星广场会等你回来。当前目标仍然在上方。</p><div class="row center" style="margin-top:24px"><button class="btn primary" onclick="resumeGame()">${img(A.play,'icon','')}继续训练</button><button class="btn secondary" onclick="startTutorial()">重新演示</button></div></section></div>`}
function finish(timedOut){stopTimer();const elapsed=Math.round((Date.now()-S.start-S.totalPause)/1000);S.result={completed:S.idx>=S.seq.length,timedOut,elapsed,total:S.seq.length,score:S.score,miss:S.miss,hints:S.hints,level:S.cfg.id||0,intervals:[...S.intervals]};if(S.mode==='practice'){S.screen='ready';render();return}S.rec=recommend(S.result);S.screen='result';render()}
function ready(){const rec=levelSummary(S.level);return `<main class="screen scene" style="--scene:url('${A.t6}')"><div class="modal-back"><section class="panel modal"><h2>准备开始训练吧！</h2><p>低压练习已经完成。正式训练中，目标卡会一直显示当前要找哪一个，难度会自动调节。</p><div class="adapt-box"><strong>下轮推荐难度</strong><p>${rec}</p><p class="note">完成快且点错少会增加数字或升到 4×4；点错多或超时会回到更少数字、牌面更大的路线。</p></div><div class="stats"><div class="stat"><strong>${S.result?S.result.score:4}</strong><span>点亮数量</span></div><div class="stat"><strong>${S.result?S.result.elapsed:0}</strong><span>用时秒数</span></div><div class="stat"><strong>${S.result?S.result.hints:0}</strong><span>脚印提示</span></div></div><div class="row center"><button class="btn secondary" onclick="startTutorial()">重新演示</button><button class="btn primary" onclick="startTraining(S.level)">进入训练</button></div><p class="note">前 3 级都可以慢慢找。最近一局表现会保存在本机，用来推荐下一轮。</p></section></div></main>`}
function recommend(r){const lvl=S.cfg.id;const wrong=r.miss/Math.max(r.score+r.miss,1);const hintRate=r.hints/Math.max(r.total,1);const avg=r.intervals.length?Math.round(r.intervals.reduce((a,b)=>a+b,0)/r.intervals.length):0;const fastLimit=S.cfg.time==null?Math.max(16,r.total*3.2):Math.round(S.cfg.time*.55);const fastClean=r.completed&&!r.timedOut&&r.miss<=1&&hintRate<=.25&&r.elapsed<=fastLimit;const tooHard=r.timedOut||r.miss>=3||wrong>=.34||hintRate>=.60;const steady=r.completed&&!tooHard;let next=lvl;let rule='保持当前节奏';let title='';let text='';let performance='';if(fastClean){S.smooth++;next=Math.min(lvl+1,10);rule=next>=4&&lvl<=3?'升到 4×4 或增加数字':'增加数字或进入下一关';performance='完成快，点错少';title=`自适应推荐：试试第 ${next} 级`;text=`本轮完成很顺，下轮会${rule}。`;}else if(tooHard){S.smooth=0;next=Math.max(lvl-1,1);rule='回到更少数字、牌面更大的路线';performance=r.timedOut?'本轮时间到，改用轻松路线':'本轮需要更多提示或点错较多';title=`自适应推荐：回到第 ${next} 级`;text='下轮会减少数字数量，并使用更轻松的大牌面节奏。';}else if(steady){S.smooth=0;next=lvl;rule='保持当前难度';performance='本轮完成稳定';title=`自适应推荐：继续第 ${lvl} 级`;text='当前节奏合适，下轮保持同一难度。';}else{S.smooth=0;next=Math.max(lvl-1,1);rule='减少数字，放大牌面节奏';performance='本轮先到这里';title=`自适应推荐：回到第 ${next} 级热身`;text='下轮先回到更熟悉的路线。';}
if(S.low){next=Math.min(next,3);title=`自适应推荐：低刺激模式第 ${next} 级`;text='低刺激模式会限制在前 3 级，保持安静、轻松和大牌面。';rule='低刺激保持轻松路线';}
localStorage.setItem('ss_smooth',String(S.smooth));localStorage.setItem('ss_level',String(next));S.level=next;const saved={time:new Date().toISOString(),level:lvl,nextLevel:next,completed:r.completed,timedOut:r.timedOut,elapsed:r.elapsed,total:r.total,score:r.score,miss:r.miss,hints:r.hints,wrongRate:wrong,hintRate,avgClickMs:avg,rule,performance};saveLastPerf(saved);return{level:next,title,text,rule,performance,avgClickMs:avg,wrongRate:wrong,hintRate,fromLevel:lvl,nextSummary:levelSummary(next),currentSummary:levelSummary(lvl)}}
function median(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);const m=Math.floor(b.length/2);return b.length%2?b[m]:Math.round((b[m-1]+b[m])/2)}
function result(){const r=S.result,rec=S.rec;const status=r.completed?'完成':'到这里';return `<main class="screen scene" style="--scene:url('${S.low?A.low:A.scene}')"><section class="panel modal" style="margin:clamp(30px,8vh,70px) auto;width:min(820px,94vw)"><div class="badge">${img(A.badge,'','')}</div><h2>${r.completed?'本轮完成':'本轮到这里'}</h2><p>你点亮了 ${r.score} / ${r.total} 张牌。系统已保存最近一局表现，并自动推荐下轮难度。</p><div class="adapt-grid"><div class="adapt-cell"><strong>本轮表现</strong><span>${rec.currentSummary}<br>结果：${status}<br>点错：${r.miss} 次｜提示：${r.hints} 次｜用时：${r.elapsed} 秒<br>判断：${rec.performance}</span></div><div class="adapt-cell"><strong>下轮推荐难度</strong><span>${rec.nextSummary}<br>调节规则：${rec.rule}<br>${rec.text}</span></div></div><div class="stats"><div class="stat"><strong>${r.score}</strong><span>点亮数量</span></div><div class="stat"><strong>${r.elapsed}</strong><span>用时秒数</span></div><div class="stat"><strong>${r.miss}</strong><span>点错次数</span></div></div><div class="recommend"><strong>${rec.title}</strong><p>${rec.text}</p><span class="mini-label">难度会自动调节</span><p class="note">完成快且点错少：增加数字或升到 4×4。点错多或超时：回到更少数字、牌面更大的路线。</p></div><div class="row center"><button class="btn primary" onclick="startTraining(${rec.level})">按推荐继续</button><button class="btn secondary" onclick="startTraining(${S.cfg.id})">重来本级</button><button class="btn ghost" onclick="startTutorial()">重新演示</button></div></section></main>`}
function targetCard(text){const m=String(text).match(/^(.*?)(\d+)$/);return `<div class="target-card" aria-live="polite" aria-label="当前目标"><div class="target-content">${m?m[1]+'<span class="target-num">'+m[2]+'</span>':text}</div></div>`}
function toggle(k){S[k]=!S[k];save();render()}
document.addEventListener('keydown',e=>{if(S.screen!=='play'||S.paused)return;const tiles=[...document.querySelectorAll('.board .tile')];const i=tiles.indexOf(document.activeElement);if(i<0)return;const g=S.cfg.grid;let n=i;if(e.key==='ArrowRight')n=Math.min(i+1,tiles.length-1);if(e.key==='ArrowLeft')n=Math.max(i-1,0);if(e.key==='ArrowDown')n=Math.min(i+g,tiles.length-1);if(e.key==='ArrowUp')n=Math.max(i-g,0);if(n!==i){e.preventDefault();tiles[n].focus()}});
render();
</script>
