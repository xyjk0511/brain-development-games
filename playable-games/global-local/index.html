<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云朵大小字｜Global Local</title>
  <link rel="stylesheet" href="../shared/unified.css" />
</head>
<body>
  <div id="app"></div>
  <script src="../shared/unified.js"></script>
  <script src="../shared/domain-gap-game.js"></script>
  <script>
    CognitiveDomainGame.mount({
      gameId: 'global-local',
      title: '云朵大小字',
      subtitle: '按提示看“大图形”或“小图形”，不要被另一个层级带跑。',
      domain: 'perception',
      domainLabel: '感知觉',
      taskFamily: 'global-local',
      primaryParadigm: 'Navon Global-Local Task',
      basis: '参考 Navon 1977 全局-局部加工范式、PsyToolkit Navon 任务和 jsPsych 视觉刺激/按键反应结构。',
      instructions: '每题会出现由小字组成的大字。题目说“看大字”就回答整体形状，题目说“看小字”就回答里面的小字。',
      mascot: '☁️',
      tone1: '#bdefff',
      tone2: '#ffe3a3',
      accent: '#2f80c9',
      accent2: '#ffb45c',
      rounds: 10,
      trials: [
        { kind: 'globalLocal', prompt: '看大字：整体是什么？', big: '日', small: '月', correct: '日', options: ['日','月','田'], condition: { levelCue: 'global', congruent: false } },
        { kind: 'globalLocal', prompt: '看小字：里面重复的小字是什么？', big: '火', small: '水', correct: '水', options: ['火','水','木'], condition: { levelCue: 'local', congruent: false } },
        { kind: 'globalLocal', prompt: '看大字：整体是什么？', big: '木', small: '木', correct: '木', options: ['木','林','火'], condition: { levelCue: 'global', congruent: true } },
        { kind: 'globalLocal', prompt: '看小字：里面重复的小字是什么？', big: '田', small: '口', correct: '口', options: ['田','口','日'], condition: { levelCue: 'local', congruent: false } },
        { kind: 'globalLocal', prompt: '看大字：整体是什么？', big: '山', small: '川', correct: '山', options: ['山','川','水'], condition: { levelCue: 'global', congruent: false } },
        { kind: 'globalLocal', prompt: '看小字：里面重复的小字是什么？', big: '雨', small: '云', correct: '云', options: ['雨','云','雪'], condition: { levelCue: 'local', congruent: false } },
        { kind: 'globalLocal', prompt: '看大字：整体是什么？', big: '口', small: '日', correct: '口', options: ['口','日','田'], condition: { levelCue: 'global', congruent: false } },
        { kind: 'globalLocal', prompt: '看小字：里面重复的小字是什么？', big: '星', small: '星', correct: '星', options: ['星','月','日'], condition: { levelCue: 'local', congruent: true } },
        { kind: 'globalLocal', prompt: '看大字：整体是什么？', big: '月', small: '日', correct: '月', options: ['月','日','口'], condition: { levelCue: 'global', congruent: false } },
        { kind: 'globalLocal', prompt: '看小字：里面重复的小字是什么？', big: '花', small: '草', correct: '草', options: ['花','草','木'], condition: { levelCue: 'local', congruent: false } }
      ]
    });
  </script>
</body>
</html>
