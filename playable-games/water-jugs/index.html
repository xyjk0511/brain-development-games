<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff7df,#e7f9ff 60%,#f7fff1)}
button{font:inherit;border:0;cursor:pointer}.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.screen{width:min(1180px,100%);min-height:720px;border:4px solid #fff;border-radius:34px;background:linear-gradient(160deg,#fffdf5,#e8fbff);box-shadow:var(--shadow);overflow:hidden;position:relative}.screen::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 5%,rgba(255,216,118,.35),transparent 28%),radial-gradient(circle at 90% 15%,rgba(191,232,199,.45),transparent 30%)}
.content{position:relative;z-index:1;padding:24px}.row{display:flex;gap:22px;align-items:center}.col{display:flex;flex-direction:column;gap:16px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.logoDot{width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,var(--yellow),var(--orange));display:grid;place-items:center;box-shadow:var(--shadow2);font-size:26px}.title{font-size:44px;line-height:1.05;font-weight:900;color:#995b20;text-shadow:0 3px #fff}.subtitle{font-size:22px;color:#4e7b5a;font-weight:800}.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;border:2px solid #f1d7a4;color:#8b5d22;font-weight:800}.btn{border-radius:22px;padding:15px 22px;min-height:56px;background:#fff;border:3px solid #e3ad58;color:#724314;font-weight:900;box-shadow:0 6px 0 #c98736, var(--shadow2);transition:transform .08s,box-shadow .08s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c98736}.btn.primary{background:linear-gradient(#82d678,#3cad5b);color:white;border-color:#2f9a4d;box-shadow:0 6px 0 #26793d, var(--shadow2)}.btn.blue{background:linear-gradient(#71d7f6,#39a8cf);color:white;border-color:#2c96b8;box-shadow:0 6px 0 #237b99, var(--shadow2)}.btn.ghost{background:#fffdf3;color:#567;box-shadow:none;border-color:#d6e6ea}.btn.warn{background:linear-gradient(#ffd876,#ffae58)}.btn.small{padding:10px 14px;min-height:44px;border-radius:16px;font-size:16px}.btn:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.15)}
.card{background:var(--card);border:3px solid #fff4cd;border-radius:28px;padding:22px;box-shadow:var(--shadow2)}.art{width:100%;border-radius:24px;border:3px solid #fff;box-shadow:var(--shadow2);object-fit:cover}.homeGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.homeCard{padding:0;overflow:hidden}.homeCard img{display:block;width:100%;height:405px;object-fit:cover}.homeInfo{padding:22px}.bigStat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fffaf0;border:2px solid #f0d8a5;border-radius:20px;padding:14px;text-align:center;font-weight:900}.stat span{display:block;font-size:28px;color:#4c9a61}.infoGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.infoCard h3{font-size:26px;margin:6px 0 10px}.infoCard p,.card p{font-size:19px;line-height:1.7;margin:8px 0}.coverHero{display:grid;grid-template-columns:1.08fr .92fr;gap:24px;align-items:center}.coverHero .art{height:430px}.mascot{max-height:390px;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(87,65,22,.2))}.speech{background:white;border:3px solid #f0c87d;border-radius:28px;padding:18px 22px;position:relative;font-size:21px;line-height:1.65;font-weight:800}.speech::after{content:"";position:absolute;left:28px;bottom:-16px;border:10px solid transparent;border-top-color:#f0c87d}.note{color:#5f6f72;font-size:17px;line-height:1.6}.targetBox{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#fff7dc,#ffffff);border:3px solid #f0c87d;border-radius:24px;padding:13px 18px;box-shadow:var(--shadow2);font-weight:900;font-size:22px}.targetIcon{width:42px;height:42px;border-radius:15px;background:linear-gradient(#ffd876,#ff9b56);display:grid;place-items:center}.tutorialLayout{display:grid;grid-template-columns:1fr 360px;gap:20px}.sceneWrap{position:relative;background:#fff;border-radius:30px;padding:12px;border:3px solid #fff0c7;box-shadow:var(--shadow2);overflow:hidden}.sceneWrap img.scene{width:100%;height:500px;object-fit:cover;border-radius:22px;display:block}.overlayTarget{position:absolute;top:22px;left:22px;right:22px}.hand{position:absolute;width:76px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));animation:floatHand 1.2s ease-in-out infinite}.demoCupRow{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:18px;align-items:end}.demoFeedback{position:absolute;right:28px;bottom:28px;background:#fff8d8;border:3px solid #eeb85f;border-radius:22px;padding:12px 16px;font-weight:900;color:#ab641f;box-shadow:var(--shadow2);animation:pop .35s}.sidePanel{display:flex;flex-direction:column;gap:14px}.stepBadge{align-self:flex-start;background:#82c65d;color:white;border-radius:999px;padding:8px 16px;font-size:22px;font-weight:900}.stepTitle{font-size:30px;font-weight:900;color:#845522}.stepText{font-size:21px;line-height:1.7}.progressDots{display:flex;gap:8px}.dot{width:13px;height:13px;border-radius:50%;background:#d9e6e9}.dot.on{background:#69ba72}.gameShell{min-height:720px;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,250,235,.9)),url("assets/training-scene.png") center/cover no-repeat}.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.hudGroup{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hudItem{background:#fff9e8;border:3px solid #f0c87d;border-radius:18px;padding:9px 13px;font-weight:900;box-shadow:var(--shadow2)}.stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}.workbench{background:rgba(255,255,255,.88);border:3px solid #fff2c4;border-radius:30px;padding:18px;box-shadow:var(--shadow2);min-height:455px}.jugs{display:flex;justify-content:center;gap:26px;align-items:flex-end;min-height:315px;padding:20px 6px}.jugBox{display:flex;flex-direction:column;align-items:center;gap:10px}.jug{position:relative;width:110px;height:230px;border:5px solid #9ac6d4;border-top-width:3px;border-radius:22px 22px 32px 32px;background:rgba(255,255,255,.82);overflow:hidden;box-shadow:inset 0 0 0 5px rgba(255,255,255,.45), 0 10px 20px rgba(49,85,97,.12);transition:transform .15s, box-shadow .15s}.jug.selected{transform:translateY(-8px);box-shadow:0 0 0 6px rgba(105,186,114,.45), inset 0 0 0 5px rgba(255,255,255,.45), 0 10px 20px rgba(49,85,97,.12)}.jug.pending{box-shadow:0 0 0 7px rgba(255,155,86,.5), inset 0 0 0 5px rgba(255,255,255,.45), 0 10px 20px rgba(49,85,97,.12)}.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#ffc56a,#ff963f);transition:height .38s ease;border-top:5px solid rgba(255,255,255,.65)}.scaleLine{position:absolute;left:12px;right:12px;height:1px;background:rgba(41,86,101,.65)}.scaleText{position:absolute;right:12px;transform:translateY(50%);font-size:13px;font-weight:900;color:#375460;background:rgba(255,255,255,.65);border-radius:8px;padding:0 4px}.jugLabel{font-weight:900;font-size:20px}.jugAmount{font-weight:900;background:#fff7de;border:2px solid #ecc371;border-radius:999px;padding:5px 10px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}.actions .btn{font-size:20px;padding:13px 10px}.orderPanel{background:rgba(255,255,255,.92);border:3px solid #ddf0d8;border-radius:30px;padding:18px;box-shadow:var(--shadow2);display:flex;flex-direction:column;gap:12px}.feedback{min-height:54px;border-radius:20px;padding:12px 14px;background:#f4fff2;border:2px solid #cceabc;font-weight:900;font-size:18px}.feedback.success{background:#fff6d9;border-color:#f2bc62;color:#9b5d17}.feedback.hint{background:#effaff;border-color:#a9dcec;color:#346b7b}.miniList{margin:0;padding-left:22px;font-size:17px;line-height:1.8}.readyModal{display:grid;grid-template-columns:460px 1fr;gap:24px;align-items:center}.readyModal .art{height:430px}.modalBox{background:#fffffff2;border:4px solid #d8ecb2;border-radius:34px;padding:28px;box-shadow:var(--shadow)}.resultGrid{display:grid;grid-template-columns:450px 1fr;gap:24px}.resultGrid .art{height:465px}.metricGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{background:#fffaf0;border:2px solid #efd6a3;border-radius:22px;padding:15px}.metric b{display:block;font-size:25px;color:#5c9a47}.overlay{position:absolute;inset:0;background:rgba(255,248,228,.82);backdrop-filter:blur(4px);z-index:5;display:grid;place-items:center}.pauseBox{background:white;border:4px solid #f0c87d;border-radius:32px;padding:30px;box-shadow:var(--shadow);text-align:center;max-width:480px}.footerActions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.lowStim .screen,.lowStim .gameShell{background:#fffdf5}.lowStim .screen::before{display:none}.lowStim .hand,.lowStim .demoFeedback{animation:none}@keyframes floatHand{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:scale(1);opacity:1}}@media(max-width:900px){.screen{min-height:auto}.homeGrid,.coverHero,.tutorialLayout,.stage,.readyModal,.resultGrid,.infoGrid{grid-template-columns:1fr}.homeCard img,.coverHero .art,.sceneWrap img.scene,.readyModal .art,.resultGrid .art{height:auto}.title{font-size:34px}.jugs{gap:12px;overflow:auto}.jug{width:92px;height:205px}.content{padding:16px}.actions{grid-template-columns:1fr 1fr}.hud{align-items:flex-start}.stage{gap:12px}.orderPanel{order:-1}.targetBox{font-size:18px}.stepTitle{font-size:25px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const ASSETS={
 home:'assets/home-card.png',cover:'assets/cover.png',tutorial1:'assets/tutorial-1.png',tutorial2:'assets/tutorial-2.png',tutorial3:'assets/tutorial-3.png',tutorial4:'assets/tutorial-4.png',tutorial5:'assets/tutorial-5.png',tutorial6:'assets/tutorial-6.png',practice:'assets/practice-scene.png',ready:'assets/ready-card.png',training:'assets/training-scene.png',result:'assets/result-card.png',howto:'assets/howto-card.png',target:'assets/target-card.png',difficulty:'assets/difficulty-card.png',adaptive:'assets/adaptive-card.png',bear:'assets/bear-mascot.png',cup:'assets/juice-cup-art.png',hand:'assets/hand-pointer.png'};
const STORAGE_KEY='bearJuiceJugsProgressV1';
const app=document.getElementById('app');
let timer=null;
const state={phase:'home',lowStim:false,tutorialIndex:0,tutorialDemo:0,practiceIndex:0,selectedJug:null,pendingPour:null,puzzle:null,level:1,timeLeft:0,initialTime:0,ordersGoal:0,completed:0,totalMoves:0,currentMoves:0,hintsUsed:0,feedback:null,paused:false,roundStart:0,lastResult:null};
const levelInfo={
 1:{time:60,orders:4,label:'轻松入门'},2:{time:60,orders:5,label:'轻松整理'},3:{time:55,orders:5,label:'轻松选择'},4:{time:55,orders:5,label:'倒入练习'},5:{time:75,orders:4,label:'进阶挑战'},6:{time:75,orders:5,label:'进阶挑战'},7:{time:80,orders:5,label:'进阶挑战'},8:{time:85,orders:5,label:'进阶挑战'},9:{time:90,orders:5,label:'进阶挑战'},10:{time:95,orders:6,label:'进阶挑战'}
};
const practicePuzzles=[
 {text:'低压练习 1：把小杯装满 2 格',jugs:[jug('A','小杯',2,0)],target:2,targetJug:'A',ops:['fill'],optimal:1,tip:'点小杯，再点“装满”。'},
 {text:'低压练习 2：把大杯倒空',jugs:[jug('A','大杯',4,4)],target:0,targetJug:'A',ops:['empty'],optimal:1,tip:'点大杯，再点“倒空”。'},
 {text:'低压练习 3：把小杯倒入大杯',jugs:[jug('A','小杯',3,3),jug('B','大杯',5,0)],target:3,targetJug:'B',ops:['pour'],optimal:1,tip:'先点小杯，点“倒入”，再点大杯。'},
 {text:'低压练习 4：任意杯刚好 4 格',jugs:[jug('A','3 格杯',3,0),jug('B','5 格杯',5,0)],target:4,ops:['fill','empty','pour'],optimal:6,advanced:true,tip:'可以先装满 5 格杯，再倒入 3 格杯。'}
];
function jug(id,name,capacity,volume){return {id,name,capacity,volume};}
function clone(obj){return JSON.parse(JSON.stringify(obj));}
function loadProgress(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return {}}}
function saveProgress(p){localStorage.setItem(STORAGE_KEY,JSON.stringify(p));}
function recommendedLevel(){const p=loadProgress();return Math.max(1,Math.min(10,Number(p.nextLevel)||1));}
function screenClass(){return state.lowStim?'app lowStim':'app'}
function setPhase(phase){clearTimer();state.phase=phase;state.feedback=null;render();}
function goHome(){setPhase('home')}
function openDetail(){setPhase('detail')}
function openCover(){setPhase('cover')}
function startTutorial(){state.tutorialIndex=0;state.tutorialDemo=0;setPhase('tutorial')}
function directPractice(){startPractice()}
function toggleLowStim(){state.lowStim=!state.lowStim;render()}
function nextTutorial(){ if(state.tutorialIndex<5){state.tutorialIndex++;state.tutorialDemo=0;render()} else {startPractice()} }
function tutorialFill(){state.tutorialDemo=1;render()}
function tutorialPourStep(){state.tutorialDemo=Math.min(2,state.tutorialDemo+1);render()}
function startPractice(){state.practiceIndex=0;state.selectedJug=null;state.pendingPour=null;state.puzzle=clone(practicePuzzles[0]);state.currentMoves=0;state.feedback={type:'hint',msg:'低压练习不计时。慢慢试，目标卡会一直在上方。'};setPhase('practice')}
function showReady(){state.selectedJug=null;state.pendingPour=null;setPhase('ready')}
function render(){app.className=screenClass(); if(state.phase==='home') renderHome(); else if(state.phase==='detail') renderDetail(); else if(state.phase==='cover') renderCover(); else if(state.phase==='tutorial') renderTutorial(); else if(state.phase==='practice') renderGame(false); else if(state.phase==='ready') renderReady(); else if(state.phase==='training') renderGame(true); else if(state.phase==='result') renderResult();}
function img(src,cls='',alt=''){return `<img class="${cls}" src="${src}" alt="${alt}">`}
function renderHome(){const p=loadProgress();const rec=recommendedLevel();app.innerHTML=`<main class="screen"><div class="content"><div class="topbar"><div class="brand"><div class="logoDot">🍹</div><div><div class="title">小熊果汁铺</div><div class="subtitle">量水壶 / 分配规划小游戏</div></div></div><button class="btn ghost small" onclick="toggleLowStim()">${state.lowStim?'关闭柔和模式':'开启柔和模式'}</button></div><section class="homeGrid"><div class="card homeCard">${img(ASSETS.home,'','小熊果汁铺首页卡片')}<div class="homeInfo"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 style="font-size:30px;margin:0 0 8px">帮小熊店长调出刚刚好的果汁</h2><p class="note">先看教学，再接订单。前 3 级非常容易，只需要装满或倒空。</p></div><span class="pill">推荐难度：第 ${rec} 级</span></div><div class="footerActions"><button class="btn blue" onclick="openDetail()">怎么玩</button><button class="btn" onclick="openDetail()">目标是什么</button><button class="btn primary" onclick="openCover()">开始游戏</button></div></div></div><aside class="col"><div class="card"><h2>首页卡片感</h2><p>这是一个可离线打开的完整试玩版。你会先看到说明、封面、6 屏场景内教学和低压练习，再进入正式训练。</p><div class="bigStat"><div class="stat"><span>1-3</span>轻松关</div><div class="stat"><span>4</span>倒入练习</div><div class="stat"><span>5+</span>进阶挑战</div></div></div><div class="card"><h2>上轮记录</h2>${p.lastRound?`<p>本地记录：第 ${p.lastRound.level} 级，完成 ${p.lastRound.completed}/${p.lastRound.goal} 单，推荐下轮第 ${p.nextLevel} 级。</p>`:'<p>还没有本地记录。完成一轮后，系统会根据正确率和用时推荐下轮难度。</p>'}</div></aside></section></div></main>`;}
function renderDetail(){app.innerHTML=`<main class="screen"><div class="content"><div class="topbar"><div><div class="title">怎么玩</div><div class="subtitle">真实场景演示，不直接开局</div></div><button class="btn ghost small" onclick="goHome()">返回首页</button></div><section class="infoGrid"><div class="card infoCard">${img(ASSETS.howto,'art','怎么玩')}<h3>怎么玩</h3><p>点击果汁杯选择它，再点“装满”或“倒空”。需要倒入时，先选有果汁的杯子，点“倒入”，再选目标杯子。</p><p>每完成一个订单，星星会加一，反馈只轻轻出现，不会打断节奏。</p></div><div class="card infoCard">${img(ASSETS.target,'art','目标是什么')}<h3>目标是什么</h3><p>目标是让指定杯子，或任意一个杯子，刚好到订单卡显示的容量。</p><p>目标卡会一直显示在上方，不需要记住题目。</p></div><div class="card infoCard">${img(ASSETS.difficulty,'art','难度说明')}<h3>难度说明</h3><p>第 1-3 级非常容易，只做装满和倒空。第 4 级开始练习杯子之间倒入。</p><p>第 5 级以后会标明“进阶挑战”，例如用 3 格杯和 5 格杯调出 4 格。</p></div><div class="card infoCard">${img(ASSETS.adaptive,'art','自适应难度')}<h3>自适应难度</h3><p>系统会把本轮表现写入本机 localStorage。结算页会显示“本轮表现”和“下轮推荐难度”。</p><p>正确率高、用时少会推荐更高难度；卡住或用时多会推荐更简单的难度。</p></div></section><div class="footerActions"><button class="btn blue" onclick="openCover()">进入封面页</button><button class="btn" onclick="startTutorial()">直接看教学</button><button class="btn ghost" onclick="startPractice()">直接低压练习</button></div></div></main>`;}
function renderCover(){app.innerHTML=`<main class="screen"><div class="content"><div class="coverHero"><div class="card">${img(ASSETS.cover,'art','小熊果汁铺封面')}</div><div class="col"><div class="brand"><div class="logoDot">🧸</div><div><div class="title">小熊果汁铺</div><div class="subtitle">看准刻度，调出刚刚好的果汁</div></div></div><div class="speech">先看我演示一次，再一起接订单。前几单很轻松，你可以慢慢来。</div><div class="card"><h2>目标是什么</h2><p>按照订单卡，把果汁倒到目标容量。订单卡会一直显示在上方。</p><h2>怎么玩</h2><p>选择杯子，使用装满、倒空、倒入。难的内容会标出“进阶挑战”。</p></div><div class="footerActions"><button class="btn primary" onclick="startTutorial()">开始 6 屏教学</button><button class="btn blue" onclick="startPractice()">低压练习</button><button class="btn ghost" onclick="openDetail()">返回说明</button></div></div></div></div></main>`;}
const tutorial=[
 {img:ASSETS.tutorial1,title:'欢迎来到果汁铺',target:'认识杯子和刻度',text:'小熊店长会把订单放在上方。我们只需要看刻度，把果汁倒到刚刚好的位置。'},
 {img:ASSETS.tutorial2,title:'目标会一直显示',target:'订单目标：小杯装满 2 格',text:'看这里，目标卡会一直在场景里，不用记住它。'},
 {img:ASSETS.tutorial3,title:'点击装满',target:'订单目标：小杯装满 2 格',text:'每接到一个目标，就按需要点击一次操作。现在试试“装满小杯”。',interactive:'fill'},
 {img:ASSETS.tutorial4,title:'杯子之间可以倒入',target:'演示目标：把小杯倒入大杯',text:'倒入时，先选有果汁的杯子，再选要倒进去的杯子。',interactive:'pour'},
 {img:ASSETS.tutorial5,title:'凑到目标刻度',target:'目标：任意杯刚好 4 格',text:'只要有一个杯子刚好到订单目标，就完成订单。星星会加一。'},
 {img:ASSETS.tutorial6,title:'准备进入练习',target:'下一步：低压练习',text:'正式训练前还有低压练习。不计时，先熟悉一下按钮和刻度。'}
];
function renderTutorial(){const s=tutorial[state.tutorialIndex];const dots=tutorial.map((_,i)=>`<span class="dot ${i===state.tutorialIndex?'on':''}"></span>`).join('');let extra='';let hand='';if(s.interactive==='fill'){hand=`<img class="hand" src="${ASSETS.hand}" style="right:90px;bottom:82px" alt="手势提示">`;extra=`<div class="demoCupRow">${demoCup('小杯',2,state.tutorialDemo?2:0,state.tutorialDemo)}</div>${state.tutorialDemo?'<div class="demoFeedback">刚刚好！星星 +1</div>':''}`;}if(s.interactive==='pour'){hand=`<img class="hand" src="${ASSETS.hand}" style="right:130px;bottom:95px" alt="手势提示">`;extra=`<div class="demoCupRow">${demoCup('小杯',3,state.tutorialDemo>=2?0:3,state.tutorialDemo>=1)}${demoCup('大杯',5,state.tutorialDemo>=2?3:0,false)}</div>${state.tutorialDemo>=2?'<div class="demoFeedback">倒入完成！</div>':''}`;}app.innerHTML=`<main class="screen"><div class="content"><div class="topbar"><div class="brand"><div class="logoDot">📘</div><div><div class="title">场景内教学</div><div class="subtitle">第 ${state.tutorialIndex+1} 屏 / 共 6 屏</div></div></div><button class="btn ghost small" onclick="openCover()">返回封面</button></div><section class="tutorialLayout"><div class="sceneWrap"><img class="scene" src="${s.img}" alt="教学场景 ${state.tutorialIndex+1}"><div class="overlayTarget"><div class="targetBox"><span class="targetIcon">🎯</span><span>${s.target}</span></div></div>${hand}${extra}</div><aside class="sidePanel card"><div class="progressDots">${dots}</div><span class="stepBadge">${state.tutorialIndex+1}</span><div class="stepTitle">${s.title}</div><div class="stepText">${s.text}</div>${tutorialControl(s)}<p class="note">提示：目标卡会一直可见。这里是演示，不计分。</p></aside></section></div></main>`;}
function tutorialControl(s){if(s.interactive==='fill'&&!state.tutorialDemo)return `<button class="btn primary" onclick="tutorialFill()">点击装满小杯</button>`;if(s.interactive==='pour'&&state.tutorialDemo<2)return `<button class="btn primary" onclick="tutorialPourStep()">${state.tutorialDemo===0?'先选小杯':'再选大杯'}</button>`;return `<button class="btn primary" onclick="nextTutorial()">${state.tutorialIndex===5?'进入低压练习':'下一屏'}</button>`;}
function demoCup(label,cap,vol,sel){const pct=cap?vol/cap*100:0;return `<div class="jugBox"><div class="jug ${sel?'selected':''}" style="width:86px;height:165px"><div class="fill" style="height:${pct}%"></div>${scaleLines(cap)}</div><div class="jugLabel">${label}</div><div class="jugAmount">${vol}/${cap} 格</div></div>`;}
function scaleLines(cap){let html='';for(let i=1;i<=cap;i++){let y=(i/cap)*100;html+=`<span class="scaleLine" style="bottom:${y}%"></span><span class="scaleText" style="bottom:${y}%">${i}</span>`;}return html;}
function renderReady(){const rec=recommendedLevel();app.innerHTML=`<main class="screen"><div class="content"><section class="readyModal"><div>${img(ASSETS.ready,'art','准备开始')}</div><div class="modalBox"><div class="title" style="font-size:38px">准备开始训练吧！</div><p>帮小熊店长完成今天的果汁订单。</p><div class="targetBox"><span class="targetIcon">🎯</span><span>目标卡会一直显示在上方。</span></div><p>前 3 级只需要装满或倒空。需要时可以点“提示”。</p><p class="pill">本轮将从推荐难度：第 ${rec} 级开始</p><div class="footerActions"><button class="btn blue" onclick="startTutorial()">重新演示</button><button class="btn primary" onclick="enterTraining(${rec})">进入训练</button><button class="btn ghost" onclick="startPractice()">再练一次</button></div></div></section></div></main>`;}
function makePuzzle(level){const r=Math.random();let p;if(level===1){p={text:'订单目标：小杯装满 2 格',jugs:[jug('A','小杯',2,0)],target:2,targetJug:'A',ops:['fill'],optimal:1};}
else if(level===2){if(r<.5)p={text:'订单目标：小杯装满 2 格',jugs:[jug('A','小杯',2,0),jug('B','大杯',4,0)],target:2,targetJug:'A',ops:['fill','empty'],optimal:1};else p={text:'订单目标：把大杯倒空',jugs:[jug('A','小杯',2,0),jug('B','大杯',4,4)],target:0,targetJug:'B',ops:['fill','empty'],optimal:1};}
else if(level===3){const fill=r<.5;p={text:fill?'订单目标：3 格杯装满':'订单目标：5 格杯倒空',jugs:[jug('A','3 格杯',3,fill?0:3),jug('B','5 格杯',5,fill?0:5)],target:fill?3:0,targetJug:fill?'A':'B',ops:['fill','empty'],optimal:1};}
else if(level===4){p={text:'订单目标：把小杯倒入大杯',jugs:[jug('A','小杯',3,3),jug('B','大杯',5,0)],target:3,targetJug:'B',ops:['pour'],optimal:1};}
else if(level===5){p={text:'进阶挑战：用 3 格杯和 5 格杯调出 4 格',jugs:[jug('A','3 格杯',3,0),jug('B','5 格杯',5,0)],target:4,ops:['fill','empty','pour'],optimal:6,advanced:true};}
else if(level===6){p=r<.5?{text:'进阶挑战：用 2 格杯和 5 格杯调出 1 格',jugs:[jug('A','2 格杯',2,0),jug('B','5 格杯',5,0)],target:1,ops:['fill','empty','pour'],optimal:4,advanced:true}:{text:'进阶挑战：用 2 格杯和 5 格杯调出 3 格',jugs:[jug('A','2 格杯',2,0),jug('B','5 格杯',5,0)],target:3,ops:['fill','empty','pour'],optimal:2,advanced:true};}
else if(level===7){p={text:'进阶挑战：用 4 格杯和 7 格杯调出 3 格',jugs:[jug('A','4 格杯',4,0),jug('B','7 格杯',7,0)],target:3,ops:['fill','empty','pour'],optimal:4,advanced:true};}
else if(level===8){p={text:'进阶挑战：三只杯子，调出 4 格',jugs:[jug('A','2 格杯',2,0),jug('B','3 格杯',3,0),jug('C','5 格杯',5,0)],target:4,ops:['fill','empty','pour'],optimal:6,advanced:true};}
else if(level===9){p={text:'进阶挑战：3、5、8 格杯调出 7 格',jugs:[jug('A','3 格杯',3,0),jug('B','5 格杯',5,0),jug('C','8 格杯',8,0)],target:7,ops:['fill','empty','pour'],optimal:5,advanced:true};}
else {p={text:'进阶挑战：4、7、9 格杯调出 6 格',jugs:[jug('A','4 格杯',4,0),jug('B','7 格杯',7,0),jug('C','9 格杯',9,0)],target:6,ops:['fill','empty','pour'],optimal:6,advanced:true};}
return p;}
function enterTraining(level){clearTimer();state.phase='training';state.level=Math.max(1,Math.min(10,level||recommendedLevel()));state.initialTime=levelInfo[state.level].time;state.timeLeft=state.initialTime;state.ordersGoal=levelInfo[state.level].orders;state.completed=0;state.totalMoves=0;state.currentMoves=0;state.hintsUsed=0;state.feedback={type:'hint',msg:'看上方目标卡，慢慢倒。'};state.selectedJug=null;state.pendingPour=null;state.puzzle=makePuzzle(state.level);state.roundStart=Date.now();render();startTimer();}
function renderGame(isTraining){const p=state.puzzle;if(!p)return;const hud=isTraining?`<div class="hud"><div class="hudGroup"><button class="btn small blue" onclick="pauseGame()">暂停</button><div class="hudItem">第 ${state.level} 级 · ${levelInfo[state.level].label}</div></div><div class="hudGroup"><div class="hudItem">剩余 ${state.timeLeft} 秒</div><div class="hudItem">⭐ ${state.completed}/${state.ordersGoal}</div><div class="hudItem">提示 ${state.hintsUsed}</div></div></div>`:`<div class="hud"><div class="hudGroup"><button class="btn small ghost" onclick="openCover()">返回封面</button><div class="hudItem">低压练习 · 不计时</div></div><div class="hudGroup"><div class="hudItem">${state.practiceIndex+1}/4</div></div></div>`;const bg=isTraining?ASSETS.training:ASSETS.practice;app.innerHTML=`<main class="screen gameShell" style="background-image:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,250,235,.92)),url('${bg}')"><div class="content">${hud}<div class="targetBox" style="margin-bottom:12px"><span class="targetIcon">🎯</span><span>${p.text}</span></div><section class="stage"><div class="workbench"><div class="jugs">${p.jugs.map(renderJug).join('')}</div><div class="actions">${actionButton('fill','装满')} ${actionButton('empty','倒空')} ${actionButton('pour','倒入')} <button class="btn warn" onclick="showHint()">提示</button>${isTraining?'<button class="btn ghost" onclick="undoMove()">撤回</button>':''}</div></div><aside class="orderPanel"><h2 style="margin:0">目标是什么</h2><p>${goalText(p)}</p><h2 style="margin:0">怎么玩</h2><ul class="miniList"><li>先点杯子，杯子会发光。</li><li>装满或倒空会直接改变这个杯子。</li><li>倒入时，先选源杯，再选目标杯。</li></ul><div class="feedback ${state.feedback?state.feedback.type:''}">${state.feedback?state.feedback.msg:'目标卡会一直显示。'}</div><div class="card" style="padding:14px"><b>当前容量</b><br>${p.jugs.map(j=>`${j.name}：${j.volume}/${j.capacity} 格`).join('<br>')}</div>${p.advanced?'<span class="pill">进阶挑战</span>':'<span class="pill">轻松订单</span>'}</aside></section>${state.paused?pauseOverlay():''}</div></main>`;}
function renderJug(j){const pct=(j.volume/j.capacity)*100;const cls=(state.selectedJug===j.id?'selected ':'')+(state.pendingPour===j.id?'pending ':'');return `<div class="jugBox"><button class="jug ${cls}" onclick="selectJug('${j.id}')" aria-label="选择${j.name}"><div class="fill" style="height:${pct}%"></div>${scaleLines(j.capacity)}</button><div class="jugLabel">${j.name}</div><div class="jugAmount">${j.volume}/${j.capacity} 格</div></div>`;}
function actionButton(op,label){const p=state.puzzle;const disabled=!p.ops.includes(op);return `<button class="btn ${op==='pour'?'blue':''}" ${disabled?'disabled':''} onclick="applyOp('${op}')">${label}</button>`;}
function goalText(p){if(p.targetJug){const j=p.jugs.find(x=>x.id===p.targetJug);return `让 ${j?j.name:'指定杯'} 刚好到 ${p.target} 格。`;}return `让任意一个杯子刚好到 ${p.target} 格。`;}
function selectJug(id){const p=state.puzzle;if(!p)return;if(state.pendingPour&&id!==state.pendingPour){doPour(state.pendingPour,id);return;}state.selectedJug=id;state.feedback={type:'hint',msg:`已选择 ${p.jugs.find(j=>j.id===id).name}。`};render();}
function beforeMove(){if(!state.puzzle.history)state.puzzle.history=[];state.puzzle.history.push(clone(state.puzzle.jugs));}
function applyOp(op){const p=state.puzzle;if(!p.ops.includes(op))return;if(op==='pour'){if(!state.selectedJug){state.feedback={type:'hint',msg:'先点有果汁的杯子，再点“倒入”。'};render();return;}const src=p.jugs.find(j=>j.id===state.selectedJug);if(!src||src.volume===0){state.feedback={type:'hint',msg:'这个杯子现在没有果汁，换一个杯子试试。'};render();return;}state.pendingPour=src.id;state.feedback={type:'hint',msg:'现在点要倒进去的杯子。'};render();return;}if(!state.selectedJug){state.feedback={type:'hint',msg:'先点一个杯子，再选择操作。'};render();return;}const j=p.jugs.find(x=>x.id===state.selectedJug);if(!j)return;beforeMove();if(op==='fill')j.volume=j.capacity;if(op==='empty')j.volume=0;state.currentMoves++;state.totalMoves++;state.pendingPour=null;state.feedback={type:'hint',msg:op==='fill'?'果汁已经装到最高刻度。':'杯子整理好了。'};afterMove();}
function doPour(srcId,dstId){const p=state.puzzle;const src=p.jugs.find(j=>j.id===srcId),dst=p.jugs.find(j=>j.id===dstId);if(!src||!dst)return;if(src.volume===0){state.feedback={type:'hint',msg:'源杯没有果汁，换一个杯子试试。'};state.pendingPour=null;render();return;}if(dst.volume===dst.capacity){state.feedback={type:'hint',msg:'目标杯已经满了，可以换一个杯子。'};state.pendingPour=null;render();return;}beforeMove();const amount=Math.min(src.volume,dst.capacity-dst.volume);src.volume-=amount;dst.volume+=amount;state.currentMoves++;state.totalMoves++;state.selectedJug=dstId;state.pendingPour=null;state.feedback={type:'hint',msg:`倒入 ${amount} 格果汁。`};afterMove();}
function afterMove(){if(isSolved(state.puzzle)){completeCurrent()}else{render();}}
function isSolved(p){if(p.targetJug){const j=p.jugs.find(x=>x.id===p.targetJug);return j&&j.volume===p.target;}return p.jugs.some(j=>j.volume===p.target);}
function completeCurrent(){if(state.phase==='practice'){state.feedback={type:'success',msg:'刚刚好！这个练习完成了。'};render();setTimeout(()=>{state.practiceIndex++;if(state.practiceIndex>=practicePuzzles.length){showReady()}else{state.puzzle=clone(practicePuzzles[state.practiceIndex]);state.selectedJug=null;state.pendingPour=null;state.currentMoves=0;state.feedback={type:'hint',msg:'继续下一单低压练习。'};render();}},800);return;}state.completed++;state.feedback={type:'success',msg:'刚刚好！星星 +1'};render();setTimeout(()=>{if(state.completed>=state.ordersGoal){finishRound()}else{state.puzzle=makePuzzle(state.level);state.selectedJug=null;state.pendingPour=null;state.currentMoves=0;state.feedback={type:'hint',msg:'下一张订单来了。目标卡在上方。'};render();}},850);}
function undoMove(){const p=state.puzzle;if(p&&p.history&&p.history.length){p.jugs=p.history.pop();state.feedback={type:'hint',msg:'已经撤回上一步。'};state.pendingPour=null;render();}else{state.feedback={type:'hint',msg:'现在还没有可以撤回的步骤。'};render();}}
function showHint(){state.hintsUsed++;const p=state.puzzle;if(!p)return;const sol=solveBFS(p.jugs,p.target,p.targetJug,p.ops,12);let msg=p.tip||'看看目标卡，再选择杯子。';if(sol&&sol.length){msg=describeOp(sol[0],p.jugs);}state.feedback={type:'hint',msg};render();}
function solveBFS(jugs,target,targetJug,ops,maxDepth){const caps=jugs.map(j=>j.capacity),start=jugs.map(j=>j.volume),ids=jugs.map(j=>j.id),targetIdx=targetJug?ids.indexOf(targetJug):-1;const key=a=>a.join(',');const q=[{v:start,steps:[]}];const seen=new Set([key(start)]);while(q.length){const cur=q.shift();const solved=targetIdx>=0?cur.v[targetIdx]===target:cur.v.some(x=>x===target);if(solved)return cur.steps;if(cur.steps.length>=maxDepth)continue;for(const nxt of nextStates(cur.v,caps,ids,ops)){const k=key(nxt.v);if(seen.has(k))continue;seen.add(k);q.push({v:nxt.v,steps:cur.steps.concat(nxt.op)});}}return null;}
function nextStates(v,caps,ids,ops){const out=[];for(let i=0;i<v.length;i++){if(ops.includes('fill')&&v[i]<caps[i]){let n=v.slice();n[i]=caps[i];out.push({v:n,op:`fill:${ids[i]}`});}if(ops.includes('empty')&&v[i]>0){let n=v.slice();n[i]=0;out.push({v:n,op:`empty:${ids[i]}`});}if(ops.includes('pour')){for(let j=0;j<v.length;j++){if(i===j||v[i]===0||v[j]===caps[j])continue;let n=v.slice();const amount=Math.min(v[i],caps[j]-v[j]);n[i]-=amount;n[j]+=amount;out.push({v:n,op:`pour:${ids[i]}:${ids[j]}`});}}}return out;}
function describeOp(op,jugs){const [kind,a,b]=op.split(':');const ja=jugs.find(j=>j.id===a),jb=jugs.find(j=>j.id===b);if(kind==='fill')return `可以先选择 ${ja.name}，再点“装满”。`;if(kind==='empty')return `可以先选择 ${ja.name}，再点“倒空”。`;if(kind==='pour')return `可以先选择 ${ja.name}，点“倒入”，再点 ${jb.name}。`;return '看看目标刻度，慢慢试。';}
function startTimer(){clearTimer();timer=setInterval(()=>{if(state.phase!=='training'||state.paused)return;state.timeLeft--;if(state.timeLeft<=0){state.timeLeft=0;finishRound();}else render();},1000)}
function clearTimer(){if(timer){clearInterval(timer);timer=null;}}
function pauseGame(){state.paused=true;clearTimer();render();}
function resumeGame(){state.paused=false;render();startTimer();}
function pauseOverlay(){return `<div class="overlay"><div class="pauseBox"><h1>训练已暂停</h1><p>目标卡和杯子会保留，继续后从这里接着玩。</p><div class="footerActions" style="justify-content:center"><button class="btn primary" onclick="resumeGame()">继续训练</button><button class="btn ghost" onclick="finishRound()">查看结算</button></div></div></div>`}
function finishRound(){clearTimer();state.paused=false;const used=state.initialTime-state.timeLeft;const correctRate=state.ordersGoal?state.completed/state.ordersGoal:0;let next=state.level;let reason='保持当前难度，继续稳定练习。';if(correctRate>=0.85 && state.timeLeft>=Math.round(state.initialTime*.25) && state.hintsUsed<=Math.max(1,state.completed)){next=Math.min(10,state.level+1);reason='正确率高、用时少，下轮可以稍微变难。';}else if(correctRate<0.5 || state.hintsUsed>=state.completed+3 || state.timeLeft===0){next=Math.max(1,state.level-1);reason='这轮需要更多整理时间，下轮会变简单一点。';}
const result={level:state.level,completed:state.completed,goal:state.ordersGoal,correctRate,used,hints:state.hintsUsed,totalMoves:state.totalMoves,nextLevel:next,reason,time:new Date().toISOString()};const old=loadProgress();const rounds=(old.rounds||[]).concat(result).slice(-8);saveProgress({nextLevel:next,lastRound:result,rounds});state.lastResult=result;state.phase='result';render();}
function renderResult(){const r=state.lastResult||loadProgress().lastRound||{level:1,completed:0,goal:1,correctRate:0,used:0,hints:0,totalMoves:0,nextLevel:1,reason:'还没有记录。'};const pct=Math.round(r.correctRate*100);const avg=r.completed?Math.round((r.totalMoves/r.completed)*10)/10:0;app.innerHTML=`<main class="screen"><div class="content"><section class="resultGrid"><div>${img(ASSETS.result,'art','结算页')}</div><div class="modalBox"><div class="title" style="font-size:38px">结算页</div><p class="subtitle">本轮表现</p><div class="metricGrid"><div class="metric">完成订单 <b>${r.completed}/${r.goal}</b></div><div class="metric">正确率 <b>${pct}%</b></div><div class="metric">用时 <b>${r.used} 秒</b></div><div class="metric">提示次数 <b>${r.hints}</b></div><div class="metric">平均步数 <b>${avg}</b></div><div class="metric">本轮难度 <b>第 ${r.level} 级</b></div></div><div class="targetBox" style="margin-top:16px"><span class="targetIcon">📈</span><span>下轮推荐难度：第 ${r.nextLevel} 级 · ${levelInfo[r.nextLevel].label}</span></div><p>${r.reason}</p><p class="note">记录已写入本机 localStorage。再次进入训练时，会按推荐难度开始。</p><div class="footerActions"><button class="btn primary" onclick="enterTraining(${r.nextLevel})">按推荐难度再来一局</button><button class="btn blue" onclick="startTutorial()">重新演示</button><button class="btn ghost" onclick="goHome()">返回首页</button></div></div></section></div></main>`;}
// 预加载，保证所有本地资产路径都在 index.html 内声明并可检查。
Object.values(ASSETS).forEach(src=>{const im=new Image();im.src=src;});
render();
</script>
</body>
