<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>词语分类园｜Semantic Categorization</title>
  <link rel="stylesheet" href="../shared/unified.css" />
</head>
<body>
  <div id="app"></div>
  <script src="../shared/unified.js"></script>
  <script src="../shared/domain-gap-game.js"></script>
  <script>
    CognitiveDomainGame.mount({
      gameId: 'category-fluency',
      title: '词语分类园',
      subtitle: '看清类别，把正确词语送进花园。',
      domain: 'language',
      domainLabel: '语言',
      taskFamily: 'semantic-categorization',
      primaryParadigm: 'Semantic Categorization',
      basis: '参考语义分类、词汇判断和 verbal fluency 任务；网页实现参考 jsPsych 文本/按钮反应插件的数据结构。',
      instructions: '每题会给一个类别，请从几个词里选出最符合类别的词。',
      mascot: '🌻',
      tone1: '#c8f5c2',
      tone2: '#fff0a8',
      accent: '#4b8d39',
      accent2: '#f6ba4f',
      rounds: 10,
      trials: [
        { symbol: '🍎', prompt: '选择“水果”类词语。', correct: '苹果', options: ['苹果','铅笔','雨伞'], condition: { category: 'fruit' }, stimulus: { category: '水果' } },
        { symbol: '🚗', prompt: '选择“交通工具”类词语。', correct: '公交车', options: ['公交车','西瓜','毛巾'], condition: { category: 'vehicle' }, stimulus: { category: '交通工具' } },
        { symbol: '🐱', prompt: '选择“动物”类词语。', correct: '小猫', options: ['小猫','桌子','月亮'], condition: { category: 'animal' }, stimulus: { category: '动物' } },
        { symbol: '👕', prompt: '选择“衣物”类词语。', correct: '外套', options: ['外套','牙刷','河流'], condition: { category: 'clothing' }, stimulus: { category: '衣物' } },
        { symbol: '🥦', prompt: '选择“蔬菜”类词语。', correct: '胡萝卜', options: ['胡萝卜','飞机','鞋子'], condition: { category: 'vegetable' }, stimulus: { category: '蔬菜' } },
        { symbol: '🎵', prompt: '选择“声音”相关词语。', correct: '铃声', options: ['铃声','枕头','台灯'], condition: { category: 'sound' }, stimulus: { category: '声音' } },
        { symbol: '🏠', prompt: '选择“家居物品”类词语。', correct: '沙发', options: ['沙发','大海','蝴蝶'], condition: { category: 'home' }, stimulus: { category: '家居' } },
        { symbol: '🌧️', prompt: '选择“天气”类词语。', correct: '下雨', options: ['下雨','尺子','饼干'], condition: { category: 'weather' }, stimulus: { category: '天气' } },
        { symbol: '📚', prompt: '选择“学习用品”类词语。', correct: '书本', options: ['书本','老虎','草莓'], condition: { category: 'school' }, stimulus: { category: '学习用品' } },
        { symbol: '⚽', prompt: '选择“运动”相关词语。', correct: '跑步', options: ['跑步','窗帘','牙膏'], condition: { category: 'sport' }, stimulus: { category: '运动' } }
      ]
    });
  </script>
</body>
</html>
