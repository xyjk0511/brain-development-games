<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>果果心算铺｜16-quick-math</title>
  <style>
    :root{
      --cream:#fff8e8;
      --cream2:#fff2cc;
      --sky:#bfe8ff;
      --mint:#bfefd2;
      --yellow:#ffe08a;
      --orange:#ff9b7a;
      --purple:#d8ccff;
      --green:#6bbd6e;
      --deep:#3e4a59;
      --brown:#8b6b4a;
      --danger-soft:#ffcabd;
      --shadow:0 14px 34px rgba(80,62,40,.18);
      --shadow-soft:0 8px 20px rgba(80,62,40,.12);
      --radius:28px;
      --max:1120px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fff9eb,#eaf8ff);color:var(--deep);font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,-apple-system,sans-serif}
    body{overflow-x:hidden}
    button{font:inherit}
    .app{min-height:100vh;padding:18px;display:flex;align-items:center;justify-content:center}
    .shell{width:min(var(--max),100%);min-height:min(740px,calc(100vh - 36px));position:relative;border-radius:34px;background:rgba(255,248,232,.82);box-shadow:var(--shadow);overflow:hidden;border:2px solid rgba(255,255,255,.8)}
    .screen{width:100%;min-height:min(740px,calc(100vh - 36px));padding:24px;position:relative}
    .soft-bg{position:absolute;inset:0;background:radial-gradient(circle at 12% 8%,rgba(255,224,138,.55),transparent 30%),radial-gradient(circle at 95% 12%,rgba(216,204,255,.55),transparent 28%),linear-gradient(180deg,#fff8e8,#eaf8ff);z-index:0}
    .content{position:relative;z-index:1}
    .row{display:flex;gap:20px;align-items:stretch}
    .col{flex:1}
    .card{background:rgba(255,255,255,.82);border:2px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow-soft);overflow:hidden}
    .pad{padding:22px}
    .title{font-size:clamp(32px,5vw,58px);line-height:1.05;margin:0;color:#ef7f47;text-shadow:0 4px 0 rgba(255,248,232,.9)}
    .subtitle{font-size:clamp(18px,2.4vw,25px);line-height:1.45;margin:12px 0 0;font-weight:700}
    .body{font-size:18px;line-height:1.8;margin:10px 0}
    .small{font-size:15px;line-height:1.65;opacity:.88}
    .badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--mint);padding:8px 13px;font-weight:800;margin:4px 6px 4px 0;border:1px solid rgba(60,130,70,.18)}
    .badge.adv{background:var(--purple)}
    .btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
    .btn{border:0;border-radius:20px;min-height:56px;padding:0 24px;font-weight:900;cursor:pointer;box-shadow:0 8px 0 rgba(139,107,74,.18),var(--shadow-soft);transition:transform .12s ease, filter .12s ease;background:#fff;color:var(--deep);display:inline-flex;align-items:center;justify-content:center;gap:10px}
    .btn:hover{transform:translateY(-2px);filter:brightness(1.02)}
    .btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(139,107,74,.18),var(--shadow-soft)}
    .btn.primary{background:linear-gradient(180deg,#ffc56f,#ff9b4b);color:#fff}
    .btn.green{background:linear-gradient(180deg,#89d98d,#55b96d);color:#fff}
    .btn.blue{background:linear-gradient(180deg,#9edfff,#58bdea);color:#fff}
    .btn.ghost{background:rgba(255,255,255,.75);border:2px solid rgba(139,107,74,.16);box-shadow:var(--shadow-soft)}
    .btn.danger{background:var(--danger-soft)}
    .img-cover{width:100%;height:100%;object-fit:cover;display:block}
    .hero-img{height:310px}
    .home-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:stretch}
    .lobby-image{height:330px;position:relative}
    .lobby-info{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
    .mini-panel{background:rgba(255,248,232,.9);border:2px solid rgba(139,107,74,.12);border-radius:22px;padding:16px}
    .mini-panel h3,.info-panel h3{margin:0 0 8px;font-size:22px;color:#43874d}
    .info-panel{background:rgba(255,255,255,.78);border-radius:24px;padding:18px;border:2px solid rgba(255,255,255,.9);box-shadow:var(--shadow-soft)}
    .scene-wrap{position:relative;border-radius:30px;overflow:hidden;min-height:540px;background:#eaf8ff;box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.9)}
    .scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.98)}
    .scene-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,248,232,.15),rgba(255,248,232,.25));pointer-events:none}
    .top-target{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:min(640px,calc(100% - 240px));min-height:92px;border-radius:24px;background:rgba(255,248,232,.94);border:3px solid rgba(255,224,138,.95);box-shadow:var(--shadow-soft);display:flex;align-items:center;justify-content:center;padding:13px 22px;text-align:center;font-size:clamp(20px,2.6vw,30px);font-weight:900;line-height:1.35;z-index:5}
    .target-label{position:absolute;left:16px;top:-14px;background:#ffad66;color:#fff;border-radius:999px;padding:5px 12px;font-size:16px}
    .hud{position:absolute;left:16px;right:16px;top:12px;z-index:8;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
    .hud .hud-box{pointer-events:auto;background:rgba(255,248,232,.94);border:2px solid rgba(255,255,255,.9);box-shadow:var(--shadow-soft);border-radius:18px;padding:10px 12px;font-weight:900;display:flex;align-items:center;gap:10px;min-height:52px}
    .hud-right{display:flex;gap:10px;align-items:flex-start}
    .pause-mini{width:48px;height:48px;border-radius:16px;border:0;background:#fff;box-shadow:var(--shadow-soft);font-weight:900;cursor:pointer}
    .task-area{position:absolute;left:36px;right:36px;top:140px;bottom:28px;z-index:4;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap}
    .squirrel{position:absolute;left:18px;bottom:14px;width:128px;height:128px;border-radius:50%;z-index:5;filter:drop-shadow(0 10px 8px rgba(80,62,40,.18))}
    .abacus{position:absolute;right:20px;bottom:16px;width:150px;z-index:5;border-radius:16px;filter:drop-shadow(0 10px 8px rgba(80,62,40,.16))}
    .hand{position:absolute;width:90px;z-index:9;animation:tapPulse 1s infinite ease-in-out;filter:drop-shadow(0 6px 8px rgba(80,62,40,.18))}
    @keyframes tapPulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
    .fruit-btn,.choice-btn,.number-btn{border:0;background:rgba(255,255,255,.80);border-radius:28px;box-shadow:var(--shadow-soft);padding:14px;min-width:120px;min-height:120px;cursor:pointer;position:relative;border:3px solid rgba(255,255,255,.9)}
    .fruit-btn img{width:86px;height:86px;object-fit:contain;border-radius:50%;display:block}
    .fruit-btn.clicked{opacity:.55;transform:scale(.95)}
    .choice-btn{min-width:170px;min-height:150px;padding:16px;background:rgba(255,248,232,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:20px}
    .choice-btn:hover,.fruit-btn:hover,.number-btn:hover{outline:4px solid rgba(255,224,138,.75)}
    .choice-fruits{display:flex;justify-content:center;flex-wrap:wrap;max-width:190px;margin:auto}
    .choice-fruits img{width:38px;height:38px;object-fit:contain;border-radius:50%;margin:-2px}
    .choice-count{background:#fff;border-radius:999px;padding:6px 14px;font-size:24px;box-shadow:inset 0 0 0 2px rgba(139,107,74,.12)}
    .number-grid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
    .number-btn{min-width:86px;min-height:78px;font-size:30px;font-weight:900;background:#fff8e8}
    .feedback{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:20;background:rgba(255,255,255,.95);border:3px solid rgba(255,224,138,.9);border-radius:999px;padding:12px 22px;font-size:22px;font-weight:900;box-shadow:var(--shadow);animation:pop .24s ease-out}
    @keyframes pop{from{transform:translateX(-50%) scale(.82);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
    .progress-dots{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
    .dot{width:12px;height:12px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.08)}
    .dot.on{background:#ffad66}
    .modal-backdrop{position:absolute;inset:0;background:rgba(62,74,89,.36);z-index:50;display:flex;align-items:center;justify-content:center;padding:22px}
    .modal{width:min(620px,100%);background:rgba(255,248,232,.98);border:3px solid #fff;border-radius:30px;box-shadow:var(--shadow);padding:24px;position:relative}
    .modal h2{font-size:34px;margin:0 0 10px;color:#ef7f47}
    .modal p{font-size:18px;line-height:1.75}
    .footer-note{margin-top:12px;padding:10px 14px;border-radius:18px;background:rgba(191,239,210,.55);font-weight:700}
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
    .metric{background:#fff;border-radius:18px;padding:16px;border:2px solid rgba(139,107,74,.12)}
    .metric strong{display:block;font-size:28px;color:#ef7f47;margin-top:4px}
    .wide{grid-column:1/-1}
    .stage-title{display:flex;align-items:center;gap:14px;margin-bottom:16px}
    .stage-title img{width:76px;height:76px;border-radius:50%;box-shadow:var(--shadow-soft)}
    .practice-note{position:absolute;left:18px;bottom:18px;right:18px;z-index:6;background:rgba(255,248,232,.92);border-radius:20px;padding:12px 16px;font-weight:800;text-align:center}
    .shake{animation:shake .34s ease-in-out}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
    .stars-row{display:flex;gap:4px;align-items:center}
    .star-dot{width:18px;height:18px;border-radius:50%;background:#ffd36b;box-shadow:0 1px 0 rgba(0,0,0,.08)}
    .lowstim *{animation:none !important;transition:none !important}
    .lowstim .scene-img{filter:saturate(.72) contrast(.92) brightness(1.05)}
    .lowstim .soft-bg{background:linear-gradient(180deg,#fffaf0,#f3fbf5)}
    .asset-check{position:absolute;right:10px;bottom:8px;font-size:12px;opacity:.56}
    .hidden{display:none !important}
    @media (max-width:840px){
      .screen{padding:14px}
      .home-grid,.row,.result-grid{grid-template-columns:1fr;display:grid}
      .lobby-image,.hero-img{height:230px}
      .scene-wrap{min-height:620px}
      .top-target{top:76px;width:calc(100% - 30px);font-size:20px}
      .task-area{top:190px;left:14px;right:14px;bottom:84px;gap:12px}
      .hud{left:10px;right:10px;top:10px}
      .hud .hud-box{font-size:14px;padding:8px;min-height:44px}
      .choice-btn{min-width:132px;min-height:132px}
      .squirrel{width:92px;height:92px}
      .abacus{width:112px}
      .btn{width:100%}
      .lobby-info{grid-template-columns:1fr}
    }
  </style>
  <link rel="stylesheet" href="../shared/unified.css">
</head>
<body>
  <div id="app" class="app"></div>
  <script>
  (function(){
    'use strict';

    const A = {
      source:'assets/source-gptimage2.png',
      lobby:'assets/lobby-card-cover.png',
      detail:'assets/detail-modal-cover.png',
      cover:'assets/game-cover-poster.png',
      scene:'assets/scene-background.png',
      lowScene:'assets/low-stim-bg.png',
      training:'assets/training-bg.png',
      practice:'assets/practice-bg.png',
      ready:'assets/ready-bg.png',
      result:'assets/result-bg.png',
      tutorial:[
        'assets/tutorial-scene-1.png',
        'assets/tutorial-scene-2.png',
        'assets/tutorial-scene-3.png',
        'assets/tutorial-scene-4.png',
        'assets/tutorial-scene-5.png',
        'assets/tutorial-scene-6.png'
      ],
      squirrel:'assets/squirrel-cashier.png',
      abacus:'assets/star-abacus.png',
      hand:'assets/tutorial-hand.png',
      basket:'assets/basket-choice.png',
      success:'assets/success-sticker.png',
      hint:'assets/hint-sticker.png',
      badge:'assets/result-badge.png',
      fruits:{
        apple:'assets/fruit-apple.png',
        strawberry:'assets/fruit-strawberry.png',
        banana:'assets/fruit-banana.png',
        orange:'assets/fruit-orange.png',
        pear:'assets/fruit-pear.png',
        grape:'assets/fruit-grape.png'
      }
    };

    const fruitNames = {
      apple:'苹果',
      strawberry:'草莓',
      banana:'香蕉',
      orange:'橙子',
      pear:'梨',
      grape:'葡萄'
    };

    const levelDefs = {
      1:{name:'轻松数水果', max:3, tasks:3, time:null, advanced:false, desc:'不限时，只数 1 到 3 个水果。'},
      2:{name:'轻松添水果', max:5, tasks:4, time:null, advanced:false, desc:'不限时，只做很小的添水果订单。'},
      3:{name:'轻松拿走水果', max:5, tasks:5, time:null, advanced:false, desc:'不限时，水果会清楚地放回货架。'},
      4:{name:'小店正式营业', max:8, tasks:6, time:90, advanced:false, desc:'有倒计时，但仍然是小数字。'},
      5:{name:'谁的篮子更多', max:9, tasks:7, time:75, advanced:false, desc:'比较两个或三个篮子的水果数量。'},
      6:{name:'星星算盘结账', max:10, tasks:8, time:70, advanced:false, desc:'把水果数量换成星星算盘。'},
      7:{name:'进阶挑战：两种水果', max:12, tasks:8, time:60, advanced:true, desc:'两种水果一起数，数字仍然可看图完成。'},
      8:{name:'进阶挑战：补满篮子', max:10, tasks:8, time:60, advanced:true, desc:'看篮子里已有数量，补到目标数。'},
      9:{name:'进阶挑战：小订单连算', max:15, tasks:9, time:55, advanced:true, desc:'两步小订单，目标卡会一直显示。'},
      10:{name:'进阶挑战：热闹收银台', max:20, tasks:10, time:45, advanced:true, desc:'混合订单，适合熟练后挑战。'}
    };

    const storageKey = 'fruitQuickMathProgressV1';

    function loadProgress(){
      try{
        const raw = localStorage.getItem(storageKey);
        if(!raw) return {nextLevel:1, history:[]};
        const obj = JSON.parse(raw);
        return Object.assign({nextLevel:1, history:[]}, obj);
      }catch(e){
        return {nextLevel:1, history:[]};
      }
    }

    function saveProgress(nextLevel, performance){
      const progress = loadProgress();
      const entry = Object.assign({savedAt:new Date().toISOString()}, performance);
      const history = [entry].concat(progress.history || []).slice(0,8);
      localStorage.setItem(storageKey, JSON.stringify({nextLevel, lastPerformance:entry, history}));
    }

    let state = {
      screen:'home',
      tutorialStep:0,
      lowStim:false,
      feedback:'',
      practiceIndex:0,
      practiceClicked:0,
      selectedDifficulty:loadProgress().nextLevel || 1,
      training:null,
      paused:false,
      readyFrom:'practice',
      result:null
    };

    let timerId = null;

    const app = document.getElementById('app');

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }

    function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
    function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
    function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
    function shuffle(arr){ return arr.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); }

    function setScreen(screen, extra){
      state = Object.assign({}, state, {screen}, extra || {});
      if(screen !== 'training') stopTimer();
      render();
    }

    function playFeedback(text, ms){
      state.feedback = text;
      render();
      window.setTimeout(()=>{ state.feedback=''; render(); }, ms || 760);
    }

    function layoutShell(inner){
      return `<div class="shell ${state.lowStim?'lowstim':''}">
        <div class="screen">
          <div class="soft-bg"></div>
          <div class="content">${inner}</div>
          <div class="asset-check">离线资源：assets/*.png</div>
        </div>
      </div>`;
    }

    function imgTag(src, cls, alt){
      return `<img class="${cls||''}" src="${src}" alt="${alt||''}" loading="eager">`;
    }

    function render(){
      if(state.screen === 'home') renderHome();
      if(state.screen === 'detail') renderDetail();
      if(state.screen === 'cover') renderCover();
      if(state.screen === 'tutorial') renderTutorial();
      if(state.screen === 'practice') renderPractice();
      if(state.screen === 'ready') renderReady();
      if(state.screen === 'training') renderTraining();
      if(state.screen === 'result') renderResult();
    }

    function renderHome(){
      const progress = loadProgress();
      const nextLevel = clamp(Number(progress.nextLevel || 1),1,10);
      const def = levelDefs[nextLevel];
      app.innerHTML = layoutShell(`
        <div class="home-grid">
          <div class="card">
            <div class="lobby-image">${imgTag(A.lobby,'img-cover','果果心算铺大厅卡片')}</div>
            <div class="pad">
              <h1 class="title">果果心算铺</h1>
              <p class="subtitle">帮松鼠收银员数水果、装篮子、拨亮星星算盘。</p>
              <div style="margin-top:12px">
                <span class="badge">快速心算</span>
                <span class="badge">数量感</span>
                <span class="badge">基础计算</span>
                ${def.advanced?'<span class="badge adv">进阶挑战</span>':''}
              </div>
              <div class="btns">
                <button class="btn primary" data-action="detail">查看说明</button>
                <button class="btn green" data-action="cover">直接进入小店</button>
              </div>
            </div>
          </div>
          <div>
            <div class="stage-title">
              ${imgTag(A.squirrel,'','松鼠收银员')}
              <div>
                <h2 style="margin:0;font-size:32px;color:#43874d">欢迎来到水果小商店</h2>
                <p class="small" style="margin:5px 0 0">当前记录推荐：第 ${nextLevel} 级｜${def.name}</p>
              </div>
            </div>
            <div class="lobby-info">
              <div class="mini-panel">
                <h3>怎么玩</h3>
                <p class="body">先看目标卡，再点击水果、选择正确篮子，或帮星星算盘结账。</p>
              </div>
              <div class="mini-panel">
                <h3>目标是什么</h3>
                <p class="body">把小动物要的水果装对，让松鼠收银员顺利完成订单。</p>
              </div>
            </div>
            <div class="info-panel" style="margin-top:16px">
              <h3>本版包含</h3>
              <p class="body">首页卡片、详情说明、封面页、6 屏场景内教学、低压练习、准备开始弹窗、正式训练 HUD、自适应难度和结算推荐。</p>
              <div class="btns">
                <button class="btn ghost" data-action="toggleLow">${state.lowStim?'关闭柔和模式':'开启柔和模式'}</button>
                <button class="btn ghost" data-action="clearRecord">清除难度记录</button>
              </div>
            </div>
          </div>
        </div>
      `);
    }

    function renderDetail(){
      app.innerHTML = layoutShell(`
        <div class="row">
          <div class="card col">
            <div class="hero-img">${imgTag(A.detail,'img-cover','详情说明图')}</div>
          </div>
          <div class="col">
            <div class="stage-title">
              ${imgTag(A.abacus,'','星星算盘')}
              <div>
                <h1 class="title" style="font-size:44px">果果心算铺</h1>
                <p class="subtitle">可试玩认知训练小游戏</p>
              </div>
            </div>
            <div class="info-panel">
              <h3>怎么玩</h3>
              <p class="body">你会在真实水果小商店里接订单。目标卡会一直在上方：它会告诉你要找几个水果、要添几个、拿走几个，或者哪个篮子更多。</p>
            </div>
            <div class="info-panel" style="margin-top:14px">
              <h3>目标是什么</h3>
              <p class="body">帮助松鼠收银员把水果装进正确篮子。你练到的是快速心算、数量感和基础加减，但整个过程都像帮小动物买水果。</p>
            </div>
            <div style="margin-top:14px">
              <span class="badge">1-3 级不限时</span>
              <span class="badge">目标卡常驻</span>
              <span class="badge">温和提示</span>
              <span class="badge adv">难题标进阶挑战</span>
            </div>
            <div class="btns">
              <button class="btn primary" data-action="cover">进入封面页</button>
              <button class="btn ghost" data-action="home">返回首页</button>
            </div>
          </div>
        </div>
      `);
    }

    function renderCover(){
      app.innerHTML = layoutShell(`
        <div class="card" style="position:relative;min-height:620px;overflow:hidden">
          ${imgTag(A.cover,'img-cover','游戏封面大图')}

    function tutorialHotspots(step){
      if(step.action === 'next'){
        return `<button class="btn primary" style="position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:12" data-action="tutorialNext">${step.btn}</button>`;

      if(step.action === 'fruit1' || step.action === 'fruit2'){

    const practiceTasks = [
      {type:'count', target:'请找到 2 个苹果', fruit:'apple', answer:2, choices:null, hint:'每发现一个苹果，就点一次。'},
      {type:'choice', target:'小兔先要 2 个苹果，又添 1 个，选装好的篮子', fruit:'apple', answer:3, choices:[2,3,4], hint:'2 个再添 1 个，就是 3 个。'},
      {type:'choice', target:'5 个草莓放回 2 个，选剩下的篮子', fruit:'strawberry', answer:3, choices:[2,3,4], hint:'5 个拿走 2 个，还剩 3 个。'},
      {type:'compare', target:'小鸟想要水果更多的篮子', fruit:'banana', answer:'B', choices:[{id:'A',count:3},{id:'B',count:5}], hint:'看哪个篮子里的水果更多。'}

    function renderPractice(){
      const task = practiceTasks[state.practiceIndex] || practiceTasks[0];

    function hudHtml(left, timer, stars){
      return `<div class="hud">

      </div>`;
    }

    function renderTaskControls(task, mode){
      if(task.type === 'count'){
        const total = task.answer;
        return `<div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center">${Array.from({length:total}).map((_,i)=>`
          <button class="fruit-btn ${i < (mode==='practice'?state.practiceClicked:(state.training?.clicked||0))?'clicked':''}" data-action="${mode==='practice'?'practiceFruit':'trainingFruit'}">
            <img src="${A.fruits[task.fruit]}" alt="${fruitNames[task.fruit]}"><strong>${fruitNames[task.fruit]}</strong>
          </button>`).join('')}</div>`;
      }
      if(task.type === 'compare'){
        return `<div style="display:flex;gap:18px;flex-wrap:wrap;justify-content:center">${task.choices.map(c=>`
          <button class="choice-btn" data-action="${mode==='practice'?'practiceChoice':'trainingChoice'}" data-value="${c.id}">
            <div class="choice-fruits">${fruitImgs(task.fruit,c.count)}</div>
            <span class="choice-count">${c.id} 篮｜${c.count} 个</span>
          </button>`).join('')}</div>`;
      }
      if(task.type === 'number'){
        return `<div class="number-grid">${task.choices.map(n=>`
          <button class="number-btn" data-action="${mode==='practice'?'practiceChoice':'trainingChoice'}" data-value="${n}">${n}</button>`).join('')}</div>`;
      }
      return `<div style="display:flex;gap:18px;flex-wrap:wrap;justify-content:center">${task.choices.map(n=>`
        <button class="choice-btn" data-action="${mode==='practice'?'practiceChoice':'trainingChoice'}" data-value="${n}">
          <div class="choice-fruits">${fruitImgs(task.fruit,n)}</div>
          <span class="choice-count">${n} 个</span>
        </button>`).join('')}</div>`;
    }

    function fruitImgs(fruit, count){
      const max = Math.min(count, 12);
      return Array.from({length:max}).map(()=>`<img src="${A.fruits[fruit]}" alt="${fruitNames[fruit]}">`).join('');
    }

    function renderReady(){
      app.innerHTML = `<div class="shell ${state.lowStim?'lowstim':''}">
        <div class="scene-wrap">
          ${imgTag(A.ready,'scene-img','准备开始场景')}
          <div class="scene-overlay"></div>
          <div class="top-target"><span class="target-label">目标卡</span>看目标卡，选正确篮子</div>
          ${imgTag(A.squirrel,'squirrel','松鼠收银员')}
          ${imgTag(A.abacus,'abacus','星星算盘')}
          <div class="modal-backdrop" style="background:rgba(62,74,89,.24)">
            <div class="modal">
              <h2>准备开始训练吧！</h2>
              <p>目标卡会一直在上方。看清订单，帮松鼠把水果装好。</p>
              <div class="footer-note">1-3 级非常容易：不限时、数字小、可以重选。难的内容会标“进阶挑战”。</div>
              <div class="btns">
                <button class="btn ghost" data-action="tutorialRestart">重新演示</button>
                <button class="btn primary" data-action="trainingStart">进入训练</button>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    }

    function startTraining(level){
      const lv = clamp(Number(level || loadProgress().nextLevel || 1),1,10);
      const def = levelDefs[lv];
      state.training = {
        level:lv,
        taskIndex:0,
        currentTask:null,
        stars:0,
        correct:0,
        attempts:0,
        wrong:0,
        hintUsed:0,
        clicked:0,
        reactionTimes:[],
        startedAt:Date.now(),
        taskStartedAt:Date.now(),
        secondsLeft:def.time,
        finished:false
      };
      state.feedback = '';
      state.screen = 'training';
      nextTrainingTask();
      startTimer();
      render();
    }

    function startTimer(){
      stopTimer();
      timerId = window.setInterval(()=>{
        if(state.screen !== 'training' || state.paused || !state.training) return;
        const def = levelDefs[state.training.level];
        if(def.time !== null){
          state.training.secondsLeft = Math.max(0, state.training.secondsLeft - 1);
          if(state.training.secondsLeft <= 0){
            finishTraining();
          }else{
            render();
          }
        }
      },1000);
    }
    function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

    function nextTrainingTask(){
      if(!state.training) return;
      const def = levelDefs[state.training.level];
      if(state.training.taskIndex >= def.tasks){
        finishTraining();
        return;
      }
      state.training.currentTask = generateTask(state.training.level);
      state.training.clicked = 0;
      state.training.taskStartedAt = Date.now();
    }

    function generateTask(level){
      const def = levelDefs[level];
      const fruit = pick(Object.keys(fruitNames));
      let task;
      if(level === 1){
        const n = rand(1,3);
        task = {type:'count', target:`请帮松鼠找到 ${n} 个${fruitNames[fruit]}`, fruit, answer:n, choices:null, hint:`每发现一个${fruitNames[fruit]}，就点一次。`};
      }else if(level === 2){
        const a = rand(1,2), b = rand(1,3);
        const ans = Math.min(a+b,5);
        task = makeChoice(`先要 ${a} 个${fruitNames[fruit]}，又添 ${ans-a} 个，选装好的篮子`, fruit, ans, 5);
      }else if(level === 3){
        const start = rand(3,5), take = rand(1, Math.min(2,start-1));
        task = makeChoice(`${start} 个${fruitNames[fruit]}放回 ${take} 个，选剩下的篮子`, fruit, start-take, 5);
      }else if(level === 4){
        if(Math.random()<.5){
          const a = rand(1,4), b = rand(1,4);
          task = makeChoice(`先要 ${a} 个${fruitNames[fruit]}，又添 ${b} 个，选装好的篮子`, fruit, a+b, 8);
        }else{
          const start = rand(4,8), take = rand(1,3);
          task = makeChoice(`${start} 个${fruitNames[fruit]}放回 ${Math.min(take,start-1)} 个，选剩下的篮子`, fruit, start-Math.min(take,start-1), 8);
        }
      }else if(level === 5){
        const a = rand(1,9), b = rand(1,9);
        const more = a >= b ? 'A' : 'B';
        task = {type:'compare', target:`小动物想要水果更多的篮子`, fruit, answer:more, choices:[{id:'A',count:a},{id:'B',count:b}], hint:'比较两个篮子，选水果数量更多的那个。'};
        if(a===b){ task.choices[1].count = clamp(b+1,1,9); task.answer = task.choices[0].count >= task.choices[1].count ? 'A':'B'; }
      }else if(level === 6){
        const n = rand(3,10);
        task = {type:'number', target:`${n} 个${fruitNames[fruit]}要拨亮几颗星星？`, fruit, answer:n, choices:numberChoices(n,10), hint:'1 个水果对应 1 颗星星。'};
      }else if(level === 7){
        const f2 = pick(Object.keys(fruitNames).filter(x=>x!==fruit));
        const a = rand(2,6), b = rand(2,6), ans=a+b;
        task = {type:'choice', target:`进阶挑战：${a} 个${fruitNames[fruit]}加 ${b} 个${fruitNames[f2]}，一共几个？`, fruit, answer:ans, choices:numberChoices(ans,12), hint:'先数第一种，再数第二种，最后合起来。', secondaryFruit:f2, secondaryCount:b, primaryCount:a};
      }else if(level === 8){
        const target = rand(6,10), have = rand(1,target-2), ans = target-have;
        task = {type:'number', target:`进阶挑战：篮子要装到 ${target} 个，已经有 ${have} 个，还要添几个？`, fruit, answer:ans, choices:numberChoices(ans,10), hint:'看目标数，再看已经有几个。'};
      }else if(level === 9){
        const a=rand(3,9), b=rand(1,5), c=rand(1,4);
        const ans = a + b - c;
        task = {type:'number', target:`进阶挑战：先有 ${a} 个，又添 ${b} 个，再放回 ${c} 个，还剩几个？`, fruit, answer:ans, choices:numberChoices(ans,15), hint:'按目标卡顺序一步一步看。'};
      }else{
        const mode = Math.random();
        if(mode<.34){
          const a=rand(5,12), b=rand(1,8);
          task = {type:'number', target:`进阶挑战：热闹收银台，${a} 个再添 ${b} 个，一共几个？`, fruit, answer:a+b, choices:numberChoices(a+b,20), hint:'先找较大的数，再往上数。'};
        }else if(mode<.67){
          const a=rand(8,20), b=rand(1,Math.min(8,a-1));
          task = {type:'number', target:`进阶挑战：${a} 个${fruitNames[fruit]}放回 ${b} 个，还剩几个？`, fruit, answer:a-b, choices:numberChoices(a-b,20), hint:'可以把拿走的部分先遮住。'};
        }else{
          const n=rand(8,20);
          task = {type:'number', target:`进阶挑战：帮星星算盘拨到 ${n} 颗星`, fruit, answer:n, choices:numberChoices(n,20), hint:'选择和目标卡一样的星星数。'};
        }
      }
      task.id = Math.random().toString(36).slice(2);
      return task;
    }

    function makeChoice(target, fruit, answer, max){
      return {type:'choice', target, fruit, answer, choices:numberChoices(answer,max), hint:'看目标卡，把数字和篮子里的水果对上。'};
    }

    function numberChoices(answer, max){
      const set = new Set([answer]);
      const deltas = shuffle([-2,-1,1,2,3,-3]);
      for(const d of deltas){
        if(set.size>=3) break;
        const v = clamp(answer+d,1,max);
        if(v !== answer) set.add(v);
      }
      while(set.size<3){
        const v = rand(1,max);
        if(v !== answer) set.add(v);
      }
      return shuffle(Array.from(set));
    }

    function renderTraining(){
      const tr = state.training;
      const def = levelDefs[tr.level];
      const task = tr.currentTask;
      const timerText = def.time === null ? '不限时' : `${String(Math.floor(tr.secondsLeft/60)).padStart(2,'0')}:${String(tr.secondsLeft%60).padStart(2,'0')}`;
      const left = `第 ${tr.level} 级｜${def.name}`;
      app.innerHTML = `<div class="shell ${state.lowStim?'lowstim':''}">
        <div class="scene-wrap">
          ${imgTag(state.lowStim?A.lowScene:A.training,'scene-img','正式训练背景')}
          <div class="scene-overlay"></div>
          ${hudHtml(left, timerText, `星星 ${tr.stars}`)}
          <div class="top-target"><span class="target-label">目标卡</span>${escapeHtml(task.target)}</div>
          ${imgTag(A.squirrel,'squirrel','松鼠收银员')}
          ${imgTag(A.abacus,'abacus','星星算盘')}
          <div class="task-area">${renderTrainingSceneTask(task)}</div>
          <div style="position:absolute;left:18px;bottom:20px;z-index:10;display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn ghost" data-action="hint">提示一下</button>
            <button class="btn ghost" data-action="toggleLow">${state.lowStim?'关闭柔和模式':'柔和模式'}</button>
          </div>
          ${state.feedback?`<div class="feedback">${escapeHtml(state.feedback)}</div>`:''}
          ${state.paused?pauseModalHtml():''}
        </div>
      </div>`;
    }

    function renderTrainingSceneTask(task){
      let extra = '';
      if(task.secondaryFruit){
        extra = `<div style="width:100%;text-align:center;font-size:20px;font-weight:900;background:rgba(255,248,232,.86);border-radius:18px;padding:8px">
          画面提示：${task.primaryCount} 个${fruitNames[task.fruit]} + ${task.secondaryCount} 个${fruitNames[task.secondaryFruit]}
        </div>`;
      }
      return `${extra}${renderTaskControls(task, 'training')}`;
    }

    function pauseModalHtml(){
      const tr = state.training;
      const current = tr?.currentTask?.target || '看目标卡，继续装水果';
      return `<div class="modal-backdrop">
        <div class="modal">
          <h2>暂停一下</h2>
          <p><strong>当前目标：</strong>${escapeHtml(current)}</p>
          <div class="btns">
            <button class="btn primary" data-action="resume">继续训练</button>
            <button class="btn ghost" data-action="tutorialRestart">重新演示</button>
            <button class="btn ghost" data-action="cover">返回封面</button>
          </div>
        </div>
      </div>`;
    }

    function finishTraining(){
      if(!state.training || state.training.finished) return;
      stopTimer();
      const tr = state.training;
      tr.finished = true;
      const totalSec = Math.max(1, Math.round((Date.now() - tr.startedAt)/1000));
      const taskCount = levelDefs[tr.level].tasks;
      const accuracy = tr.correct / Math.max(1, taskCount);
      const avgMs = tr.reactionTimes.length ? Math.round(tr.reactionTimes.reduce((a,b)=>a+b,0)/tr.reactionTimes.length) : 0;
      const nextLevel = recommendLevel(tr.level, accuracy, avgMs, tr.hintUsed, tr.wrong);
      const result = {
        level:tr.level,
        levelName:levelDefs[tr.level].name,
        correct:tr.correct,
        taskCount,
        attempts:tr.attempts,
        wrong:tr.wrong,
        accuracy,
        avgMs,
        totalSec,
        hints:tr.hintUsed,
        stars:tr.stars,
        nextLevel,
        nextName:levelDefs[nextLevel].name,
        advanced:levelDefs[nextLevel].advanced
      };
      saveProgress(nextLevel, result);
      state.result = result;
      state.selectedDifficulty = nextLevel;
      state.screen = 'result';
      state.paused = false;
      render();
    }

    function recommendLevel(level, accuracy, avgMs, hints, wrong){
      let next = level;
      const avgSec = avgMs/1000;
      if(level <= 3){
        if(accuracy >= 0.98 && avgSec > 0 && avgSec <= 7 && hints === 0) next = Math.min(4, level+1);
        else next = level;
      }else{
        if(accuracy >= 0.86 && avgSec <= 8 && hints <= 1 && wrong <= 1) next = Math.min(10, level+1);
        else if(accuracy < 0.62 || avgSec >= 13 || wrong >= 4) next = Math.max(1, level-1);
        else next = level;
      }
      return next;
    }

    function renderResult(){
      const r = state.result || loadProgress().lastPerformance || {
        level:1, levelName:levelDefs[1].name, correct:0, taskCount:0, attempts:0, wrong:0, accuracy:0, avgMs:0,totalSec:0,hints:0,stars:0,nextLevel:1,nextName:levelDefs[1].name, advanced:false
      };
      const accText = `${Math.round(r.accuracy*100)}%`;
      app.innerHTML = layoutShell(`
        <div class="row">
          <div class="card col">
            <div style="height:260px">${imgTag(A.result,'img-cover','结算页背景')}</div>
            <div class="pad">
              <div class="stage-title">
                ${imgTag(A.badge,'','结算徽章')}
                <div>
                  <h1 class="title" style="font-size:42px">今天的小店收工啦</h1>
                  <p class="subtitle">你帮松鼠装好了很多水果。</p>
                </div>
              </div>
              <div class="btns">
                <button class="btn primary" data-action="trainingStartRecommended">按推荐难度开始</button>
                <button class="btn green" data-action="trainingStartSame">再玩当前难度</button>
                <button class="btn ghost" data-action="home">返回首页</button>
              </div>
            </div>
          </div>
          <div class="col">
            <div class="info-panel">
              <h3>本轮表现</h3>
              <div class="result-grid">
                <div class="metric">当前难度<strong>第 ${r.level} 级</strong><span>${escapeHtml(r.levelName)}</span></div>
                <div class="metric">答对订单<strong>${r.correct}/${r.taskCount}</strong><span>温和记录，不扣星</span></div>
                <div class="metric">正确率<strong>${accText}</strong><span>按完成订单计算</span></div>
                <div class="metric">平均用时<strong>${r.avgMs? (r.avgMs/1000).toFixed(1)+' 秒':'—'}</strong><span>每张订单平均</span></div>
                <div class="metric">提示次数<strong>${r.hints}</strong><span>提示是正常辅助</span></div>
                <div class="metric">星星<strong>${r.stars}</strong><span>星星算盘奖励</span></div>
              </div>
            </div>
            <div class="info-panel" style="margin-top:16px">
              <h3>下轮推荐难度</h3>
              <p class="body"><strong>第 ${r.nextLevel} 级｜${escapeHtml(r.nextName)}</strong>${r.advanced?' <span class="badge adv">进阶挑战</span>':''}</p>
              <p class="body">${recommendText(r)}</p>
              <div class="footer-note">已写入 localStorage。下次进入正式训练，会优先按这个推荐难度开始。</div>
            </div>
          </div>
        </div>
      `);
    }

    function recommendText(r){
      if(r.nextLevel > r.level) return '这轮很顺手，下轮可以多一点变化。';
      if(r.nextLevel < r.level) return '下轮换一组更顺手的水果单，目标仍会一直显示。';
      return '保持这个节奏继续训练。';
    }

    function handlePracticeFruit(){
      const task = practiceTasks[state.practiceIndex];
      state.practiceClicked++;
      if(state.practiceClicked >= task.answer){
        completePracticeTask();
      }else{
        playFeedback(`已经找到 ${state.practiceClicked}/${task.answer} 个`);
      }
    }

    function completePracticeTask(){
      playFeedback('装好啦！');
      window.setTimeout(()=>{
        state.practiceIndex++;
        state.practiceClicked = 0;
        if(state.practiceIndex >= practiceTasks.length){
          setScreen('ready');
        }else{
          render();
        }
      },780);
    }

    function handlePracticeChoice(value){
      const task = practiceTasks[state.practiceIndex];
      const v = /^\d+$/.test(String(value)) ? Number(value) : value;
      if(v === task.answer){
        completePracticeTask();
      }else{
        playFeedback('再看一眼目标卡，慢慢来');
      }
    }

    function handleTrainingFruit(){
      const tr = state.training;
      const task = tr.currentTask;
      tr.clicked++;
      if(tr.clicked >= task.answer){
        handleTrainingCorrect();
      }else{
        state.feedback = `已经找到 ${tr.clicked}/${task.answer} 个`;
        render();
        window.setTimeout(()=>{ state.feedback=''; render(); },500);
      }
    }

    function handleTrainingChoice(value){
      const tr = state.training;
      const task = tr.currentTask;
      const v = /^\d+$/.test(String(value)) ? Number(value) : value;
      tr.attempts++;
      if(v === task.answer){
        handleTrainingCorrect();
      }else{
        tr.wrong++;
        state.feedback = '再看一眼目标卡';
        render();
        window.setTimeout(()=>{ state.feedback=''; render(); },650);
      }
    }

    function handleTrainingCorrect(){
      const tr = state.training;
      const rt = Date.now() - tr.taskStartedAt;
      tr.reactionTimes.push(rt);
      tr.correct++;
      tr.attempts++;
      tr.stars += levelDefs[tr.level].advanced ? 2 : 1;
      state.feedback = pick(['装好啦！','星星算盘亮起来了！','这篮水果正合适！']);
      render();
      window.setTimeout(()=>{
        state.feedback='';
        tr.taskIndex++;
        nextTrainingTask();
        render();
      },720);
    }

    function showHint(){
      if(!state.training) return;
      state.training.hintUsed++;
      state.feedback = state.training.currentTask.hint || '先看目标卡，再数一数。';
      render();
      window.setTimeout(()=>{ state.feedback=''; render(); },1500);
    }

    function handleAction(action, target){
      if(action === 'home') setScreen('home');
      if(action === 'detail') setScreen('detail');
      if(action === 'cover') setScreen('cover', {paused:false});
      if(action === 'toggleLow'){ state.lowStim=!state.lowStim; render(); }
      if(action === 'clearRecord'){ localStorage.removeItem(storageKey); state.selectedDifficulty=1; playFeedback('记录已清除'); setTimeout(()=>setScreen('home'),400); }
      if(action === 'tutorial'){ state.tutorialStep=0; setScreen('tutorial'); }
      if(action === 'tutorialRestart'){ state.tutorialStep=0; state.practiceIndex=0; state.practiceClicked=0; setScreen('tutorial', {paused:false}); }
      if(action === 'tutorialWrong'){ playFeedback('再看一眼目标卡'); }
      if(action === 'tutorialNext'){
        if(state.tutorialStep < 5){ state.tutorialStep++; render(); }
      }
      if(action === 'practiceStart'){ state.practiceIndex=0; state.practiceClicked=0; setScreen('practice'); }
      if(action === 'practiceFruit') handlePracticeFruit();
      if(action === 'practiceChoice') handlePracticeChoice(target.dataset.value);
      if(action === 'trainingStart') startTraining(loadProgress().nextLevel || 1);
      if(action === 'trainingStartRecommended') startTraining(loadProgress().nextLevel || state.selectedDifficulty || 1);
      if(action === 'trainingStartSame') startTraining(state.result?.level || state.training?.level || 1);
      if(action === 'trainingFruit') handleTrainingFruit();
      if(action === 'trainingChoice') handleTrainingChoice(target.dataset.value);
      if(action === 'hint') showHint();
      if(action === 'pause'){ state.paused=true; render(); }
      if(action === 'resume'){ state.paused=false; render(); startTimer(); }
    }

    app.addEventListener('click', function(e){
      const el = e.target.closest('[data-action]');
      if(!el) return;
      const action = el.getAttribute('data-action');
      handleAction(action, el);
    });

    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && state.screen === 'training'){
        state.paused = !state.paused;
        render();
      }
    });

    // 预加载并报告缺失，确保无 404 时页面正常
    Object.values(A.fruits).concat([
      A.lobby,A.detail,A.cover,A.scene,A.lowScene,A.training,A.practice,A.ready,A.result,
      A.squirrel,A.abacus,A.hand,A.success,A.hint,A.badge
    ]).concat(A.tutorial).forEach(src=>{
      const im = new Image();
      im.onerror = ()=>console.warn('资源缺失：', src);
      im.src = src;
    });

    render();
  })();
  </script>
  <script src="../shared/unified.js"></script>
</body>
</html>
