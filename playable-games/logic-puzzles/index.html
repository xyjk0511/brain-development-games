<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>森林小侦探｜简单逻辑谜题</title>
  <style>
    :root{
      --cream:#fff7e8;
      --cream-2:#fffdf5;
      --sky:#cfeeff;
      --mint:#cdeedc;
      --mint-strong:#75bd68;
      --warm:#ffd986;
      --coral:#ff9f8a;
      --lav:#d9ccff;
      --wood:#8a5a2b;
      --text:#3a3128;
      --soft:#675d52;
      --card:rgba(255,255,246,.94);
      --line:#9ed37a;
      --shadow:0 18px 50px rgba(77,58,28,.18);
      --shadow-soft:0 8px 22px rgba(77,58,28,.12);
      --radius:28px;
      --radius-lg:36px;
      --max:1120px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;color:var(--text);background:linear-gradient(135deg,#fff8e8,#e8f7df 50%,#dff5ff);}
    button,input{font:inherit}
    button{border:0;cursor:pointer}
    button:focus-visible,.item-btn:focus-visible,.basket:focus-visible{outline:4px solid #4b92ff;outline-offset:4px}
    #app{min-height:100vh;}
    .screen{min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
    .screen-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.92);opacity:.5;transform:scale(1.04);}
    .screen-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,247,232,.88),rgba(255,255,255,.68),rgba(229,248,229,.82));}
    .low .screen-bg{filter:saturate(.55) brightness(1.1);opacity:.36}
    .wrap{width:min(var(--max),100%);position:relative;z-index:2;}
    .home-grid{display:grid;grid-template-columns:1fr .92fr;gap:28px;align-items:stretch;}
    .hero-card,.panel,.modal-card{background:var(--card);border:3px solid rgba(117,189,104,.38);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;}
    .hero-card{min-height:610px;display:flex;flex-direction:column;}
    .cover-img{width:100%;height:310px;object-fit:cover;display:block;}
    .hero-body{padding:26px 28px 30px;display:flex;flex-direction:column;gap:16px;flex:1;}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;background:#eaf8d8;border:2px solid #8bd074;color:#366431;border-radius:999px;padding:8px 14px;font-weight:800;font-size:16px;align-self:flex-start;}
    h1,h2,h3,p{margin:0}
    h1{font-size:clamp(36px,5vw,64px);line-height:1.05;color:#683e1e;letter-spacing:.02em;}
    h2{font-size:clamp(28px,4vw,42px);line-height:1.16;color:#5a3c25;}
    h3{font-size:24px;color:#5a3c25;}
    p{font-size:20px;line-height:1.65;color:var(--soft);}
    .large-text{font-size:22px;line-height:1.68}
    .small{font-size:16px;color:#746b61;line-height:1.5}
    .tag-row{display:flex;flex-wrap:wrap;gap:10px;}
    .tag{background:#fff;border:2px solid #d8ebc3;border-radius:999px;padding:8px 12px;font-weight:800;color:#48663d;}
    .actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:auto;align-items:center;}
    .btn{min-height:60px;border-radius:22px;padding:0 24px;font-weight:900;font-size:20px;box-shadow:var(--shadow-soft);display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .16s ease, filter .16s ease;}
    .btn:hover{transform:translateY(-2px)}
    .btn.primary{background:linear-gradient(180deg,#ffe28f,#ffc567);color:#5d390e;border:3px solid #f2b750;}
    .btn.secondary{background:#e2f4ff;color:#1c5c7d;border:3px solid #aedff5;}
    .btn.green{background:#dff4c7;color:#335f2d;border:3px solid #9bd57f;}
    .btn.ghost{background:#fffdf7;color:#5a4936;border:3px solid #ead8b2;}
    .btn.dangerless{background:#f2eaff;color:#54427d;border:3px solid #d2c0ff;}
    .side-panel{padding:28px;display:flex;flex-direction:column;gap:18px;}
    .info-box{background:#fffdf8;border:3px solid #cfe9b7;border-radius:24px;padding:20px;box-shadow:var(--shadow-soft);}
    .info-box h3{display:inline-flex;background:#72bd63;color:#fff;border-radius:18px;padding:8px 14px;margin-bottom:12px;}
    .info-box.coral{border-color:#ffc3b9}.info-box.coral h3{background:#ff9285}
    .list{display:grid;gap:12px;margin-top:8px}
    .list div{font-size:19px;line-height:1.45;padding-left:36px;position:relative;}
    .list div::before{content:"";width:20px;height:20px;border-radius:50%;background:#ffd986;border:3px solid #d9a14d;position:absolute;left:2px;top:5px;}
    .detail-layout{display:grid;grid-template-columns:.82fr 1.1fr;gap:26px;align-items:stretch;}
    .detail-img{width:100%;height:100%;min-height:520px;object-fit:cover;border-radius:32px;box-shadow:var(--shadow-soft);}
    .detail-content{padding:30px;display:flex;flex-direction:column;gap:18px;}
    .cover-page{min-height:720px;border-radius:42px;box-shadow:var(--shadow);overflow:hidden;position:relative;background:#fff;display:flex;align-items:flex-end;}
    .cover-page img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
    .cover-overlay{position:relative;z-index:2;width:100%;padding:40px;background:linear-gradient(0deg,rgba(255,247,232,.96),rgba(255,247,232,.72),rgba(255,247,232,0));display:grid;gap:14px;}
    .cover-title{font-size:clamp(42px,7vw,76px);color:#663b1d;text-shadow:0 2px 0 #fff;}
    .tutorial-card{position:relative;width:min(1180px,100%);min-height:720px;border-radius:42px;box-shadow:var(--shadow);overflow:hidden;background:#fff;}
    .tutorial-card .t-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.92);}
    .tutorial-layer{position:relative;z-index:2;min-height:720px;padding:24px;display:grid;grid-template-columns:310px 1fr;gap:18px;align-items:stretch;background:linear-gradient(90deg,rgba(255,247,232,.92),rgba(255,247,232,.55) 55%,rgba(255,247,232,.18));}
    .speech{background:rgba(255,255,248,.94);border:3px solid #a8d77f;border-radius:28px;padding:20px;box-shadow:var(--shadow-soft);display:flex;flex-direction:column;gap:14px;align-self:start;}
    .stage-demo{position:relative;min-height:640px;border-radius:32px;border:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.18);overflow:hidden;}
    .floating-card{position:absolute;left:22px;top:22px;width:280px;background:rgba(255,253,246,.96);border:3px solid #90c76c;border-radius:24px;padding:16px;box-shadow:var(--shadow-soft);}
    .floating-card strong{font-size:21px;display:block;margin-bottom:8px;color:#5f3a21}
    .stickers{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .sticker{display:inline-flex;align-items:center;justify-content:center;min-height:38px;border-radius:14px;background:#fff;border:2px solid #d8e9c6;padding:5px 10px;font-weight:900;color:#4d5f3b;box-shadow:0 4px 10px rgba(0,0,0,.06);}
    .sticker.red{background:#ffe6e2;border-color:#ffaaa0;color:#8c372c}.sticker.blue{background:#e1f3ff;border-color:#95d7f5;color:#225f7a}.sticker.yellow{background:#fff1be;border-color:#f0ce67;color:#73551a}.sticker.green{background:#e4f7d2;border-color:#9bd57f;color:#346034}.sticker.purple{background:#efe7ff;border-color:#c9b5ff;color:#54427d}.sticker.orange{background:#ffe8cf;border-color:#ffbd7b;color:#7b431c}
    .demo-shelf,.shelf{background:rgba(115,70,30,.82);border:5px solid #a56e35;border-radius:28px;padding:20px;box-shadow:var(--shadow);display:grid;gap:16px;align-content:center;}
    .demo-shelf{position:absolute;right:35px;bottom:70px;width:min(570px,55%);grid-template-columns:repeat(3,1fr);}
    .shelf{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));min-height:340px;}
    .item-btn{background:linear-gradient(180deg,#fff9e9,#ffeec6);border:4px solid transparent;border-radius:24px;min-height:138px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 7px 0 rgba(122,75,31,.28),0 14px 24px rgba(76,45,20,.13);position:relative;transition:transform .15s ease,border-color .15s ease,filter .15s ease;}
    .item-btn:hover{transform:translateY(-3px)}
    .item-btn img{width:74px;height:74px;object-fit:cover;border-radius:18px;}
    .item-btn .name{font-size:18px;font-weight:900;color:#51351e;text-align:center;}
    .item-btn .mini{font-size:13px;color:#776a5d;font-weight:700;}
    .item-btn.correct-glow{border-color:#8bd074;box-shadow:0 0 0 6px rgba(139,208,116,.25),0 7px 0 rgba(122,75,31,.25)}
    .item-btn.selected{border-color:#4b92ff;box-shadow:0 0 0 6px rgba(75,146,255,.2),0 7px 0 rgba(122,75,31,.25)}
    .item-btn.used{opacity:.5;filter:saturate(.7)}
    .hand{position:absolute;width:86px;height:86px;border-radius:24px;box-shadow:var(--shadow-soft);animation:tap 1.1s ease-in-out infinite;z-index:4;}
    .success-pop{position:absolute;right:36px;top:48px;width:118px;height:118px;border-radius:28px;animation:pop .55s ease both;z-index:5;box-shadow:var(--shadow-soft);}
    .plus-one{position:absolute;right:50px;top:168px;font-size:42px;font-weight:1000;color:#7b5b16;background:#fff8d6;border:3px solid #ffd86c;border-radius:999px;padding:8px 18px;box-shadow:var(--shadow-soft);animation:pop .55s ease both;}
    .ready-modal{width:min(620px,100%);background:rgba(255,253,246,.97);border:4px solid #a9d982;border-radius:38px;padding:32px;box-shadow:var(--shadow);display:grid;gap:18px;text-align:center;}
    .game-shell{position:relative;width:min(1180px,100%);min-height:720px;border-radius:42px;box-shadow:var(--shadow);overflow:hidden;background:#eaf7da;}
    .game-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9);}
    .game-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,247,232,.8),rgba(255,247,232,.32));}
    .hud{position:relative;z-index:3;padding:16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;}
    .hud-left,.hud-right{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .pill{background:rgba(255,255,248,.95);border:3px solid #b8dc96;border-radius:999px;min-height:48px;padding:8px 15px;font-size:18px;font-weight:900;color:#4e3b23;box-shadow:var(--shadow-soft);display:flex;align-items:center;gap:8px;}
    .pause-btn{width:54px;height:54px;border-radius:18px;background:#dff4ff;border:3px solid #9fd8f1;color:#185a76;font-weight:1000;font-size:22px;box-shadow:var(--shadow-soft);}
    .training-main{position:relative;z-index:2;padding:0 22px 24px;display:grid;grid-template-columns:310px 1fr;gap:20px;min-height:610px;}
    .target-panel{background:rgba(255,253,246,.96);border:4px solid #9dd278;border-radius:30px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-height:240px;align-self:start;position:sticky;top:16px;}
    .target-title{font-size:22px;font-weight:1000;color:#5c3c20;}
    .target-text{font-size:24px;font-weight:1000;line-height:1.35;color:#4b3926;}
    .target-note{font-size:17px;color:#685f55;line-height:1.5;}
    .character-row{display:flex;align-items:flex-end;gap:8px;margin-top:auto;}
    .character-row img{width:108px;height:108px;object-fit:cover;border-radius:24px;box-shadow:var(--shadow-soft);}
    .play-area{background:rgba(255,253,246,.70);border:3px solid rgba(255,255,255,.75);border-radius:34px;padding:20px;display:flex;flex-direction:column;gap:16px;position:relative;}
    .round-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
    .round-title h3{font-size:24px;color:#4c321b;}
    .feedback{min-height:58px;background:rgba(255,255,248,.92);border:3px solid #e7d6b4;border-radius:22px;padding:12px 16px;font-size:20px;font-weight:900;color:#5d4427;display:flex;align-items:center;gap:12px;}
    .feedback.good{border-color:#a7d87f;background:#f0ffe6}.feedback.hint{border-color:#ffd58e;background:#fff8e5}
    .feedback img{width:48px;height:48px;object-fit:cover;border-radius:14px;}
    .bottom-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:auto;}
    .basket-row{display:grid;grid-template-columns:repeat(2,minmax(140px,1fr));gap:14px;}
    .basket{min-height:120px;border-radius:28px;border:4px solid #bfdc9b;background:linear-gradient(180deg,#fffdf6,#e9f8d8);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:24px;font-weight:1000;color:#55381e;box-shadow:var(--shadow-soft);}
    .basket.red-basket{border-color:#ffaaa0;background:#ffe8e3}.basket.blue-basket{border-color:#9bd7f4;background:#e2f4ff}
    .order-strip{min-height:110px;border-radius:28px;background:#fffdf7;border:4px dashed #c7a679;display:flex;gap:12px;padding:14px;align-items:center;}
    .order-chip{min-width:80px;min-height:76px;border-radius:20px;background:#eaf8d8;border:3px solid #a7d87f;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;text-align:center;}
    .countdown{font-size:110px;font-weight:1000;color:#70431f;text-shadow:0 5px 0 #fff;}
    .result-grid{display:grid;grid-template-columns:.75fr 1fr;gap:24px;align-items:stretch;}
    .result-card{padding:30px;display:grid;gap:18px;}
    .badge-img{width:180px;height:180px;object-fit:cover;border-radius:42px;box-shadow:var(--shadow-soft);justify-self:center;}
    .metric-grid{display:grid;grid-template-columns:repeat(2,minmax(160px,1fr));gap:14px;}
    .metric{background:#fffdf8;border:3px solid #e3d7b8;border-radius:22px;padding:14px;}
    .metric b{display:block;font-size:30px;color:#603b1d}.metric span{font-size:16px;color:#685f55;font-weight:800}
    .preload{display:none!important;width:0;height:0;overflow:hidden;}
    .toast-note{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:6;background:#fffdf6;border:3px solid #acd984;border-radius:999px;padding:12px 18px;font-size:18px;font-weight:900;box-shadow:var(--shadow-soft);}
    @keyframes pop{0%{transform:scale(.65);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes tap{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(10px) scale(.92)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.btn:hover,.item-btn:hover{transform:none}}
    .low *{animation:none!important;transition:none!important}.low .success-pop,.low .hand{animation:none!important}
    @media (max-width:860px){.screen{padding:14px}.home-grid,.detail-layout,.tutorial-layer,.training-main,.result-grid{grid-template-columns:1fr}.hero-card{min-height:auto}.cover-img{height:240px}.detail-img{min-height:260px}.tutorial-card,.tutorial-layer,.game-shell{min-height:auto}.stage-demo{min-height:430px}.demo-shelf{width:calc(100% - 40px);left:20px;right:20px;bottom:30px}.training-main{padding:0 14px 18px}.hud{grid-template-columns:1fr}.hud-right{justify-content:flex-start}.target-panel{position:relative;top:auto}.metric-grid{grid-template-columns:1fr}h1{font-size:42px}.cover-title{font-size:46px}}
  </style>
  <link rel="stylesheet" href="../shared/unified.css">
</head>
<body>
  <div id="app"></div>
  <script>
    const ASSETS = {
      lobby:"assets/lobby-card-cover.png",
      detail:"assets/detail-modal-cover.png",
      cover:"assets/game-cover-poster.png",
      t1:"assets/tutorial-scene-1.png",
      t2:"assets/tutorial-scene-2.png",
      t3:"assets/tutorial-scene-3.png",
      t4:"assets/tutorial-scene-4.png",
      t5:"assets/tutorial-scene-5.png",
      t6:"assets/tutorial-scene-6.png",
      scene:"assets/scene-background.png",
      lowScene:"assets/low-stimulation-background.png",
      squirrel:"assets/main-character-squirrel.png",
      bear:"assets/shelf-bear.png",
      targetCard:"assets/target-card.png",
      success:"assets/success-sticker.png",
      hint:"assets/gentle-hint-sticker.png",
      badge:"assets/result-badge.png",
      hand:"assets/tutorial-hand.png",
      icons:"assets/button-icons.png",
      master:"assets/gptimage2-master.png"
    };
    const ITEM_IMAGES = {
      apple:"assets/item-red-apple.png",
      carrot:"assets/item-orange-carrot.png",
      milk:"assets/item-blue-milk.png",
      ball:"assets/item-rainbow-ball.png",
      yarn:"assets/item-purple-yarn.png",
      gift:"assets/item-gift-box.png",
      cheese:"assets/item-yellow-cheese.png",
      cookie:"assets/item-red-cookie.png",
      box:"assets/item-blue-box.png",
      token:"assets/item-green-token.png"
    };
    const PRELOAD = [...Object.values(ASSETS), ...Object.values(ITEM_IMAGES)];
    const app = document.getElementById("app");
    const KEY_NEXT = "forestDetective.nextLevel";
    const KEY_LAST = "forestDetective.lastResult";
    const KEY_HISTORY = "forestDetective.history";
    const KEY_LOW = "forestDetective.lowStim";
    const colorLabel = {red:"红色",blue:"蓝色",yellow:"黄色",green:"绿色",purple:"紫色",orange:"橙色"};
    const shapeLabel = {circle:"圆形",square:"方形",triangle:"三角形",long:"长条形"};
    const categoryLabel = {fruit:"水果",snack:"点心",box:"盒子",toy:"玩具",drink:"饮品",veg:"蔬果"};
    const items = [
      {id:"apple",name:"红苹果",color:"red",shape:"circle",category:"fruit",size:2,img:ITEM_IMAGES.apple},
      {id:"carrot",name:"橙胡萝卜",color:"orange",shape:"long",category:"veg",size:3,img:ITEM_IMAGES.carrot},
      {id:"milk",name:"蓝牛奶",color:"blue",shape:"square",category:"drink",size:4,img:ITEM_IMAGES.milk},
      {id:"ball",name:"彩圆球",color:"blue",shape:"circle",category:"toy",size:5,img:ITEM_IMAGES.ball},
      {id:"yarn",name:"紫线团",color:"purple",shape:"circle",category:"toy",size:2,img:ITEM_IMAGES.yarn},
      {id:"gift",name:"紫礼盒",color:"purple",shape:"square",category:"box",size:3,img:ITEM_IMAGES.gift},
      {id:"cheese",name:"黄奶酪",color:"yellow",shape:"triangle",category:"snack",size:2,img:ITEM_IMAGES.cheese},
      {id:"cookie",name:"红圆饼",color:"red",shape:"circle",category:"snack",size:1,img:ITEM_IMAGES.cookie},
      {id:"box",name:"蓝方盒",color:"blue",shape:"square",category:"box",size:1,img:ITEM_IMAGES.box},
      {id:"token",name:"绿叶牌",color:"green",shape:"circle",category:"snack",size:1,img:ITEM_IMAGES.token}
    ];
    const levels = {
      1:{seconds:90,rounds:6,pass:3,candidates:2,autoHint:4,mode:"pick",rule:"color",points:10},
      2:{seconds:90,rounds:7,pass:4,candidates:2,autoHint:4,mode:"pick",rule:"shape",points:10},
      3:{seconds:100,rounds:8,pass:5,candidates:3,autoHint:5,mode:"pick",rule:"category",points:10},
      4:{seconds:90,rounds:8,pass:5,candidates:3,autoHint:6,mode:"pick",rule:"colorShape",points:12},
      5:{seconds:90,rounds:9,pass:6,candidates:4,autoHint:7,mode:"pick",rule:"colorCategory",points:12},
      6:{seconds:100,rounds:8,pass:5,candidates:3,autoHint:7,mode:"order",rule:"sizeOrder",points:14},
      7:{seconds:90,rounds:10,pass:7,candidates:4,autoHint:8,mode:"pick",rule:"exclude",points:14},
      8:{seconds:85,rounds:10,pass:7,candidates:5,autoHint:8,mode:"basket",rule:"basket",points:15},
      9:{seconds:85,rounds:10,pass:7,candidates:4,autoHint:9,mode:"order",rule:"sizeOrder",points:16},
      10:{seconds:80,rounds:12,pass:8,candidates:5,autoHint:10,mode:"mixed",rule:"mixed",points:18}
    };
    const state = {
      screen:"home",
      tutorialStep:1,
      lowStim: localStorage.getItem(KEY_LOW)==="1",
      hasPracticed:false,
      readyMode:"practice",
      level: clampLevel(Number(localStorage.getItem(KEY_NEXT)) || 1),
      feedback:null,
      hintActive:false,
      selectedItem:null,
      selectedOrder:[],
      countdown:3,
      session:null,
      currentPuzzle:null,
      practice:{index:0,correct:0,miss:0},
      lastRecommendation: clampLevel(Number(localStorage.getItem(KEY_NEXT)) || 1)
    };
    let gameTimer=null, countTimer=null, autoHintTimer=null, feedbackTimer=null;
    function clampLevel(n){return Math.max(1,Math.min(10,Number.isFinite(n)?Math.round(n):1));}
    function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function choice(arr){return arr[Math.floor(Math.random()*arr.length)];}
    function formatLevel(n){return n>=7?`进阶挑战 第 ${n} 级`:`第 ${n} 级`}
    function preloadHtml(){return `<div class="preload" aria-hidden="true">${PRELOAD.map((src,i)=>`<img src="${src}" alt="本地素材${i+1}">`).join("")}</div>`}
    function stopAllTimers(){[gameTimer,countTimer,autoHintTimer,feedbackTimer].forEach(t=>{if(t)clearInterval(t),clearTimeout(t)});gameTimer=countTimer=autoHintTimer=feedbackTimer=null;}
    function stopRoundTimers(){if(autoHintTimer)clearTimeout(autoHintTimer);autoHintTimer=null;if(feedbackTimer)clearTimeout(feedbackTimer);feedbackTimer=null;}
    function rootClass(){return state.lowStim?"screen low":"screen";}
    function background(src){return `<div class="screen-bg" style="background-image:url('${src}')"></div>`}
    function render(){

    function matches(it,rule){
      if(rule.kind==="color")return it.color===rule.value;
      if(rule.kind==="shape")return it.shape===rule.value;
      if(rule.kind==="category")return it.category===rule.value;
      if(rule.kind==="excludeColor")return it.color!==rule.value;
      return true;
    }
    function matchesAll(it,rules){return rules.every(r=>matches(it,r));}
    function makePickPuzzle(level,ruleType,candidateCount,overrideText){
      let target=choice(items), rules=[], stickers=[], targetText="";

      if(ruleType==="shape"){target=choice(items);rules=[{kind:"shape",value:target.shape}];stickers=[shapeLabel[target.shape]];targetText=overrideText||`目标：找${shapeLabel[target.shape]}的商品`;}
      if(ruleType==="category"){target=choice(items.filter(i=>["fruit","snack","box","toy","drink","veg"].includes(i.category)));rules=[{kind:"category",value:target.category}];stickers=[categoryLabel[target.category]];targetText=overrideText||`目标：找${categoryLabel[target.category]}商品`;}
      if(ruleType==="colorShape"){target=choice(items);rules=[{kind:"color",value:target.color},{kind:"shape",value:target.shape}];stickers=[colorLabel[target.color],shapeLabel[target.shape]];targetText=`目标：找${colorLabel[target.color]} + ${shapeLabel[target.shape]}的商品`;}
      if(ruleType==="colorCategory"){target=choice(items);rules=[{kind:"color",value:target.color},{kind:"category",value:target.category}];stickers=[colorLabel[target.color],categoryLabel[target.category]];targetText=`目标：找${colorLabel[target.color]} + ${categoryLabel[target.category]}商品`;}
      if(ruleType==="exclude"){
        target=choice(items); const excludeColor=choice(Object.keys(colorLabel).filter(c=>c!==target.color));
        rules=[{kind:"shape",value:target.shape},{kind:"excludeColor",value:excludeColor}];stickers=[shapeLabel[target.shape],`不要${colorLabel[excludeColor]}`];targetText=`目标：找${shapeLabel[target.shape]}，但不要${colorLabel[excludeColor]}`;
      }
      const possibleCorrect = items.filter(it=>matchesAll(it,rules));
      target = possibleCorrect.includes(target)?target:possibleCorrect[0];
      const distractors = shuffle(items.filter(it=>it.id!==target.id && !matchesAll(it,rules))).slice(0,Math.max(1,candidateCount-1));
      let candidates = shuffle([target,...distractors]);
      const correctIds = candidates.filter(it=>matchesAll(it,rules)).map(it=>it.id);
      if(correctIds.length!==1){return makePickPuzzle(level, ruleType==="exclude"?"colorShape":ruleType, candidateCount, overrideText);}
      return {mode:"pick",level,targetText,stickers,candidates,correctIds,hintText:hintForRules(stickers)};
    }
    function makeBasketPuzzle(level){
      const target=choice(items.filter(i=>i.category==="fruit"||i.category==="snack"||i.category==="veg"));
      const distractors=shuffle(items.filter(i=>i.id!==target.id && i.category!==target.category)).slice(0,3);
      return {mode:"basket",level,targetText:`目标：把${categoryLabel[target.category]}放进红篮`,stickers:[categoryLabel[target.category],"红篮"],candidates:shuffle([target,...distractors]),correctIds:[target.id],correctBasket:"red",hintText:`先找${categoryLabel[target.category]}，再点红篮。`};
    }
    function makeOrderPuzzle(level,count){
      const base=shuffle(items).slice(0,count);
      const ordered=[...base].sort((a,b)=>a.size-b.size || a.name.localeCompare(b.name,"zh-CN"));
      return {mode:"order",level,targetText:"目标：从小到大排好",stickers:["从小","到大"],candidates:shuffle(base),correctIds:ordered.map(i=>i.id),hintText:"先点看起来最小的，再点更大的。"};
    }
    function makePuzzle(level){
      const cfg=levels[level];
      if(cfg.mode==="mixed"){
        const pick=choice(["colorShape","colorCategory","exclude","basket","order"]);
        if(pick==="basket")return makeBasketPuzzle(level);
        if(pick==="order")return makeOrderPuzzle(level,5);
        return makePickPuzzle(level,pick,5);
      }
      if(cfg.mode==="basket")return makeBasketPuzzle(level);
      if(cfg.mode==="order")return makeOrderPuzzle(level,cfg.candidates);
      return makePickPuzzle(level,cfg.rule,cfg.candidates);
    }
    function hintForRules(stickers){return stickers.length>1?`可以先看“${stickers[0]}”，再看“${stickers[1]}”。`:`先找和“${stickers[0]}”一样的商品。`;}
    function newRound(){
      stopRoundTimers(); state.feedback=null; state.hintActive=false; state.selectedItem=null; state.selectedOrder=[]; state.currentPuzzle=makePuzzle(state.level); state.currentPuzzle.started=Date.now(); scheduleAutoHint();
    }
    function scheduleAutoHint(){
      if(autoHintTimer)clearTimeout(autoHintTimer); const cfg=levels[state.level]||levels[1];
      autoHintTimer=setTimeout(()=>{ if(["training","practice"].includes(state.screen) && state.currentPuzzle){ state.hintActive=true; state.feedback={kind:"hint",text:"目标卡还在这里，可以照着贴纸慢慢看。"}; render(); } }, (cfg.autoHint||5)*1000);
    }
    function startPractice(){stopAllTimers(); state.screen="practice"; state.practice={index:0,correct:0,miss:0}; state.hasPracticed=true; state.readyMode="training"; state.currentPuzzle=practicePuzzles()[0]; state.currentPuzzle.started=Date.now(); state.feedback=null; state.hintActive=false; scheduleAutoHint(); render();}
    function startTrainingCountdown(){stopAllTimers(); state.level=clampLevel(Number(localStorage.getItem(KEY_NEXT)) || state.level || 1); state.countdown=3; state.screen="countdown"; render(); countTimer=setInterval(()=>{state.countdown--; if(state.countdown<=0){clearInterval(countTimer);countTimer=null; beginTraining();}else render();},1000);}
    function beginTraining(){
      const cfg=levels[state.level]; state.session={level:state.level,roundIndex:0,correct:0,miss:0,hints:0,score:0,totalResponse:0,remaining:cfg.seconds,result:null}; state.screen="training"; newRound(); render(); gameTimer=setInterval(()=>{ if(state.screen!=="training")return; state.session.remaining--; if(state.session.remaining<=0){finishSession("time");} else render();},1000);
    }
    function finishSession(reason){
      if(gameTimer)clearInterval(gameTimer); if(autoHintTimer)clearTimeout(autoHintTimer); gameTimer=autoHintTimer=null;
      const s=state.session,cfg=levels[s.level]; const accuracy = s.correct / Math.max(1,s.correct+s.miss); const avg = s.correct ? s.totalResponse/s.correct : 0; const nextLevel=decideNextLevel({level:s.level,correct:s.correct,miss:s.miss,hints:s.hints,rounds:cfg.rounds,avg,low:state.lowStim});
      const result={level:s.level,rounds:cfg.rounds,correct:s.correct,miss:s.miss,hints:s.hints,score:s.score,avg,avgText:s.correct?`${(avg/1000).toFixed(1)} 秒`:"还没有记录",accuracy,accuracyText:`${Math.round(accuracy*100)}%`,nextLevel,passed:s.correct>=cfg.pass,message:s.correct>=cfg.pass?"侦探小松鼠和货架小熊都收到了清楚的线索。":"下一轮会把线索放大一点，继续用轻松节奏整理。"};
      s.result=result; state.lastRecommendation=nextLevel; localStorage.setItem(KEY_NEXT,String(nextLevel)); localStorage.setItem(KEY_LAST,JSON.stringify(result)); const hist=readJson(KEY_HISTORY,[]); hist.push({...result,at:new Date().toISOString(),reason}); localStorage.setItem(KEY_HISTORY,JSON.stringify(hist.slice(-12))); state.screen="result"; render();
    }
    function decideNextLevel(m){
      const target={1:9000,2:8500,3:8000,4:7500,5:7000,6:7500,7:6500,8:6500,9:7000,10:6000}[m.level]||8000;
      const accuracy=m.correct/Math.max(1,m.correct+m.miss), hintRate=m.hints/Math.max(1,m.rounds); let next=m.level;
      const strong=accuracy>=.85 && hintRate<=.25 && (m.avg===0 || m.avg<=target) && m.correct>=Math.min(5,m.rounds);
      const support=accuracy<.60 || hintRate>.50 || (m.avg>0 && m.avg>target*1.8);
      if(m.level<=3){ next=strong?m.level+1:m.level; }
      else if(strong){ next=m.level+1; }
      else if(support){ next=m.level-1; }
      if(m.low && next>7) next=7;
      return clampLevel(next);
    }
    function handleCorrect(){
      const p=state.currentPuzzle; const response=Date.now()-(p.started||Date.now()); state.feedback={kind:"good",text:"找到啦，星星 +1"}; state.hintActive=false; stopRoundTimers();
      if(state.screen==="practice"){
        state.practice.correct++; render(); feedbackTimer=setTimeout(()=>{ state.practice.index++; if(state.practice.index>=3){ state.readyMode="training"; state.screen="ready"; render(); } else { state.currentPuzzle=practicePuzzles()[state.practice.index]; state.currentPuzzle.started=Date.now(); state.feedback=null; state.hintActive=false; scheduleAutoHint(); render(); }},650); return;
      }
      const s=state.session,cfg=levels[state.level]; s.correct++; s.score+=cfg.points; s.totalResponse+=response; render(); feedbackTimer=setTimeout(()=>{s.roundIndex++; if(s.roundIndex>=cfg.rounds) finishSession("rounds"); else {newRound(); render();}},650);
    }
    function handleSoftMiss(text){
      if(state.screen==="practice") state.practice.miss++; else if(state.session){state.session.miss++; if(state.level>3) state.session.score=Math.max(0,state.session.score-1);} state.feedback={kind:"hint",text:text||"这件还没有和贴纸对上，再看看目标卡。"}; render();
    }
    function readJson(key,fallback){try{return JSON.parse(localStorage.getItem(key)||"") || fallback}catch(e){return fallback}}
    function formatTime(sec){const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;}
    window.Game = {
      gotoHome(){stopAllTimers(); state.screen="home"; render();},
      gotoDetail(){stopAllTimers(); state.screen="detail"; render();},
      gotoCover(){stopAllTimers(); state.screen="cover"; render();},
      startTutorial(){stopAllTimers(); state.screen="tutorial"; state.tutorialStep=1; state.feedback=null; render();},
      nextTutorial(){ if(state.tutorialStep<6){state.tutorialStep++; render();} else {state.readyMode=state.hasPracticed?"training":"practice"; state.screen="ready"; render();}},
      enterReady(){ if(state.readyMode==="practice") startPractice(); else startTrainingCountdown();},
      gotoReadyFromPractice(){state.readyMode="training"; state.screen="ready"; render();},
      toggleLow(){state.lowStim=!state.lowStim; localStorage.setItem(KEY_LOW,state.lowStim?"1":"0"); render();},
      pause(){ if(state.screen==="training"){ if(gameTimer)clearInterval(gameTimer); if(autoHintTimer)clearTimeout(autoHintTimer); state.screen="paused"; render();}},
      resume(){ if(state.screen==="paused"){ state.screen="training"; scheduleAutoHint(); gameTimer=setInterval(()=>{ if(state.screen!=="training")return; state.session.remaining--; if(state.session.remaining<=0){finishSession("time");} else render();},1000); render();}},
      useHint(){ if(state.session)state.session.hints++; state.hintActive=true; state.feedback={kind:"hint",text:state.currentPuzzle?.hintText||"先看目标卡，再看商品。"}; render();},
      handleItem(id){
        const p=state.currentPuzzle; if(!p)return;
        if(p.mode==="basket"){ state.selectedItem=id; state.feedback={kind:"hint",text:"现在点一个篮子。"}; render(); return; }
        if(p.mode==="order"){
          if(state.selectedOrder.includes(id))return; state.selectedOrder.push(id);
          if(state.selectedOrder.length===p.correctIds.length){ const ok=state.selectedOrder.every((v,i)=>v===p.correctIds[i]); if(ok)handleCorrect(); else {state.selectedOrder=[]; handleSoftMiss("顺序还可以再调整一次。先从最小的开始。")}; } else render(); return;
        }
        if(p.correctIds.includes(id)) handleCorrect(); else handleSoftMiss();
      },
      handleBasket(bid){ const p=state.currentPuzzle; if(!p || p.mode!=="basket")return; if(!state.selectedItem){handleSoftMiss("先点一个商品，再点篮子。"); return;} const ok=p.correctIds.includes(state.selectedItem) && bid===p.correctBasket; if(ok)handleCorrect(); else handleSoftMiss("再看看：这次要把符合线索的商品放进红篮。")},
      resetOrder(){state.selectedOrder=[]; state.feedback={kind:"hint",text:"重新从第一个位置开始排。"}; render();},
      playRecommended(){stopAllTimers(); state.level=clampLevel(Number(localStorage.getItem(KEY_NEXT))||state.lastRecommendation||1); state.readyMode="training"; startTrainingCountdown();},
      gotoRecommendation(){state.screen="recommendation"; render();}
    };
    render();
  </script>
  <script src="../shared/unified.js"></script>
