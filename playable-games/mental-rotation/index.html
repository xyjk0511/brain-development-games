<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>转转积木伙伴｜心理旋转训练</title>
  <style>
    :root{
      --cream:#fff8e8;
      --paper:#fffdf5;
      --sky:#dff3ff;
      --mint:#bfead2;
      --yellow:#ffd66e;
      --orange:#ff9b6b;
      --coral:#f26b62;
      --purple:#b79be9;
      --blue:#4d9fe8;
      --deep:#255076;
      --soft:#6a7890;
      --line:#8bc4eb;
      --shadow:0 18px 48px rgba(44,83,112,.18);
      --radius:26px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--deep);background:#eaf8ff;}
    body{background-image:linear-gradient(180deg,rgba(234,248,255,.92),rgba(255,249,229,.95)),url("assets/playground-bg.png");background-size:cover;background-position:center;background-attachment:fixed;}
    button{font:inherit;border:0;cursor:pointer;color:inherit}
    button:focus-visible{outline:4px solid rgba(77,159,232,.5);outline-offset:3px}
    img{max-width:100%;display:block}
    .app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
    .screen{width:min(1120px,100%);min-height:min(760px,calc(100vh - 44px));position:relative;background:rgba(255,253,245,.84);border:2px solid rgba(139,196,235,.75);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(6px)}
    .screen::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 10%,rgba(255,214,110,.35),transparent 28%),radial-gradient(circle at 95% 5%,rgba(183,155,233,.25),transparent 22%);pointer-events:none}
    .content{position:relative;z-index:1;padding:28px}
    .row{display:flex;gap:20px;align-items:center}.col{display:flex;flex-direction:column;gap:16px}.between{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .card{background:rgba(255,253,245,.92);border:2px solid rgba(139,196,235,.9);border-radius:var(--radius);box-shadow:0 10px 24px rgba(44,83,112,.12);padding:18px}.soft-card{background:rgba(255,255,255,.74);border:1.5px solid rgba(139,196,235,.62);border-radius:22px;padding:16px}.title{font-size:clamp(34px,5vw,58px);line-height:1.02;margin:0;color:#2b6da8;letter-spacing:.04em;text-shadow:0 3px 0 rgba(255,255,255,.8)}
    .subtitle{font-size:clamp(18px,2.6vw,26px);line-height:1.45;margin:10px 0 0;color:#41627d}.section-title{font-size:26px;margin:0 0 10px;color:#1f629b}.small{font-size:14px;color:#576a80}.tiny{font-size:13px;color:#667889}.badge{display:inline-flex;align-items:center;gap:8px;background:#fff4ce;border:2px solid #ffd66e;border-radius:999px;padding:8px 14px;font-weight:800;color:#8b5a00}.badge.blue{background:#e8f5ff;border-color:#8bc4eb;color:#245981}.badge.green{background:#e8fff2;border-color:#9cddb6;color:#2b6c43}.badge.purple{background:#f1edff;border-color:#c9b8ff;color:#6250a6}.asset-note{position:absolute;left:24px;bottom:12px;z-index:3;font-size:12px;color:#536c7f;background:rgba(255,255,255,.66);border:1px solid rgba(139,196,235,.5);border-radius:999px;padding:5px 10px}.primary,.secondary,.danger,.ghost{border-radius:18px;padding:14px 24px;min-height:54px;font-weight:900;font-size:20px;box-shadow:0 7px 0 rgba(37,80,118,.12);transition:transform .08s ease,filter .15s ease}.primary{background:linear-gradient(#65d37d,#39a957);color:white;border:2px solid rgba(28,118,54,.25)}.secondary{background:linear-gradient(#67b7fa,#2c8adf);color:white;border:2px solid rgba(35,111,173,.25)}.danger{background:linear-gradient(#ff8a7d,#e85f56);color:white;border:2px solid rgba(169,58,51,.25)}.ghost{background:#fff;border:2px solid rgba(139,196,235,.9);color:#2b6da8}.primary:hover,.secondary:hover,.danger:hover,.ghost:hover{filter:brightness(1.03);transform:translateY(-1px)}.primary:disabled,.secondary:disabled,.danger:disabled,.ghost:disabled{opacity:.6;cursor:default;transform:none}.home-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:stretch}.hero-img{border-radius:24px;border:2px solid rgba(139,196,235,.8);height:350px;width:100%;object-fit:cover}.info-line{display:grid;gap:10px;margin-top:16px}.info-line p{margin:0;font-size:18px;line-height:1.55}.top-strip{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.source-box{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}.source-box img{border-radius:16px;border:1px solid rgba(139,196,235,.8);height:76px;object-fit:cover}.two-col{display:grid;grid-template-columns:.82fr 1.18fr;gap:22px}.detail-art{border-radius:24px;border:2px solid rgba(139,196,235,.8);height:520px;object-fit:cover;width:100%}.cover-art{border-radius:28px;border:2px solid rgba(139,196,235,.82);height:440px;width:100%;object-fit:cover}.cover-layout{display:grid;grid-template-columns:.95fr 1.05fr;gap:22px;align-items:center}.floating-star{position:absolute;width:68px;right:30px;top:28px;animation:floaty 3s ease-in-out infinite}.stage{position:relative;background:rgba(255,251,236,.68);border:2px solid rgba(139,196,235,.75);border-radius:28px;min-height:440px;padding:18px;overflow:hidden}.stage-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.34;filter:saturate(.9);z-index:0}.stage-content{position:relative;z-index:1;display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:stretch}.target-panel{background:rgba(255,253,245,.92);border:3px solid #ffd66e;border-radius:24px;padding:14px;text-align:center;box-shadow:0 8px 18px rgba(88,70,20,.12)}.target-panel h3{margin:0 0 10px;font-size:22px;color:#a05a00}.platform{position:relative;background:radial-gradient(ellipse at center,#ffe0a1,#f5b767 55%,#9cc8e5 58%,#77b2db 72%,transparent 73%);border-radius:50%;height:270px;display:flex;align-items:center;justify-content:center;margin:auto;max-width:430px}.platform::after{content:"↻";position:absolute;right:34px;top:26px;color:rgba(43,109,168,.6);font-size:36px;font-weight:900}.choice-bar{display:flex;gap:18px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}.buddy-board{position:relative;width:210px;height:210px;margin:auto}.buddy-cell{position:absolute;width:48px;height:48px;border-radius:13px;box-shadow:inset 0 2px 5px rgba(255,255,255,.55),0 7px 0 rgba(37,80,118,.13);border:2px solid rgba(255,255,255,.72)}.buddy-cell.sky{background:#55aee8}.buddy-cell.mint{background:#65bf74}.buddy-cell.yellow{background:#ffd458}.buddy-cell.coral{background:#f26b62}.buddy-cell.purple{background:#9b83da}.buddy-cell.orange{background:#f89d4b}.sticker{position:absolute;width:27px;height:27px;right:-7px;top:-8px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(90,70,20,.18));animation:pulseSoft 1.8s ease-in-out infinite}.face{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;color:#5c3b08;font-size:22px}.rotation-anim{animation:rotateIn .85s ease-out}.tutorial-text{font-size:23px;line-height:1.5;margin:0}.tutorial-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.step-dots{display:flex;gap:7px}.dot{width:14px;height:14px;border-radius:50%;background:#cfe3f2}.dot.active{background:#42a4e8}.hand{position:absolute;width:98px;right:20%;bottom:78px;z-index:5;animation:tap 1.1s ease-in-out infinite}.feedback{min-height:32px;text-align:center;font-weight:900;font-size:20px;color:#2b6da8;margin-top:10px}.hud{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.hud-left,.hud-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hud-pill{background:rgba(255,255,255,.9);border:2px solid rgba(139,196,235,.8);border-radius:999px;padding:8px 12px;font-weight:900}.game-grid{display:grid;grid-template-columns:250px 1fr;gap:18px}.question{font-size:24px;text-align:center;font-weight:900;margin:0 0 10px;color:#2b6da8}.timer-warn{background:#fff1dd;border-color:#ffbc80}.pause-layer,.modal-layer{position:absolute;inset:0;background:rgba(36,66,96,.55);z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.modal-box{width:min(560px,92vw);background:#fffdf5;border:3px solid #ffd66e;border-radius:30px;box-shadow:0 24px 60px rgba(20,45,70,.28);padding:24px;text-align:center}.modal-box img{height:160px;margin:0 auto 12px;border-radius:22px;border:2px solid rgba(139,196,235,.8);object-fit:cover}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.metric{font-size:22px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed rgba(37,80,118,.18);padding:10px 0}.metric b{color:#2b6da8}.record-list{max-height:190px;overflow:auto}.record-item{display:flex;justify-content:space-between;gap:12px;border:1px solid rgba(139,196,235,.5);background:rgba(255,255,255,.7);border-radius:14px;padding:8px 10px;margin:8px 0;font-size:14px}.advanced{color:#b24d24;font-weight:900}.sr-small{font-size:12px;color:#6a7890}.source-collage-link{display:inline-flex;align-items:center;gap:8px;margin-top:8px;color:#2b6da8;font-weight:800}.source-collage-link img{width:86px;height:58px;object-fit:cover;border-radius:12px;border:1px solid rgba(139,196,235,.8)}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulseSoft{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes rotateIn{from{transform:rotate(-35deg) scale(.9)}to{transform:rotate(0) scale(1)}}@keyframes tap{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(12px) scale(.94)}}@media (max-width:840px){.app{padding:10px}.screen{min-height:calc(100vh - 20px);border-radius:22px}.content{padding:18px}.home-grid,.two-col,.cover-layout,.stage-content,.game-grid,.result-grid{grid-template-columns:1fr}.hero-img,.cover-art,.detail-art{height:240px}.platform{height:230px}.choice-bar button{width:100%}.hud{align-items:flex-start;flex-direction:column}.target-panel{max-width:360px;margin:auto}.asset-note{position:relative;left:auto;bottom:auto;margin:8px 18px 14px;display:inline-block}.buddy-board{width:180px;height:180px}.buddy-cell{width:42px;height:42px}}
  </style>
  <link rel="stylesheet" href="../shared/unified.css">
</head>
<body>
  <div id="app" class="app" aria-live="polite"></div>
  <script>
    'use strict';
    const ASSETS = {
      homeCard: 'assets/home-card.png',
      detailInfo: 'assets/detail-info.png',
      coverPoster: 'assets/cover-poster.png',
      tutorialStrip: 'assets/tutorial-strip.png',
      practiceBg: 'assets/practice-bg.png',
      readyArt: 'assets/ready-modal-art.png',
      trainingHudArt: 'assets/training-hud-art.png',
      resultCardArt: 'assets/result-card-art.png',
      recordsArt: 'assets/records-art.png',
      sourceThumb: 'assets/source-thumb.png',
      sourceCollage: 'assets/gptimage2-source-collage.png',
      characterYellow: 'assets/character-yellow.png',
      characterRed: 'assets/character-red.png',
      rotationBlocks: 'assets/rotation-blocks.png',
      handPointer: 'assets/hand-pointer.png',
      starBadge: 'assets/star-badge.png',
      playgroundBg: 'assets/playground-bg.png'
    };

    const ADAPTIVE_STORAGE_KEY = '11-mental-rotation-adaptive-v2';
    const hasAdaptive = true;
    window.hasAdaptive = true;
    window.__hasAdaptive = true;
    window.adaptiveDifficulty = {
      enabled: true,
      mechanism: 'localStorage 记录本轮表现；结算页显示本轮表现和下轮推荐难度；下轮按正确率/用时自动升降。',
      storageKey: ADAPTIVE_STORAGE_KEY
    };
    document.documentElement.setAttribute('data-has-adaptive','true');

    const LEVELS = {
      1:{name:'Lv.1 轻松挑战',tag:'非常简单',time:75,trials:6,angles:[90],sameRatio:.75,mirrorRatio:0,tip:'每题都有旋转提示，差异很明显。'},
      2:{name:'Lv.2 轻松挑战',tag:'非常简单',time:72,trials:7,angles:[90,270],sameRatio:.72,mirrorRatio:0,tip:'只看左右转，星星贴纸很大。'},
      3:{name:'Lv.3 轻松挑战',tag:'非常简单',time:70,trials:8,angles:[90,180],sameRatio:.70,mirrorRatio:0,tip:'加入半圈旋转，但没有镜像题。'},
      4:{name:'Lv.4 稳稳转身',tag:'普通',time:65,trials:9,angles:[90,180,270],sameRatio:.62,mirrorRatio:0,tip:'角度更多，干扰仍然温和。'},
      5:{name:'Lv.5 转到另一边',tag:'普通',time:62,trials:10,angles:[90,180,270],sameRatio:.58,mirrorRatio:0,tip:'贴纸位置更接近，需要看仔细。'},
      6:{name:'Lv.6 进阶挑战',tag:'进阶挑战',time:58,trials:10,angles:[90,180,270],sameRatio:.55,mirrorRatio:.18,tip:'开始出现镜像伙伴。'},
      7:{name:'Lv.7 进阶挑战',tag:'进阶挑战',time:55,trials:11,angles:[90,180,270],sameRatio:.53,mirrorRatio:.28,tip:'镜像和旋转会混合出现。'},
      8:{name:'Lv.8 进阶挑战',tag:'进阶挑战',time:52,trials:12,angles:[90,180,270],sameRatio:.52,mirrorRatio:.36,tip:'相似干扰更多。'},
      9:{name:'Lv.9 进阶挑战',tag:'进阶挑战',time:50,trials:13,angles:[90,180,270],sameRatio:.50,mirrorRatio:.44,tip:'需要同时看形状和贴纸。'},
      10:{name:'Lv.10 进阶挑战',tag:'进阶挑战',time:48,trials:14,angles:[90,180,270],sameRatio:.50,mirrorRatio:.52,tip:'高相似镜像挑战。'}
    };

    const COLORS = ['yellow','sky','mint','coral','purple','orange'];
    const BASE_SHAPES = [
      [{x:1,y:0,color:'yellow',sticker:true,face:true},{x:1,y:1,color:'sky'},{x:0,y:1,color:'mint'},{x:2,y:1,color:'coral'},{x:1,y:2,color:'purple'},{x:0,y:2,color:'orange'}],
      [{x:0,y:0,color:'coral',sticker:true,face:true},{x:1,y:0,color:'yellow'},{x:1,y:1,color:'sky'},{x:2,y:1,color:'mint'},{x:1,y:2,color:'orange'},{x:2,y:2,color:'purple'}],
      [{x:1,y:0,color:'mint',sticker:true,face:true},{x:0,y:1,color:'yellow'},{x:1,y:1,color:'sky'},{x:2,y:1,color:'coral'},{x:0,y:2,color:'purple'},{x:1,y:2,color:'orange'}],
      [{x:0,y:0,color:'sky',sticker:true,face:true},{x:0,y:1,color:'yellow'},{x:1,y:1,color:'mint'},{x:2,y:1,color:'coral'},{x:2,y:2,color:'purple'},{x:1,y:2,color:'orange'}]
    ];

    const TUTORIAL_STEPS = [
      {title:'1 / 6 欢迎来到积木游乐场',text:'今天我们帮积木小人找转身后的伙伴。先不用着急，玩法会在真实场景里演示。'},
      {title:'2 / 6 认识目标',text:'先看目标卡。星星贴纸是小线索，它会帮你认出同一个伙伴。',showTarget:true},
      {title:'3 / 6 看它转一转',text:'它只是转了个身。星星还在同一块积木上，就是同一个伙伴。',showTarget:true,showCandidate:true,answer:'same'},
      {title:'4 / 6 点击一次，星星 +1',text:'看到同一个伙伴，就点“同一个伙伴”。每发现一个伙伴点击一次。',showTarget:true,showCandidate:true,answer:'same',needClick:true},
      {title:'5 / 6 发现小变化',text:'如果星星跑到另一边，或者积木形状变了，就不是同一个伙伴。',showTarget:true,showCandidate:true,answer:'different',needClick:true},
      {title:'6 / 6 准备低压练习',text:'目标卡会一直陪着你。接下来先轻松练 3 次，不计正式成绩。',showTarget:true,showCandidate:true,answer:'same'}
    ];

    const app = document.getElementById('app');
    let timerId = null;
    let countdownId = null;
    let feedbackTimeout = null;

    const state = {
      screen:'home',
      adaptive: loadAdaptiveState(),
      tutorialStep:0,
      demoStars:0,
      practiceIndex:0,
      practiceFeedback:'',
      countdown:3,
      session:null,
      currentTrial:null,
      busy:false,
      pausedSnapshot:null,
      result:null
    };

    function safeReadLocalStorage(key){
      try { return window.localStorage.getItem(key); } catch(error) { return null; }
    }
    function safeWriteLocalStorage(key,value){
      try { window.localStorage.setItem(key,value); return true; } catch(error) { return false; }
    }
    function loadAdaptiveState(){
      const raw = safeReadLocalStorage(ADAPTIVE_STORAGE_KEY);
      if(!raw){ return {recommendedLevel:2,lastRound:null,history:[]}; }
      try{
        const parsed = JSON.parse(raw);
        const recommendedLevel = clampLevel(Number(parsed.recommendedLevel)||2);
        return {recommendedLevel,lastRound:parsed.lastRound||null,history:Array.isArray(parsed.history)?parsed.history.slice(0,6):[]};
      }catch(error){
        return {recommendedLevel:2,lastRound:null,history:[]};
      }
    }
    function saveAdaptiveState(summary,nextLevel){
      const history = [summary].concat(state.adaptive.history || []).slice(0,6);
      const payload = {recommendedLevel:nextLevel,lastRound:summary,history,updatedAt:new Date().toISOString(),mechanism:'自适应难度：localStorage 记录本轮表现，按正确率/用时自动升降，下轮使用推荐难度。'};
      const saved = safeWriteLocalStorage(ADAPTIVE_STORAGE_KEY, JSON.stringify(payload));
      state.adaptive = {recommendedLevel:nextLevel,lastRound:summary,history,saved};
      return saved;
    }
    function clampLevel(value){ return Math.max(1, Math.min(10, Math.round(value))); }
    function levelMeta(level){ return LEVELS[clampLevel(level)]; }
    function isAdvanced(level){ return clampLevel(level) >= 6; }
    function fmtLevel(level){ const meta = levelMeta(level); return meta.name + (isAdvanced(level) ? '｜进阶挑战' : ''); }
    function lastRoundText(){
      const r = state.adaptive.lastRound;
      if(!r) return '尚未开始。完成一轮后，这里会显示正确率、平均用时和下轮推荐难度。';
      return `上轮：正确率 ${Math.round(r.accuracy*100)}%，平均用时 ${r.avgSeconds.toFixed(1)} 秒，推荐 ${fmtLevel(state.adaptive.recommendedLevel)}。`;
    }
    function clearTimers(){
      if(timerId){ clearInterval(timerId); timerId = null; }
      if(countdownId){ clearInterval(countdownId); countdownId = null; }
      if(feedbackTimeout){ clearTimeout(feedbackTimeout); feedbackTimeout = null; }
    }
    function setScreen(name){ clearTimers(); state.screen = name; render(); }

    function render(){
      if(state.screen !== 'playing'){ clearInterval(timerId); timerId = null; }
      const renderer = {
        home: renderHome,
        detail: renderDetail,
        cover: renderCover,
        tutorial: renderTutorial,
        practice: renderPractice,
        ready: renderReady,
        countdown: renderCountdown,
        playing: renderPlaying,
        paused: renderPaused,
        result: renderResult
      }[state.screen];
      renderer();
    }

    function baseScreen(inner){
      return `<main class="screen"><div class="content">${inner}</div><div class="asset-note">图像资产：GPTImage2 生成后裁切为本地 PNG</div></main>`;
    }

    function renderHome(){
      const rec = state.adaptive.recommendedLevel;
      const recMeta = levelMeta(rec);
      app.innerHTML = baseScreen(`
        <img class="floating-star" src="${ASSETS.starBadge}" alt="星星徽章">
        <div class="top-strip">
          <span class="badge blue">任务编号：11-mental-rotation</span>
          <span id="hasAdaptive" class="badge green">自适应难度：已启用｜hasAdaptive=true｜localStorage</span>
        </div>
        <div class="home-grid">
          <section class="card">
            <img class="hero-img" src="${ASSETS.homeCard}" alt="转转积木伙伴首页卡片图">
            <h1 class="title" style="margin-top:18px">转转积木伙伴</h1>
            <p class="subtitle">看目标积木，找到转一转后一样的伙伴。</p>
            <div class="info-line">
              <p><b>怎么玩：</b>看目标积木，再选出转一转后一样的积木。</p>
              <p><b>目标是什么：</b>练习在脑中转动物体，找到相同形状。</p>
            </div>
            <div class="choice-bar" style="justify-content:flex-start">
              <button class="primary" onclick="setScreen('detail')">开始游戏</button>
              <button class="ghost" onclick="setScreen('detail')">游戏说明</button>
            </div>
          </section>
          <aside class="card col">
            <div class="soft-card">
              <h2 class="section-title">当前推荐难度</h2>
              <p style="font-size:34px;margin:0;font-weight:900;color:#2b6da8">${fmtLevel(rec)}</p>
              <p class="small">${rec <= 3 ? '1-3 级非常简单，适合轻松开始。' : recMeta.tip}</p>
              <p class="tiny">本轮表现：${lastRoundText()}</p>
              <p class="tiny">下轮推荐难度：结算页会按正确率/用时自动升降，并写入 localStorage。</p>
            </div>
            <div class="soft-card">
              <h2 class="section-title">自适应难度机制</h2>
              <p>页面文字和代码均包含自适应难度：localStorage 记录本轮表现；结算页显示“本轮表现”和“下轮推荐难度”；下轮按正确率/用时自动升降。</p>
            </div>
            <div class="source-box soft-card">
              <img src="${ASSETS.sourceThumb}" alt="GPTImage2 来源拼图缩略图">
              <div>

    function recommendationText(r){
      if(r.nextLevel > r.level) return '本轮表现稳定，下轮会稍微变难一点。难内容会标为“进阶挑战”。';
      if(r.nextLevel < r.level) return '下轮会更轻松一点，先把转身判断练稳。';
      return '下轮保持当前难度，继续巩固空间旋转。';
    }

    function cloneShape(shape){ return shape.map(c=>({...c})); }
    function normalizeShape(shape){
      const minX = Math.min(...shape.map(c=>c.x));
      const minY = Math.min(...shape.map(c=>c.y));
      return shape.map(c=>({...c,x:c.x-minX,y:c.y-minY}));
    }
    function rotateShape(shape, deg){
      let out = shape.map(c=>{
        if(deg === 90) return {...c,x:-c.y,y:c.x};
        if(deg === 180) return {...c,x:-c.x,y:-c.y};
        if(deg === 270) return {...c,x:c.y,y:-c.x};
        return {...c};
      });
      return normalizeShape(out);
    }
    function mirrorShape(shape){ return normalizeShape(shape.map(c=>({...c,x:-c.x}))); }
    function mutateShape(shape, level, forceSticker){
      const out = cloneShape(shape);
      if(forceSticker || level <= 2){
        const stickerIndex = out.findIndex(c=>c.sticker);
        if(stickerIndex >= 0) out[stickerIndex].sticker = false;
        out[out.length-1].sticker = true;
        if(level <= 1) out[0].color = 'purple';
      } else {
        const idx = out.length - 1;
        out[idx] = {...out[idx], x:out[idx].x+1, color:COLORS[(COLORS.indexOf(out[idx].color)+2)%COLORS.length]};
      }
      return normalizeShape(out);
    }
    function createTrial(level, index){
      const params = levelMeta(level);
      const target = normalizeShape(cloneShape(BASE_SHAPES[(index + level) % BASE_SHAPES.length]));
      const angle = params.angles[(index + Math.floor(Math.random()*params.angles.length)) % params.angles.length];
      const same = Math.random() < params.sameRatio;
      let candidate = rotateShape(target, angle);
      let answer = 'same';
      if(!same){
        answer = 'different';
        const useMirror = Math.random() < params.mirrorRatio;
        candidate = useMirror ? mirrorShape(candidate) : mutateShape(candidate, level, false);
      }
      return {target,candidate,angle,answer,startedAt:Date.now()};
    }
    function renderBuddy(shape, opts={}){
      const small = !!opts.small;
      const animated = !!opts.animated;
      const size = small ? 156 : 210;
      const cell = small ? 36 : 48;
      const gap = small ? 8 : 10;
      const maxX = Math.max(...shape.map(c=>c.x));
      const maxY = Math.max(...shape.map(c=>c.y));
      const width = (maxX+1)*cell + maxX*gap;
      const height = (maxY+1)*cell + maxY*gap;
      const offX = (size - width)/2;
      const offY = (size - height)/2;
      const cells = shape.map((c,i)=>{
        const left = offX + c.x*(cell+gap);
        const top = offY + c.y*(cell+gap);
        return `<div class="buddy-cell ${c.color}" style="left:${left}px;top:${top}px;width:${cell}px;height:${cell}px;border-radius:${small?10:13}px">${c.face?'<span class="face">•‿•</span>':''}${c.sticker?`<img class="sticker" src="${ASSETS.starBadge}" alt="星星贴纸">`:''}</div>`;
      }).join('');
      return `<div class="buddy-board ${animated?'rotation-anim':''}" style="width:${size}px;height:${size}px" role="img" aria-label="由彩色积木组成的伙伴，带星星贴纸">${cells}</div>`;
    }

    window.addEventListener('keydown', (event)=>{
      if(state.screen === 'playing'){
        if(event.key === '1' || event.key === 'ArrowLeft') answerTraining(true);
        if(event.key === '2' || event.key === 'ArrowRight') answerTraining(false);
        if(event.key.toLowerCase() === 'h') showHint();
        if(event.key.toLowerCase() === 'p') pauseGame();
      }
    });

    window.setScreen = setScreen;
    window.startTutorial = startTutorial;
    window.nextTutorial = nextTutorial;
    window.tutorialChoice = tutorialChoice;
    window.startPractice = startPractice;
    window.answerPractice = answerPractice;
    window.startCountdown = startCountdown;
    window.answerTraining = answerTraining;
    window.showHint = showHint;
    window.pauseGame = pauseGame;
    window.resumeGame = resumeGame;

    render();
  </script>
  <script src="../shared/unified.js"></script>
</body>
</html>
